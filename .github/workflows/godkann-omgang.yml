# Sätter status: godkand på granskade övningar efter att ägaren mergat dem (ADR 0013 avsnitt 4).
# Utlösaren är push till main, aldrig pull_request eller pull_request_target: ett arbetsflöde som
# utlöses av en pull request körs från pull requestens egen version av filen, och en gren skulle
# då kunna skriva om filen och få skrivrätt.
#
# Arbetsflödet kommer ikapp i stället för att följa en enskild push (ADR 0020). Varje körning
# letar upp alla övningar på main som står i granskad och knyter var och en till den merge som
# senast ändrade filen, alltså den merge som förde in exakt den text som stämplas. En körning som
# faller eller avbryts tappar därför ingen omgång: nästa körning, eller en dispatch, hittar samma
# filer. Det var precis det som gick förlorat för pull request #15 (körning 36387044602).
#
# workflow_dispatch tar inga indata. Den kör samma ikappskrivning som en push.
#
# Jobb 1 läser, validerar hela banken och skriver en plan över vad som skulle ändras. Jobb 2
# kräver miljön godkannande, som väntar på ägarens andra klick, och skriver bara det som står i
# planen. Båda jobben kör med contents: read: GITHUB_TOKEN kan inte skriva till main. Pushen sker
# i stället över SSH med deploy-nyckeln i hemligheten GODKANN_OMGANG_DEPLOY_KEY (ADR 0014).
name: Godkänn omgång

on:
  push:
    branches: [main]
    paths:
      - content/ovningar/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forbered:
    name: Validera banken och visa vad som skulle ändras
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      antal: ${{ steps.plan.outputs.antal }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      # Skrivningen pushar alltid till main. En dispatch från en annan gren skulle köra den
      # grenens version av den här filen, så den stoppas här. Det är ett skydd mot misstag; det
      # verkliga skyddet är att miljön godkannande bara släpper fram main.
      - name: Kontrollera grenen
        env:
          GREN: ${{ github.ref }}
        run: |
          if [ "$GREN" != "refs/heads/main" ]; then
            echo "Arbetsflödet körs bara på main, inte på $GREN. Ingenting skrivs." >&2
            exit 1
          fi

      - name: Hämta koden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hela historiken behövs: skriptet letar upp den merge som senast ändrade varje fil.
          fetch-depth: 0
          persist-credentials: false

      - name: Sätt upp Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Validera hela övningsbanken
        run: npm run validera:ovningar

      # Pull requesten och kontot i granskningsraden hämtas ur API:t, aldrig ur indata. Skriptet
      # försöker flera gånger när API:t svarar tomt eller med fel, eftersom kopplingen mellan en
      # merge-commit och dess pull request byggs med fördröjning. Hittas ändå ingen pull request
      # faller steget, så att felet syns som rött i stället för att omgången tyst hoppas över.
      - name: Torrkörning och plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          npm run --silent godkannande -- planera --repo "$REPO" --ut plan.json
          antal=$(node -e 'const p = JSON.parse(require("fs").readFileSync("plan.json", "utf8")); console.log(p.poster.length)')
          pr=$(node -e 'const p = JSON.parse(require("fs").readFileSync("plan.json", "utf8")); console.log([...new Set(p.poster.map((e) => "#" + e.pr))].join(", "))')
          {
            echo "plan=$(cat plan.json)"
            echo "antal=$antal"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"

  skriv:
    name: Sätt godkand på de granskade övningarna
    needs: forbered
    # Körs inte alls när ingen övning står i granskad, så att miljön inte ber om ett godkännande
    # i onödan. Statuscommiten utlöser en ny körning, och den slutar här.
    if: needs.forbered.outputs.antal != '' && needs.forbered.outputs.antal != '0'
    runs-on: ubuntu-latest
    # Två skrivningar får aldrig pusha samtidigt, och en väntande skrivning avbryts inte. GitHub
    # håller högst en väntande körning per grupp och avbryter den äldre när en ny kommer. Det är
    # ofarligt här: den nyare körningens plan lästes senare och omfattar allt den äldre hade.
    concurrency:
      group: godkann-omgang-skriv
      cancel-in-progress: false
    # Miljön väntar på ägarens andra klick, vid dispatch precis som vid push.
    environment: godkannande
    # Jobbet pushar med deploy-nyckeln, inte med GITHUB_TOKEN, så token behöver ingen skrivrätt.
    permissions:
      contents: read
    steps:
      - name: Hämta koden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Grenens topp, inte den commit som utlöste körningen: main kan ha gått vidare medan
          # jobbet väntade på miljön, och pushen ska vara en snabbspolning. Vad som skrivs styrs
          # av planen, som skriptet stämmer av fil för fil mot toppen.
          ref: main
          fetch-depth: 0
          # Den inbyggda token får inte ligga kvar i git-konfigurationen: den kan ändå inte
          # pusha till main, och pushen ska ske med deploy-nyckeln.
          persist-credentials: false

      - name: Sätt upp Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installera beroenden
        run: npm ci

      # Planen ska ha lästs ur main. Varje fil i den måste ha exakt den text torrkörningen visade,
      # och den texten måste vara den som kom in med planens merge. Annars skrivs ingenting alls.
      # En fil som redan blivit godkand hoppas över.
      - name: Sätt godkand
        env:
          PLAN: ${{ needs.forbered.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          bas=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).bas)' "$RUNNER_TEMP/plan.json")
          if ! git merge-base --is-ancestor "$bas" HEAD; then
            echo "Planen lästes ur $bas, som inte ligger på main. Ingenting skrivs." >&2
            exit 1
          fi
          npm run --silent godkannande -- tillampa --plan "$RUNNER_TEMP/plan.json" --skriv

      - name: Validera banken efter skrivningen
        run: npm run validera:ovningar

      # Nyckeln skrivs till en fil som bara körningen kan läsa, och pekas ut med core.sshCommand
      # så att den gäller pushen nedan. Värdnyckeln förankras med ssh-keyscan i stället för att
      # stängas av med StrictHostKeyChecking=no. Ingenting av detta echas.
      - name: Sätt upp deploy-nyckeln
        env:
          DEPLOY_KEY: ${{ secrets.GODKANN_OMGANG_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "Hemligheten GODKANN_OMGANG_DEPLOY_KEY saknas. Pushen kan inte ske." >&2
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/godkann-omgang"
          chmod 600 "$HOME/.ssh/godkann-omgang"
          ssh-keyscan github.com > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ssh-keyscan gav ingen värdnyckel för github.com. Pushen kan inte ske." >&2
            exit 1
          fi
          git config core.sshCommand \
            "ssh -i $HOME/.ssh/godkann-omgang -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

      - name: Committa och pusha till main
        env:
          PR: ${{ needs.forbered.outputs.pr }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/ovningar
          if git diff --cached --quiet; then
            echo "Inget att committa."
            exit 0
          fi
          git commit --message "Sätt godkand på omgången från pull request $PR"
          # Deploy-nyckeln är registrerad på liebertech/Fotbollsbanken och är den enda aktör
          # som regeluppsättningen Skydd av main gör undantag för (ADR 0014). Pushen sker utan
          # --force: går den inte som snabbspolning ska den falla, inte skriva om historiken.
          # Faller den för att main hunnit gå vidare räcker det att köra arbetsflödet igen.
          git push git@github.com:liebertech/Fotbollsbanken.git "HEAD:main"

      - name: Ta bort nyckelfilen
        if: always()
        run: |
          rm -f "$HOME/.ssh/godkann-omgang"
          git config --unset core.sshCommand || true
