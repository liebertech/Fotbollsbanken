# Kontroll av varje pull request: lint, typkontroll, tester och validering av
# övningsbanken. ADR 0002 beslut 4: förvalt GITHUB_TOKEN-läge är read-only, varje arbetsflöde
# begär bara det det behöver, ingen utlösare är pull_request_target och actions pinnas till
# en version (kommenterad SHA).
name: Kontroll

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kontroll-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sätt upp Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Formatering
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typkontroll
        run: npm run typecheck

      - name: Tester
        run: npm test

      # Varje generatorregel ska ha en @regel-tagg i koden och ett test med regel-ID:t i
      # namnet, utom de som står i undantagslistan (ADR 0011 avsnitt 7, ADR 0021).
      - name: Generatorreglernas spårbarhet
        run: npm run regler:tackning

      - name: Validera övningsbanken
        run: npm run validera:ovningar

      # Bygget körs i CI och inte bara hos Cloudflare, så att en övning som tyst faller ur
      # banken och ett bygge utan säkerhetsheaders upptäcks här (S-26, S-30, ADR 0002).
      - name: Bygge
        run: npm run build

      - name: Säkerhetsheaders i bygget
        run: |
          fil=dist/_headers
          if [ ! -f "$fil" ]; then
            echo "Bygget saknar $fil. ADR 0002 beslut 1 kräver headerfilen i det som laddas upp."
            exit 1
          fi
          for header in Content-Security-Policy Strict-Transport-Security X-Content-Type-Options Referrer-Policy; do
            if ! grep -q "^  $header:" "$fil"; then
              echo "$fil saknar $header (ADR 0002 beslut 1)."
              exit 1
            fi
          done
          # S-35: headernamnet säger ingenting om innehållet. En CSP försvagad till
          # default-src * hade passerat kontrollen ovan, så de bärande direktiven prövas var
          # för sig. Listan är avsiktligt kort: den fångar en försvagning, inte varje tillägg.
          csp=$(grep -m1 "^  Content-Security-Policy:" "$fil")
          for direktiv in "default-src 'self'" "form-action 'self'" "object-src 'none'" "base-uri 'none'" "frame-ancestors 'none'"; do
            case "$csp" in
              *"$direktiv"*) ;;
              *)
                echo "CSP:n i $fil saknar $direktiv (ADR 0002 beslut 1, S-35)."
                echo "Policyn som lästes: $csp"
                exit 1
                ;;
            esac
          done
          echo "Säkerhetsheaders och de bärande CSP-direktiven på plats i $fil."

      - name: Kända sårbarheter
        run: npm audit --audit-level=high

  # Playwright-testerna i Chromium, parallellt med kontroll. Konfigurationen bygger appen och
  # startar sina egna servrar (playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Hämta koden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sätt upp Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Läs Playwrights version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      # Webbläsaren cachas per Playwright-version. Systempaketen installeras ändå i nästa steg,
      # eftersom de inte ligger i cachen.
      - name: Cacha Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Installera Chromium
        run: npx playwright install --with-deps chromium

      - name: E2e-tester
        run: npm run test:e2e

      - name: Spara testrapporten
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Jobb-id:t är checkens namn i grenskyddet när jobbet saknar `name`, och ADR 0013 kräver att
  # den obligatoriska kontrollen heter godkannande. Ändra inte id:t.
  godkannande:
    # Kontrollen kör basgrenens kod, aldrig pull requestens, och läser pull requestens innehåll
    # som git-objekt (S-03, ADR 0013 avsnitt 3 lager 3).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Hämta basgrenens kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Hämta pull requestens commit
        env:
          HUVUD: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HUVUD"

      - name: Sätt upp Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installera beroenden från basgrenens låsfil
        run: npm ci

      - name: Kontrollera omgången
        env:
          BAS: ${{ github.event.pull_request.base.sha }}
          HUVUD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f scripts/godkannande.ts ]; then
            echo "Basgrenen saknar scripts/godkannande.ts, så kontrollen kan inte köras."
            echo "Kontrollen kör alltid basgrenens kod, aldrig pull requestens (S-03), och"
            echo "underkänner därför i stället för att släppa igenom när den saknas."
            echo "Det inträffar bara för den pull request som inför kontrollen. När den är"
            echo "mergad ligger skriptet på basgrenen och kontrollen kör som avsett."
            exit 1
          fi
          npm run godkannande -- kontroll --bas "$BAS" --huvud "$HUVUD"
