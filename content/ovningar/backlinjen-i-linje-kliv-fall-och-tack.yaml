schema: 1
id: backlinjen-i-linje-kliv-fall-och-tack
namn: "Backlinjen i linje: kliv, fall och täck"
syfte: Backlinjen ska röra sig tillsammans efter bollen, kliva upp eller falla på rop, täcka bakom
  varandra och ställa om vid bollvinst.
beskrivning: |
  Ett mål med målvakt står i ena kortsidan av en yta om 45 x 32 meter. Tre till
  fem försvarare står i en linje framför målet. Tre till sex anfallare passar
  fritt i en zon framför linjen, med halvt tempo i början. Linjen rör sig efter
  bollen: den faller när bollhållaren är vänd framåt utan press, och den
  kliver upp när bollen spelas bakåt eller bollhållaren pressas. Anfallarna
  får löpa bakom linjen och ta emot bollen där, och offside gäller. Vinner
  försvararna bollen spelar de den genom en av två konportar vid den motsatta
  kortlinjen. Målvakten eller mittbacken ropar "upp" och "fall" så att alla
  rör sig samtidigt.
organisation: |
  Åtta till femton spelare. Antalet i backlinjen och bland anfallarna: åtta
  spelare är tre backar och fyra anfallare, nio är tre och fem, tio är fyra
  och fem, elva är fyra och sex, tolv är fem och sex. Vid tretton till femton
  är backarna fem, och anfallarna går i två vågor om fyra och tre, fyra och
  fyra eller fem och fyra som byter efter varje anfall. Vågen som väntar står
  utanför ytan bakom kortlinjen, vid sidan av konportarna och inte i deras
  linje, och räknas inte på ytan. Målvakten står i mål. Spela serier om sex
  anfall med en minuts vila. Alla utespelare har ett nummer. Efter två serier
  byter rollerna: backarna blir anfallare, och lika många anfallare blir
  backar, i tur och ordning efter nummer, så att fördelningen ovan gäller och
  nästa byte fortsätter där det förra slutade. Målvakten står
  kvar. En ledare kan stå bakom målet och rätta. Bredden 32 meter är avsiktligt
  smalare än stora planens straffområde, eftersom en kompakt backlinje på fyra
  täcker ungefär den bredden. Målvakten har handskar.
fokusomraden:
  - forsvarsspel
  - omstallning
alder:
  min: 13
  max: 19
spelformer:
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 8
  max: 15
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 12
  langst: 20
yta:
  alla:
    langd: 45
    bredd: 32
ytreferens:
  alla: något längre än stora planens straffområde är brett
material:
  - typ: mal
    antal: 1
    anteckning: i den spelform ni tränar för, förankrat
  - typ: vast
    antal: 5
    anteckning: till backlinjen, så att anfallarnas vågor kan byta utan att byta västar
  - typ: boll
    antal: 5
  - typ: kon
    antal: 8
    anteckning: fyra bildar de två konportarna och fyra markerar ytans hörn
coachningspunkter:
  - Rop är nödvändiga, mittbacken ropar upp och fall, och alla rör sig samtidigt.
  - Håll linjen rak, kliv inte ensam och lämna ingen kvar bakom.
  - Den som står närmast bollen pressar, de andra täcker bakom honom eller henne.
  - Vinner ni bollen, spela ut genom konporten direkt.
varianter:
  lattare: Ingen offside och anfallarna passar i lugnt tempo utan att löpa bakom linjen.
  svarare: Anfallarna får bara två touchar och spelar i full fart, och linjen ska avgöra upp eller
    fall på under två sekunder. Anfallsserien är tio sekunder per anfall.
anpassning:
  fler_spelare: Vid fler än tolv spelare går anfallarna i två vågor som byter efter varje anfall.
    Ytan växer inte, eftersom den som väntar står utanför.
  udda_antal: Den extra spelaren är anfallare. Fördelningen av backar och anfallare för varje antal
    står i organisationen.
  ledare: Övningen är självgående när rollerna är satta, eftersom backlinjen styrs av egna rop. Ledaren
    står bakom målet och rättar linjen.
