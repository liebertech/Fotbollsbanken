kalla: Egen övning, inspirerad av allmänt kända former för att träna backlinjens rörelser.
status: granskad
granskning:
  - datum: 2026-10-08
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter fyra småfel som jag har rättat själv. Halvaktiva anfallare som kan löpa bakom
      linjen räknas som motståndare (F10): 96 kvadratmeter per spelare vid femton (golv 90), och de
      som väntar står utanför ytan, och 180 vid åtta (tak 181). Längden 45 klarar djupledskravet,
      och bredden 32 följer F9. Fördelningen av backar och anfallare står för varje antal 8-15, och
      ledarbehov 0 bärs av att linjen styrs av egna rop (F8). Rättat: 1. Rollbytet "backarna blir
      anfallare och tvärtom" gick inte ihop med att anfallarna är fler. Nu blir lika många
      anfallare backar i nummerordning. 2. Vågen som väntar stod bakom konportarna, där
      försvararna spelar ut bollen. Nu står den bakom kortlinjen vid sidan av portarna, och två av
      skissens platser är flyttade från (-2, 10) och (-2, 22) till (-2, 4) och (-2, 28). 3. I
      skissen löpte A1 bakom linjen (ordning 2) innan passningen slogs (ordning 3), alltså offside.
      Nu har löpningen och passningen samma ordning. 4. Västarna går till backlinjen, så att
      vågorna kan byta utan västbyte, och ledaren "kan" stå bakom målet. Ytreferensen, något längre
      än stora planens straffområde är brett, håller för 45 meter. Kvar i skissen: vid tretton
      spelare visar bilden sex anfallare på ytan och en utanför, fast vågorna är fyra och tre.
      Formatet kan inte flytta en spelare ut när gruppen växer, och skissens beskrivning säger var
      vågen står. Passningen bakom linjen håller 2,6 meter till B3 och 3,2 till platsen 33, 28.
