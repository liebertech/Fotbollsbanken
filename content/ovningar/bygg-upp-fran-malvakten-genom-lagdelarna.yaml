kalla: Egen övning, inspirerad av allmänt kända former för uppbyggnad från målvakten med halvaktiv press.
status: granskad
granskning:
  - datum: 2026-10-08
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter två ändringar som jag har gjort själv. Halvaktiva pressare räknas som
      motståndare (F10): 120 kvadratmeter per spelare vid tolv (golv 90) och 240 vid sex, 33
      procent över taket 181. Längden 45 klarar kravet för uppbyggnad genom lagdelar. Varannan
      uppbyggnad med inspark i 9 och 11 mot 11 och nedlagd boll i 7 mot 7 gör att alla tre
      spelformerna är rätt. Ringrotationen är entydig, och den svårare varianten är riktig press
      (designregel 19). Ändrat: 1. Vid elva och tolv spelare väntade en eller två bakom målet. I en
      Öva med halvaktiv press finns ingen anledning att vänta. Nu får elva en anfallare till och
      tolv en tredje pressare, så att alla är med. Tre halvaktiva pressare mot nio uppbyggare är
      fortfarande ett tydligt överläge. Beskrivningen, organisationen, västarna (tre) och lösningen
      för udda antal är ändrade efter det, och skissens två sista platser är flyttade från bakom
      målet till (34, 24) för den andra anfallaren och (28, 10) för den tredje pressaren. 2.
      Skälet till att taket överskrids står nu i organisationen (designregel 5). Ytreferensen,
      något längre än stora planens straffområde är brett, håller för 45 meter. Skissen är
      kontrollerad för hand: passningarna går målvakt, back, mittfältare och till anfallaren i
      målzonen, närmast 3,6 meter från pressaren. Den nya platsen (28, 10) håller 5,7 meter till
      den sista passningen och 6 meter till anfallaren.
