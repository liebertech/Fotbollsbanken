schema: 1
id: bygg-upp-fran-malvakten-genom-lagdelarna
namn: Bygg upp från målvakten genom lagdelarna
syfte: Spelarna ska bygga upp spelet från målvakten genom backar och mittfält till en anfallare,
  under halvaktiv press, med säkra passningar och ögonen uppåt.
beskrivning: |
  Målvakt, två till fyra backar, en eller två mittfältare och en eller två
  anfallare bygger upp från målet till en målzon, fem meter djup, i den andra
  änden av en yta om 45 x 32 meter. En till tre spelare är halvaktiva pressare: de
  stänger passningsvägar och går mot bollhållaren, men tar inte bollen.
  Uppbyggnaden är klar när anfallaren tar emot bollen i målzonen på
  fötterna. Målvakten startar med bollen vid fötterna eller i händerna. I
  nio mot nio och elva mot elva startar varannan uppbyggnad med inspark, och i
  sju mot sju lägger målvakten ned bollen, som i matchen. Efter en klar
  uppbyggnad börjar nästa direkt med en ny boll.
organisation: |
  Sex till tolv spelare, målvakten inräknad. Sex spelare är målvakt, två
  backar, en mittfältare, en anfallare och en pressare. Med sju spelare finns
  en pressare till, med åtta en back till, med nio en mittfältare till och med
  tio en back till, alltså fyra backar. Med elva finns en anfallare till och
  med tolv en tredje pressare, så att ingen behöver vänta. Pressarna har
  västar. Rotation: platserna ligger i en ring i ordningen pressarna,
  backarna, mittfältarna och anfallarna. Efter tre uppbyggnader flyttar alla
  en plats framåt i ringen, och den sista platsen går till pressare ett. Då
  pressar alla lika ofta. Målvakten står kvar och har handskar. Ytan är lika
  lång också för sex spelare, eftersom uppbyggnaden ska gå genom lagdelarna
  och behöver djup.
fokusomraden:
  - speluppbyggnad
  - malvaktsspel
  - passning-mottagning
alder:
  min: 13
  max: 19
spelformer:
  - 7mot7
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 6
  max: 12
grupptyp: fri
tid:
  kortast: 8
  rekommenderad: 12
  langst: 20
yta:
  alla:
    langd: 45
    bredd: 32
ytreferens:
  alla: något längre än stora planens straffområde är brett
material:
  - typ: mal
    antal: 1
    anteckning: i den spelform ni tränar för, förankrat
  - typ: vast
    antal: 3
    anteckning: till pressarna
  - typ: boll
    antal: 5
    anteckning: några vid målvakten
  - typ: kon
    antal: 6
    anteckning: två markerar målzonen och fyra ytans hörn
coachningspunkter:
  - Ta emot med kroppen vänd framåt och titta upp innan bollen kommer.
  - Erbjud en passningsväg, rör dig bort från pressaren.
  - Målvakten väljer säker passning först, långa bollar är inget alternativ.
  - Spela med få touchar när pressen kommer.
varianter:
  lattare: Pressarna står passiva som stolpar de första tre uppbyggnaderna, därefter halvaktiva.
  svarare: Pressarna får vinna bollen, och då ska de göra mål mot målvaktens mål inom åtta sekunder. Backarna
    och mittfältarna får högst två touchar.
anpassning:
  fler_spelare: Vid fler än tolv spelare byggs en andra yta bredvid med samma mått och eget mål.
  udda_antal: Spelar ingen roll. Den extra spelaren får den roll som organisationen anger för antalet,
    och rotationen flyttar alla en plats framåt.
  ledare: Övningen är självgående när rollerna är satta. Ledaren står vid sidan och rättar
    passningarna och rotationen.
