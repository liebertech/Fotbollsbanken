schema: 1
id: nickteknik-i-par-fran-kast-till-nick
namn: Nickteknik i par, från kast till nick
syfte: Spelarna ska lära sig grundtekniken för nickning med lätta bollar, att träffa bollen med pannan,
  ha ögonen öppna och styra nicken dit de vill.
beskrivning: |
  Paret står mitt emot varandra på en yta om 10 x 6 meter, fyra meter från
  varandra. En kastar bollen underifrån med händerna så att den kommer mjukt
  mot pannan. Den andra nickar tillbaka till kastarens händer. Steg ett är
  att nicka rakt tillbaka. Steg två är att nicka nedåt så att bollen studsar
  en gång före kastaren. Steg tre, svårare, är att nicka efter ett kort steg i
  sidled, med kastaren som flyttar sig lite mellan kasten. Bollen ska vara lätt,
  till exempel en något urluftad fotboll eller en skumboll, och 13-åringar
  använder storlek fyra. Byt roll efter tio kast. Varje spelare nickar högst
  tio gånger per omgång, och högst två omgångar för 13 och 14 år och tre
  omgångar för 15 till 19 år. Första omgången är steg ett och andra omgången
  steg två. Den tredje omgången upprepar steg två, eller är steg tre i den
  svårare varianten. När paret har nickat sina omgångar är nickningen slut,
  och resten av tiden tar nickaren emot kastet på bröstet eller låret och
  passar tillbaka längs marken.
organisation: |
  Ett par per yta, utan motståndare. Paret turas om: efter tio kast byter
  de, så att nickaren blir kastare och kastaren nickare. Med tre spelare i
  trion står den tredje bredvid kastaren och tar över kastet efter varje
  tionde kast. Kastaren blir nickare och nickaren går ut och blir den
  som väntar. Nästa varv tar den som väntade över kastet igen. Ledaren
  behövs inte för räkningen, eftersom antalet nickar är tio per roll, men kan
  gå runt och rätta tekniken. Flera par får egna ytor med minst tre meter
  mellan sig.
fokusomraden:
  - nickspel
  - passning-mottagning
alder:
  min: 13
  max: 19
spelformer:
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 2
  max: 2
grupptyp: par
tid:
  kortast: 5
  rekommenderad: 8
  langst: 12
yta:
  alla:
    langd: 10
    bredd: 6
material:
  - typ: boll
    antal: 1
    anteckning: lätt eller något urluftad, en per par, storlek fyra för 13-åringar
coachningspunkter:
  - Ha ögonen öppna och titta på bollen hela vägen in i pannan.
  - Träffa med pannan, inte med hjässan, och spänn nacken i själva träffen.
  - Använd hela kroppen, böj knäna och rör dig mot bollen.
  - Styr nicken dit du vill, nedåt och mot kastarens händer.
varianter:
  lattare: Kastaren kastar lägre och närmare, tre meter, och nickaren nickar rakt tillbaka utan
    att styra.
  svarare: Nick efter ett kort steg i sidled, och kastaren ropar vänster eller höger i sista stund så
    att nickaren hinner välja riktning med kort tid.
anpassning:
  fler_spelare: Fler par får egna ytor med minst tre meter mellan sig. Generatorn delar gruppen i par.
  udda_antal: Tre spelare gör en trio. Den tredje står bredvid kastaren, och efter varje tionde kast
    tar den tredje över kastet, kastaren blir nickare och nickaren går ut och väntar.
  ledare: Övningen är självgående. Ledaren kan gå runt och rätta tekniken och hålla ögonen på att
    ingen nickar mer än tio gånger per omgång.
planskiss:
  version: 1
  omrade:
    langd: 10
    bredd: 6
  beskrivning: >-
    Yta 10 x 6 meter med ett par, fyra meter från varandra. Kastaren till vänster kastar mjukt till
    nickaren, som nickar tillbaka till kastarens händer. Vid udda antal står en tredje spelare bredvid
    kastaren och tar över efter tio kast.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 10, bredd: 6, stil: streckad }
    - { id: ka, typ: spelare, x: 2.5, y: 3, lag: a, etikett: K }
    - { id: ni, typ: spelare, x: 6.5, y: 3, lag: a, etikett: N }
    - { typ: boll, x: 3.3, y: 3 }
  rorelser:
    - { typ: passning, fran: { objekt: ka }, till: { objekt: ni }, ordning: 1, etikett: Kast }
    - { typ: passning, fran: { objekt: ni }, till: { objekt: ka }, via: [{ x: 4.5, y: 1.8 }], ordning: 2, etikett: Nick }
  skalning:
