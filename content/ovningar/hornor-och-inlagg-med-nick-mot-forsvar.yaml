kalla: Egen övning, inspirerad av allmän hörnträning, anpassad efter SvFF:s riktlinje om begränsad
  nickmängd och efter hörnträningen i Hörnor med nickar för 13-14 år.
status: granskad
granskning:
  - datum: 2026-10-08
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter fyra småfel som jag har rättat själv. Märkt nickspel, 15-19 år, 9mot9 och
      11mot11, nivå 2-3 och längst 15 minuter, under nicktaket 20 (R-082) och enligt
      designregel 1. R-086 (pull request 39) gör att övningen bara väljs när ledaren har valt
      nickspel. Ledaren räknar nickarna, och ledaruppgiften säger det (F8). Ytan följer matchplanens
      bredd: 11mot11 30 x 60 ger 138 kvadratmeter per spelare vid tretton och 257 vid sju, 9mot9 30 x
      50 ger 115 och 214, alla inom golv 90 och tak 273. Sidförhållandet ändras 20 procent, under
      gränsen 25 (ADR 0019). Rättat: 1. "Fyra anfallare mot tre försvarare med målvakt" kunde läsas
      som åtta spelare. Nu: fyra anfallare, slagaren inräknad, mot två försvarare och en målvakt,
      som i skissen. 2. Lösningen för udda antal sa att den extra spelaren byter plats med en
      försvarare, fast lagen byter roll efter varje omgång. Nu följer den extra spelaren det
      anfallande laget, som i O6-04. 3. Nickmängden säger nu högst tre omgångar som anfallare och
      högst sex nickar per pass, och att ingen tvingas stå i mål. 4. Skissens beskrivning sa "den
      högra långa kortlinjen", nick från 6 meter och ledaren bakom målet. Nu: högra långsidan som
      är mållinjen, cirka 5 meter och ledaren vid mållinjen. Ytreferenserna är de två nya från F7
      och är införda i ytreferenser.md: knappt en tredjedel av 11 mot 11-planen på hela bredden
      (30 mot 33-37 meter, 9-19 procent kortare) och knappt halva 9 mot 9-planen (30 mot
      32,5-36). Skissen är kontrollerad för hand: hörnan går 2,4 meter från platsen 24, 17 och 2,7
      från F1, nicken går 1,7 meter förbi målvakten mot bortre delen av målet och håller 2,7 till
      platsen 27, 33.
