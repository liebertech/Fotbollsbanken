schema: 1
id: hornor-och-inlagg-med-nick-mot-forsvar
namn: Hörnor och inlägg med nick mot försvar
syfte: Spelarna ska tajma löpningar och nicka hörnor och inlägg mot ett försvar som markerar, och som
  försvarare markera och rensa undan faran.
beskrivning: |
  Två lag övar hörnor och inlägg vid ett mål med målvakt. Ytan följer matchplanens
  bredd, så att hörnflaggan står på rätt avstånd från stolparna: 30 x 60 meter i
  elva mot elva och 30 x 50 meter i nio mot nio, med målet på den långa linjen.
  Anfallarna löper i tajmade mönster mot första och bortre stolpen och avslutar
  med huvudet när inlägget passar, annars med foten. Försvararna markerar varsin
  anfallare och rensar. Vinner de bollen spelar de ut den till en konport vid
  straffområdets förlängning, så att försvaret avslutas med en passning och inte
  med en lång rensning. En omgång är sex hörnor eller inlägg. Varje anfallare
  nickar högst två gånger per omgång och högst tre omgångar per pass, och de
  första inläggen slås lätta och från nära håll innan farten och avståndet ökar.
organisation: |
  Två lag om sju till tretton spelare, målvakten inräknad. Fyra anfallare mot
  tre försvarare med målvakt vid sju spelare, och därefter fyller lagen på jämnt.
  Anfallarna numreras. Hörna ett slås av nummer ett, hörna två av nummer två och
  så vidare, och räcker inte antalet börjar numreringen om. Slagaren går in som
  löpare vid nästa hörna. Efter en omgång om sex hörnor byter lagen roll. Ledaren
  håller räkningen på nickarna och stoppar den som nått sin gräns, och det
  lämnas aldrig till spelarna. Målvakten har handskar. Står en utespelare i mål
  placeras skotten i stället för att skjutas hårt. Ytan är rymligare när antalet
  spelare är litet: det är medvetet, eftersom hörnan ska slås från rätt avstånd.
fokusomraden:
  - fasta-situationer
  - nickspel
  - forsvarsspel
alder:
  min: 15
  max: 19
spelformer:
  - 9mot9
  - 11mot11
niva:
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 1
ledaruppgift: Ledaren räknar nickarna och stoppar den som har nickat två gånger i omgången, slår
  de första lätta inläggen och rättar tajmingen i löpningarna.
spelare:
  min: 7
  max: 13
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 12
  langst: 15
yta:
  11mot11:
    langd: 30
    bredd: 60
  9mot9:
    langd: 30
    bredd: 50
ytreferens:
  11mot11: knappt en tredjedel av 11 mot 11-planen, på hela bredden
  9mot9: knappt halva 9 mot 9-planen
material:
  - typ: mal
    antal: 1
    anteckning: i den spelform ni tränar för, förankrat
  - typ: vast
    antal: 7
    anteckning: till det ena laget
  - typ: boll
    antal: 6
  - typ: kon
    antal: 3
    anteckning: en markerar hörnflaggans plats och två bildar konporten
  - typ: ovrigt
    antal: 1
    anteckning: målvaktshandskar till den som står i mål
coachningspunkter:
  - Tajma löpningen så att du möter bollen i stället för att stå still och vänta.
  - Möt bollen med pannan, blunda inte, och styr nicken nedåt mot mål.
  - Försvarare ska markera varsin anfallare redan innan hörnan slås.
  - Rensa bort från målet, och spela ut till konporten när ni vinner bollen.
varianter:
  lattare: Första omgången slås inläggen lätta från nära håll, och försvararna står passiva som
    stolpar. Därefter får de försvara fullt.
  svarare: Försvaret får en spelare mer, och inlägget slås med fart från hörnflaggan. Slagaren har
    tio sekunder från att bollen är död till att hörnan är slagen.
anpassning:
  fler_spelare: Vid fler än tretton spelare delar generatorn gruppen och bygger en andra yta med eget
    mål bredvid, eftersom hörnan annars får för många i boxen.
  udda_antal: Anfallslaget har en spelare mer. Den extra spelaren är slagare, och byter plats med
    en försvarare efter varje omgång, så att alla försvarar lika ofta.
  ledare: En ledare krävs för att hålla koll på nicktaket. Utan extra ledare håller den ordinarie
    ledaren i räkningen.
