schema: 1
id: omstallningsspel-9mot9
namn: Omställningsspel 9 mot 9
syfte: Spelarna ska ställa om snabbt till anfall och försvar i ett matchlikt spel med
  målvakt.
beskrivning: |
  Två lag om tre till fyra utespelare och varsin målvakt spelar på en yta om 36 x 22
  meter med mål i var ände. Så fort ett lag vinner bollen ska det anfalla snabbt innan
  motståndarna hinner organisera sig. Extra poäng ges för mål som görs inom tio sekunder
  efter en bollvinst.
organisation: |
  Två lag om tre till fyra utespelare plus varsin målvakt, totalt åtta till tio spelare
  per yta. Målvakterna byts av under passet så att fler får prova.
fokusomraden:
  - omstallning
  - forsvarsspel
alder:
  min: 13
  max: 14
spelformer:
  - 9mot9
niva:
  - niva-2
  - niva-3
passdelar:
  - del-spel
ledarbehov: 0
spelare:
  min: 8
  max: 10
grupptyp: tva-lag
tid:
  kortast: 10
  rekommenderad: 15
  langst: 20
yta:
  alla:
    langd: 36
    bredd: 22
material:
  - typ: mal
    antal: 2
  - typ: vast
    antal: 4
    anteckning: till det ena laget
  - typ: boll
    antal: 3
coachningspunkter:
  - Reagera direkt när bollen byter lag, stå inte kvar.
  - Sök djup snabbt när ditt lag just vunnit bollen.
  - Pressa bollhållaren direkt om ditt lag förlorar bollen.
varianter:
  lattare: Ta bort tidsgränsen och ge poäng för alla mål som görs efter en bollvinst.
  svarare: Bonuspoängen kräver mål inom fem sekunder efter bollvinsten i stället för tio.
anpassning:
  fler_spelare: Gör ytan större och spela med fler utespelare i varje lag.
  udda_antal: Ett lag spelar med en utespelare mer i stället för att sakna målvakt.
  ledare: Övningen är självgående. Ledaren dömer, byter målvakter och peppar från sidan.
kalla: Egen övning, inspirerad av allmänt kända omställningsspel i matchform.
status: utkast
granskning: []
