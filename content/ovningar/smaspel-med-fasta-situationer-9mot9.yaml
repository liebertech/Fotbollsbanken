schema: 1
id: smaspel-med-fasta-situationer-9mot9
namn: Smålagsspel med fasta situationer, 9 mot 9
syfte: Spelarna ska öva fasta situationer, inklusive inspark, som en naturlig del av ett
  vanligt matchspel.
beskrivning: |
  Två lag spelar mot varandra på en yta om 45 x 30 meter med fasta mål och varsin
  målvakt. Varje gång bollen går över kortlinjen efter att ha rört ett anfallande lag
  spelas ett inspark, precis som i 9 mot 9: bollen läggs i straffområdet och motståndarna
  ska stå minst nio meter bort tills den är i spel. Hörnor, inkast och frisparkar spelas
  också enligt de vanliga reglerna. Ledaren påminner om avstånd och snabb återstart.
organisation: |
  Två lag om upp till sju spelare, inklusive målvakt om gruppen är tillräckligt stor.
  Spelplanens hörn märks ut med markeringar.
fokusomraden:
