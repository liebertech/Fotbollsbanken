schema: 1
id: smaspel-med-fasta-situationer-9mot9
namn: Smålagsspel med fasta situationer, 9 mot 9
syfte: Spelarna ska öva fasta situationer, inklusive inspark, som en naturlig del av ett
  vanligt matchspel.
beskrivning: |
  Två lag spelar mot varandra på en yta om 45 x 30 meter med fasta mål, alltid med varsin
  målvakt. Varje gång bollen går över kortlinjen efter att ha rört ett anfallande lag
  spelas ett inspark, precis som i 9 mot 9: bollen läggs på en markerad punkt ungefär fem
  meter framför mål och motståndarna ska stå minst nio meter bort tills den är i spel.
  Hörnor, inkast och frisparkar spelas också enligt de vanliga reglerna. Ledaren påminner
  om avstånd och snabb återstart.
organisation: |
  Två lag per yta, alltid med varsin målvakt. Tio spelare: fyra mot fyra plus målvakter.
  Fjorton spelare: sex mot sex plus målvakter. Spelplanens hörn märks ut med markeringar,
  liksom insparkspunkten fem meter framför vartdera målet.
fokusomraden:
  - fasta-situationer
  - forsvarsspel
alder:
  min: 13
  max: 14
spelformer:
  - 9mot9
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spel
ledarbehov: 0
spelare:
  min: 10
  max: 14
grupptyp: tva-lag
tid:
  kortast: 10
  rekommenderad: 18
  langst: 22
yta:
  alla:
    langd: 45
    bredd: 30
material:
  - typ: mal
    antal: 2
  - typ: vast
    antal: 7
    anteckning: till det ena laget
  - typ: boll
    antal: 3
  - typ: markering
    antal: 4
    anteckning: hörnmarkeringar
  - typ: markering
    antal: 2
    anteckning: insparkspunkter, fem meter framför vartdera målet
coachningspunkter:
  - Var snabb ut i position vid en fast situation, stå inte still.
  - Håll rätt avstånd vid inspark, minst nio meter från bollen.
  - Organisera försvaret gemensamt inför varje fast situation, markera varsin
    motståndare.
  - Leta efter en snabb återstart när motståndarna inte är klara.
varianter:
  lattare: Bara inkast och frisparkar, inga hörnor eller inspark från straffområdet.
  svarare: Bara två toucher tillåtna efter varje fast situation.
anpassning:
  fler_spelare: Gör planen större och spela med fler spelare i varje lag.
  udda_antal: Ett lag får en spelare mer, eller en joker spelar med laget som har färre.
  ledare: Med en ledare som dömer blir de fasta situationerna mest matchlika. Utan ledare
    dömer lagen själva, vilket också tränar fair play.
kalla: Egen övning, inspirerad av vanligt smålagsspel med fasta situationer inbyggda.
status: utkast
granskning:
  - datum: 2026-09-23
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Insparken är rätt återgiven, men två saker gör att övningen inte går att köra som den står.
      Räkningen först: 45 x 30 meter är 1350 kvadratmeter, alltså 96,4 per spelare vid fjorton och
      135 vid tio, mellan golvet 70 och taket 181 för fas-13-14. Längden 45 meter passerar också
      minsta längd, 35 meter, även om längdkriteriet inte slår till här. Insparken: bollen ligger
      still i straffområdet och är i spel när den har sparkats och tydligt rört sig, motståndarna
      minst nio meter bort. Det stämmer med spelformer.md och SvFF:s spelformsblad för 9 mot 9,
      hämtat 2026-09-11. Två saker ska ändras. 1. Målvakten. Organisationen säger "inklusive
      målvakt om gruppen är tillräckligt stor", utan något antal. Det är samma otydlighet som jag
      fällde i matchspel 7 mot 7 i bredd i omgång 3, och här väger den tyngre: utan målvakt finns
      ingen inspark, och insparken är hela syftet. Skriv att båda lagen alltid har målvakt, och
      skriv ut lagstorleken per gruppstorlek, tio ger fyra mot fyra plus målvakter och fjorton sex
      mot sex plus målvakter. 2. Straffområdet finns inte utmärkt. Bollen ska läggas i
      straffområdet, men ytan har bara fyra hörnmarkeringar. Ange hur det markeras, eller skriv att
      insparken tas från en punkt ungefär fem meter framför mål och att motståndarna står nio meter
      därifrån. Det som stämmer i övrigt: fasta situationer och försvarsspel är kärnområden, tiden
      ligger under gränsen för spel och ledarbehov 0 är rätt (R-057).
