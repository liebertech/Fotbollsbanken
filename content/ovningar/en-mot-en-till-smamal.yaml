schema: 1
id: en-mot-en-till-smamal
namn: 1 mot 1 till småmål
syfte: Spelarna ska både anfalla och försvara i tävlingsmässiga duellar en mot en.
beskrivning: |
  Två spelare möts i en yta om 12 x 8 meter med ett litet mål i var ände. Båda kan göra mål
  i båda målen, och den som vinner bollen blir direkt anfallare. Extra bollar ligger vid
  sidan av ytan så att spelarna snabbt kan starta om när bollen går ut.
organisation: |
  En yta per par med ett minimål i var ände. Flera ytor läggs bredvid varandra så att alla
  par spelar samtidigt.
fokusomraden:
  - ett-mot-ett
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-1
  - niva-2
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 2
  max: 2
grupptyp: par
tid:
  kortast: 6
  rekommenderad: 10
  langst: 15
yta:
  alla:
    langd: 12
    bredd: 8
material:
  - typ: boll
    antal: 2
    anteckning: en i spel och en i reserv vid sidan av ytan
  - typ: minimal
    antal: 2
    anteckning: ett mål i var ände, två koner fungerar om minimål saknas
  - typ: kon
    antal: 4
coachningspunkter:
  - Var snabb i omställningen när du vinner bollen.
  - Använd kroppen för att skydda bollen i närkamp.
  - Möt anfallaren i vinkel, spring inte rakt mot bollen.
varianter:
  lattare: Bara en riktning att göra mål i, en spelare anfaller alltid.
  svarare: Sänk tidsgränsen för varje duell så att tempot ökar.
anpassning:
  fler_spelare: Lägg till fler ytor med par bredvid varandra.
  udda_antal: >-
    Vid udda antal blir en grupp en trio. Den tredje väntar vid sidan av ytan
    med reservbollen. Efter varje duell går hen in med bollen och byter plats
    med den som har spelat längst. Efter första duellen går den som startade
    med bollen ut. Då spelar alla två dueller och vilar en.
  ledare: Övningen sköter sig själv när paren väl har kommit igång.
planskiss:
  version: 1
  omrade:
    langd: 12
    bredd: 8
  beskrivning: >-
    Yta 12 x 8 meter med ett litet mål i var ände. Båda spelarna kan göra mål
    i båda målen, och den som vinner bollen blir direkt anfallare. En extra
    boll ligger vid sidan av ytan.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 12, bredd: 8, stil: streckad }
    - { typ: kon, x: 0, y: 0 }
    - { typ: kon, x: 12, y: 0 }
    - { typ: kon, x: 12, y: 8 }
    - { typ: kon, x: 0, y: 8 }
    - { id: mal-1, typ: mal, x: 0, y: 4, storlek: smamal, riktning: hoger }
    - { id: mal-2, typ: mal, x: 12, y: 4, storlek: smamal, riktning: vanster }
    - { id: sp-1, typ: spelare, x: 4, y: 4, lag: a, etikett: "1" }
    - { id: sp-2, typ: spelare, x: 8, y: 4, lag: b, etikett: "2" }
    - { typ: boll, x: 4.3, y: 4 }
    - { typ: boll, x: 5, y: 8.5 }
  rorelser:
    - typ: lopning
      fran: { objekt: sp-2 }
      till: { x: 6.5, y: 5 }
      ordning: 1
      etikett: Möter i vinkel
    - typ: dribbling
      fran: { objekt: sp-1 }
      till: { x: 9.5, y: 2.5 }
      via: [{ x: 7, y: 1.5 }]
      ordning: 2
    - { typ: skott, fran: { x: 9.5, y: 2.5 }, till: { objekt: mal-2 }, ordning: 3 }
  skalning:
    strategi: koer
    koer:
      - { vid: sp-1, riktning: 90, avstand: 4.9, etikett: Väntar med ny boll }
kalla: Egen övning, inspirerad av vanliga duellövningar mot småmål.
status: godkand
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: Duellspel mot småmål är kärninnehåll för fas-10-12 och coachningspunkterna om omställning, kroppsskydd och att möta anfallaren i vinkel är korrekta. Jag rättade tre saker. Materiallistan saknade boll helt, så jag lade till två bollar per par. Ytan var 8 x 6 meter, vilket är för trångt för att växla fart och möta i vinkel och ger onödig risk att springa in i målen, så jag ökade den till 12 x 8 meter. Beskrivningen sa att nästa par rullar in nya bollar, trots att alla par spelar samtidigt, så nu ligger extra bollar vid sidan av ytan. Jag skrev också att två koner kan ersätta minimålen, eftersom sex par kräver tolv småmål.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
  - datum: 2026-09-28
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Ingen ytreferens: för liten eller ingen plandel med rätt form. 12 x 8 meter är mindre än varje
      jämförelse i ordlistan som har rätt form. Facit i ytreferenser.md, avsnitt 6.2, anger kategorin
      duell med startavstånd, men övningen har inga bestämda startavstånd, båda spelarna rör sig fritt
      mellan två mål. Jag föreslår att facit rättas. Utfallet, ingen referens, är detsamma.
  - datum: 2026-10-05
    av: ovningsforfattare
    roll: ovningsforfattare
    kommentar: >-
      Skrev om anpassning.udda_antal enligt fotbollsexpertens mall för R-058 och
      lade till en kö i planskissen som visar den tredje spelaren vid sidan av
      ytan med reservbollen, enligt beslutet 2026-10-02.
