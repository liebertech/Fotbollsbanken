schema: 1
id: inovade-fasta-situationer
namn: Inövade fasta situationer
syfte: Spelarna ska lära sig lagets mönster för inkast, hörna, frispark och inspark, och avsluta
  med rätt timing och korta, säkra passningar.
beskrivning: |
  Gruppen övar fasta situationer mot ett mål med målvakt på en yta om 40 x 30
  meter, utan motståndare. Fyra roller: slagare, två löpare och avslutare.
  Gruppen kör tre varianter i tur och ordning, en runda per variant. Första
  varianten är inkast i anfallszonen: slagaren kastar in till löparens fötter,
  bollen går via en vägg till avslutaren som skjuter. Andra är kort hörna: slagaren
  spelar kort längs marken, löparen lägger bollen bakåt och avslutaren skjuter.
  Tredje är spelad frispark runt en mur av koner: slagaren passar vid sidan av
  muren, löparna löper bakom den och avslutaren tar emot och skjuter. I nio mot
  nio och elva mot elva läggs en fjärde variant till: inspark till en back som
  vänder upp. I sju mot sju ersätts den av målvaktens utspel från marken. Alla
  inlägg och hörnor slås längs marken eller i midjehöjd, inga höga bollar.
organisation: |
  En grupp om fem till nio spelare per mål. Rollerna är målvakt, slagare,
  löpare 1, löpare 2 och avslutare. Efter varje försök går slagaren till
  löpare 1, löpare 1 till löpare 2 och löpare 2 till avslutare. Avslutaren
  hämtar sin boll och ställer sig sist i kön, och den första i kön blir
  slagare. Kön står utanför ytan bakom slagarens plats och aldrig i en
  skottlinje. Med nio spelare är kön fyra, och det är den längsta kön som
  fungerar. Målvakten är lagets egen eller en spelare som vill, och har
  handskar. Står en utespelare i mål placeras skotten i stället för att
  skjutas hårt. Utan målvakt skjuter man på tomt mål. Muren är koner. Efter
  en runda om fem försök byter gruppen variant, och ledaren eller någon i
  gruppen ropar vilken som är näst.
fokusomraden:
  - fasta-situationer
  - passning-mottagning
  - avslut
alder:
  min: 13
  max: 19
spelformer:
  - 7mot7
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 5
  max: 9
grupptyp: fri
tid:
  kortast: 8
  rekommenderad: 12
  langst: 20
yta:
  alla:
    langd: 40
    bredd: 30
ytreferens:
  alla: stora planens straffområde, nästan dubbelt så djupt
material:
  - typ: mal
    antal: 1
    anteckning: i den spelform ni tränar för
  - typ: boll
    antal: 6
    anteckning: några vid slagaren och några vid målet
  - typ: kon
    antal: 6
    anteckning: fyra till muren och två till inspelsplatsen
  - typ: ovrigt
    antal: 1
    anteckning: målvaktshandskar till den som står i mål
coachningspunkter:
  - Bestäm varianten före bollen läggs på plats, alla ska veta sin roll.
  - Slå längs marken eller i midjehöjd, på rätt fot och med lagom fart.
  - Löpningen startar när slagaren rör bollen, inte före.
  - Avsluta direkt och sikta på hörnen, målvakten ska ha jobb.
varianter:
  lattare: Bara en variant åt gången, utan tidskrav, och slagaren väntar tills alla är på plats.
  svarare: Hela varianten ska vara klar inom tolv sekunder från att slagaren rör bollen, och löparna
    får högst två touchar. Ledaren ropar varianten i sista sekund.
anpassning:
  fler_spelare: Vid fler än nio spelare delar generatorn gruppen och bygger en andra yta med eget mål
    bredvid, eftersom kön annars blir för lång.
  udda_antal: Spelar ingen roll. Den som blir över står i kön och går in som slagare när turen kommer.
  ledare: Övningen är självgående när varianterna är bestämda. Ledaren kan stå bakom målet och
    rätta tajmingen och passningarnas fart.
planskiss:
  version: 1
  omrade:
    langd: 40
    bredd: 30
  beskrivning: >-
    Yta 40 x 30 meter med ett mål och en målvakt på högra kortsidan. Fem spelare i grunden. Inkast
    från sidlinjen till löpare 1, vidare till löpare 2 som passar till avslutaren, som skjuter från
    cirka 11 meter. Fler spelare ställer sig i kö bakom slagaren, utanför sidlinjen.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 40, bredd: 30, stil: heldragen }
    - { id: mal-1, typ: mal, x: 40, y: 15, storlek: 11mot11, riktning: vanster }
    - { id: mv, typ: spelare, x: 39, y: 15, lag: neutral, malvakt: true, etikett: MV }
    - { id: sl, typ: spelare, x: 25, y: 31, lag: a, etikett: S }
    - { id: l1, typ: spelare, x: 29, y: 23, lag: a, etikett: L1 }
    - { id: l2, typ: spelare, x: 33, y: 19, lag: a, etikett: L2 }
    - { id: av, typ: spelare, x: 22, y: 14, lag: a, etikett: A }
    - { typ: boll, x: 25, y: 30.2 }
  rorelser:
    - { typ: passning, fran: { objekt: sl }, till: { objekt: l1 }, ordning: 1, etikett: Inkast }
    - { typ: passning, fran: { objekt: l1 }, till: { objekt: l2 }, ordning: 2 }
    - { typ: lopning, fran: { objekt: av }, till: { x: 30, y: 12 }, ordning: 2 }
    - { typ: passning, fran: { objekt: l2 }, till: { x: 30, y: 12 }, ordning: 3 }
    - { typ: skott, fran: { x: 30, y: 12 }, till: { objekt: mal-1 }, ordning: 4 }
  skalning:
    strategi: koer
    koer:
      - { vid: sl, riktning: 180, etikett: Kö bakom slagaren }
kalla: Egen övning, inspirerad av allmänt kända träningsformer för fasta situationer.
