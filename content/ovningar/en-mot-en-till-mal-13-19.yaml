schema: 1
id: en-mot-en-till-mal-13-19
namn: 1 mot 1 till mål, 13-19 år
syfte: Spelarna ska utmana en motståndare med hög fart och snabbt avgöra
  dueller en mot en, både i anfall och försvar.
beskrivning: |
  Anfallaren startar med bollen tolv meter från ett litet mål. Försvararen
  startar sex meter från målet och får inte gå fram och pressa förrän
  anfallaren har rört bollen. Anfallaren försöker driva eller finta sig
  förbi och göra mål, försvararen försöker vinna bollen eller få den
  utanför ytan. Efter varje försök byter de två roller: den som blir ny
  försvarare hämtar reservbollen vid målet och rullar in den till den nya
  anfallaren. Nästa duell startar när båda står på plats.
organisation: |
  En yta per par med ett minimål i ena änden. Paret sköter rotationen
  själva: roll och startposition byts efter varje försök, och
  reservbollen vid målet gör att nästa duell kan starta utan att vänta på
  någon utifrån. Flera ytor läggs bredvid varandra om gruppen är större.
  Kör serier om fyra till sex dueller per spelare med en minuts vila
  mellan serierna. Nästa duell startar när båda står på plats.
fokusomraden:
  - ett-mot-ett
  - dribbling
  - snabbhet
alder:
  min: 13
  max: 19
spelformer:
  - 7mot7
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
  - del-spelovning
ledarbehov: 0
spelare:
  min: 2
  max: 2
grupptyp: par
tid:
  kortast: 8
  rekommenderad: 12
  langst: 20
yta:
  alla:
    langd: 16
    bredd: 12
material:
  - typ: minimal
    antal: 1
  - typ: boll
    antal: 2
    anteckning: en i spel och en i reserv vid målet
  - typ: kon
    antal: 4
    anteckning: markerar ytans hörn
coachningspunkter:
  - Möt anfallaren i vinkel, spring inte rakt mot bollen.
  - Skydda bollen med kroppen när försvararen kommer nära.
  - Accelerera i det ögonblick ytan öppnar sig, vänta inte på nästa touch.
  - Var snabb med avslutet så fort vägen till mål är öppen.
varianter:
  lattare: Försvararen väntar en extra sekund innan hen får gå fram och pressa.
  svarare: Försvararen får gå fram samtidigt som anfallaren startar, utan
    fördröjning.
anpassning:
  fler_spelare: Lägg fler ytor med samma uppställning bredvid, tre meters
    mellanrum.
  udda_antal: Vid udda antal blir en grupp en trio. Anfallet går alltid
    mot samma mål. Den tredje väntar med en boll strax utanför ytan,
    bakom anfallarens start. Efter varje duell blir anfallaren
    försvarare, försvararen hämtar bollen och ställer sig och väntar
    där, och den som väntade anfaller direkt. Då har alla varje roll en
    gång per varv.
  ledare: Övningen sköter sig själv när paret har förstått rotationen. En
    ledare kan gå mellan ytorna och ge tips om vinkel och timing.
planskiss:
  version: 1
  omrade:
    langd: 16
    bredd: 12
  beskrivning: >-
    Yta 16 x 12 meter med ett minimål på vänstra kortsidan. Anfallaren
    startar med boll tolv meter från målet, försvararen sex meter från
    målet. Efter varje försök byter de roll och startposition. Vid udda
    antal väntar en tredje bakom anfallarens start med en boll.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 16, bredd: 12, stil: heldragen }
    - { id: mal-a, typ: mal, x: 0, y: 6, storlek: smamal, riktning: hoger }
    - { id: anf, typ: spelare, x: 12, y: 6, lag: a, etikett: A }
    - { id: forsv, typ: spelare, x: 6, y: 6, lag: b, etikett: F }
    - { typ: boll, x: 12.9, y: 6 }
  rorelser:
    - typ: dribbling
      fran: { objekt: anf }
      till: { x: 4, y: 3 }
      via: [{ x: 8, y: 5 }]
      ordning: 1
    - { typ: lopning, fran: { objekt: forsv }, till: { x: 5, y: 5 }, ordning: 1 }
    - { typ: skott, fran: { x: 4, y: 3 }, till: { objekt: mal-a }, ordning: 2 }
  skalning:
    strategi: koer
    koer:
      - { vid: anf, riktning: 0, avstand: 5, etikett: Nästa anfallare väntar }
kalla: Egen övning, inspirerad av vanliga 1 mot 1-dueller till mål i
  ungdomsfotboll.
status: granskad
granskning:
  - datum: 2026-10-06
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Duellen är rätt, med startavstånden 12 och 6 meter och en försvarare som väntar tills
      anfallaren rört bollen. Paret har 96 kvadratmeter per spelare, över golvet 90. Räknad som
      Bézierkurva håller dribblingen 1,4 meter till försvararen. Ingen ytreferens: duell med
      startavstånd (ytreferenser.md, avsnitt 4). Tre saker ska ändras. 1. Trion säger inte vem
      som går vart. Anfallet går alltid mot samma mål. Den tredje väntar med en boll bakom
      anfallarens start. Anfallaren blir försvarare, försvararen hämtar bollen och väntar där,
      och den som väntade anfaller. 2. Kön stod inne i ytan, 1,5 meter från anfallaren. Ändra
      den till riktning 0, avstand 5 och etiketten "Nästa anfallare väntar", och skriv trion i
      skissens beskrivning. 3. Snabbhet kräver vila. Kör serier om fyra till sex dueller per
      spelare med en minuts vila emellan, och starta nästa duell när båda står på plats. Exakta
      texter står i docs/doman/granskning-omgang-5.md, B6.
  - datum: 2026-10-06
    av: ovningsforfattare
    roll: ovningsforfattare
    kommentar: >-
      Alla tre punkterna åtgärdade. Skrev om anpassning.udda_antal så att det
      står exakt vem som går vart i trion: anfallaren blir försvarare,
      försvararen hämtar bollen och väntar, och den som väntade anfaller
      direkt. Ändrade skissens kö till riktning 0 och avstand 5 med
      etiketten "Nästa anfallare väntar", och lade till en mening om trion i
      skissens beskrivning. Lade till en mening i organisation om serier om
      fyra till sex dueller per spelare med en minuts vila mellan serierna.
  - datum: 2026-10-06
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Nästan klar, men en sak är kvar. Trion, kön och serierna med vila är införda, och skissen
      är kontrollerad: kön står på (17, 6), 1 meter utanför kortlinjen och bort från målet.
      Dribblingen håller 1,4 meter till försvararen. Men beskrivningen slutar fortfarande med
      "som startar nästa duell direkt". Det säger emot organisationen, där nästa duell startar
      när båda står på plats, och det tar bort vilan som snabbheten kräver. Ersätt den sista
      meningen i beskrivning med exakt: "Efter varje försök byter de två roller: den som blir ny
      försvarare hämtar reservbollen vid målet och rullar in den till den nya anfallaren. Nästa
      duell startar när båda står på plats." Inget annat behöver ändras.
  - datum: 2026-10-06
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller. Den sista meningen i beskrivningen står nu exakt som i förra raden, och
      beskrivningen och organisationen säger samma sak: nästa duell startar när båda står på
      plats, med serier och vila emellan. Inget annat i filen är ändrat sedan förra raden.
      Trion, kön på (17, 6) och skissen håller som förut. Ingen ytreferens: duell med
      startavstånd (ytreferenser.md, avsnitt 4). Rättelsen fördes in av huvudsessionen (commit
      729056b), inte av övningsförfattaren, och har därför ingen egen rad från författaren.
