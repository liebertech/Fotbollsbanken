schema: 1
id: forsvara-djupet-backlinje-mot-anfall
namn: "Försvara djupet: backlinje mot anfall med offside"
syfte: Backlinjen ska försvara djupet tillsammans med offside, och laget ska bygga upp spelet
  direkt efter bollvinst.
beskrivning: |
  Samma yta som i backlinjeövningen, 45 x 32 meter, men med fullt spel. Ett
  försvarslag med målvakt och tre till fem i backlinjen försvarar ett mål i
  ena kortsidan. Anfallslaget med tre till sex spelare, och en joker vid
  udda antal, anfaller målet. Offside gäller. Vinner försvararna bollen ska de
  bygga upp via målvakten eller en back och spela bollen till en medspelare
  som tar emot i en målzon, fem meter djup, vid den motsatta kortlinjen. Lyckas
  det får försvarslaget en poäng. Anfallarna får en poäng för varje mål.
  Efter mål, poäng eller utboll startar anfallarna med en ny boll från sin
  kortlinje.
organisation: |
  Åtta till femton spelare. Försvarslaget är målvakt och backlinje, anfallslaget
  resten. Åtta spelare är målvakt och tre backar mot fyra anfallare, nio är
  samma med en joker, tio är målvakt och fyra backar mot fem anfallare, elva
  samma med joker, tolv är målvakt och fem backar mot sex anfallare, och tretton
  samma med joker. Jokern räknas som anfallare och spelar bara med
  anfallslaget. Vid fjorton och femton spelare är det tretton på ytan och en
  eller två avbytare utanför, som byter in efter varje period med den
  anfallare som har lägst nummer. Spela tre minuter, vila en minut, och byt
  roller mellan lagen varannan period. Målvakten har handskar.
fokusomraden:
  - forsvarsspel
  - speluppbyggnad
  - omstallning
alder:
  min: 13
  max: 19
spelformer:
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 8
  max: 15
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 15
  langst: 25
yta:
  alla:
    langd: 45
    bredd: 32
ytreferens:
  alla: något längre än stora planens straffområde är brett
material:
  - typ: mal
    antal: 1
    anteckning: i den spelform ni tränar för, förankrat
  - typ: vast
    antal: 7
    anteckning: till anfallarna, en annan färg till jokern
  - typ: boll
    antal: 5
  - typ: kon
    antal: 8
    anteckning: fyra markerar målzonen och fyra ytans hörn
coachningspunkter:
  - Håll linjen samlad och döm offside tillsammans, rop på upp och fall.
  - Pressa bollen eller falla, ingen står kvar mitt emellan.
  - Vid bollvinst, spela säkert via målvakten eller en back, ta emot med blicken uppåt.
  - Anfallarna ska löpa i djupet och vara redo att vända om de blir offside.
varianter:
  lattare: Ingen offside, och anfallarna har en spelare färre så att försvarslaget får tid att bygga upp.
  svarare: Poängen för uppbyggnaden gäller bara om den sker inom sex sekunder, med anfallarna kvar och
    pressande, och anfallarna får bara två touchar.
anpassning:
  fler_spelare: Vid fler än tretton spelare står de extra utanför ytan som avbytare och byter in efter
    varje period, i tur och ordning efter nummer.
  udda_antal: Anfallslaget får en joker som spelar med anfallarna. Antalet backar och anfallare för
    varje antal står i organisationen.
  ledare: Övningen är självgående när reglerna är satta. Ledaren dömer offside och coachar
    backlinjens rop från sidan.
