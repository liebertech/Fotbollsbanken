schema: 1
id: en-mot-en-till-tva-mal
namn: 1 mot 1 till två mål
syfte: Spelarna ska utmana motståndaren i 1 mot 1 och göra mål i ett litet lagspel.
beskrivning: |
  Två lag om två till tre spelare möts på en yta om 18 x 12 meter med ett litet mål i var
  ände. Vanliga mål ger en poäng. En extra poäng ges för mål som föregås av att spelaren
  dribblat förbi en direkt motståndare på väg mot mål.
organisation: |
  Två lag om två till tre spelare per yta. Flera ytor läggs bredvid varandra om gruppen är
  större, med tre meters mellanrum.
fokusomraden:
  - ett-mot-ett
  - avslut
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-1
  - niva-2
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 4
  max: 6
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 10
  langst: 12
yta:
  alla:
    langd: 18
    bredd: 12
material:
  - typ: minimal
    antal: 2
  - typ: vast
    antal: 3
    anteckning: till det ena laget
  - typ: boll
    antal: 2
coachningspunkter:
  - Utmana motståndaren i stället för att passa bort bollen direkt.
  - Skydda bollen med kroppen i närkampen.
  - Var snabb i omställningen när du vinner bollen, du blir direkt anfallare.
varianter:
  lattare: Försvararna får bara gå, inte springa, när de pressar bollhållaren.
  svarare: Bonuspoängen kräver att spelaren dribblat förbi två motståndare i samma anfall.
anpassning:
  fler_spelare: Lägg fler ytor bredvid varandra med samma mått och tre meters mellanrum.
  udda_antal: Den udda spelaren blir en joker som alltid spelar med laget som har bollen.
  ledare: Övningen är självgående. Ledaren dömer bonuspoängen och peppar från sidan.
kalla: Egen övning, inspirerad av vanligt smålagsspel till småmål med bonus för 1 mot 1.
status: utkast
