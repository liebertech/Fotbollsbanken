schema: 1
id: passningsruta-i-rorelse
namn: Passningsruta i rörelse
syfte: Spelarna ska passa med rätt kraft och riktning och röra sig direkt till en ny fri yta efter passningen.
beskrivning: |
  Fyra spelare rör sig fritt i en ruta på 10 x 10 meter och håller igång en boll med
  passningar. Efter varje passning rör sig spelaren till en ny öppen del av rutan i
  stället för att stå still. Ingen motståndare är med.
organisation: |
  En ruta om fyra spelare, markerad med koner i hörnen. Fler rutor läggs bredvid varandra
  vid fler spelare.
fokusomraden:
  - passning-mottagning
  - spelbarhet
alder:
  min: 10
  max: 12
spelformer:
  - 5mot5
  - 7mot7
  - 9mot9
niva:
  - niva-1
  - niva-2
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 4
grupptyp: fast-storlek
udda_antal_losning: true
tid:
  kortast: 8
  rekommenderad: 12
  langst: 15
yta:
  alla:
    langd: 10
    bredd: 10
material:
  - typ: boll
    antal: 1
    anteckning: en per grupp
  - typ: kon
    antal: 4
coachningspunkter:
  - Passa till en spelare som rör sig mot en öppen yta.
  - Ta emot bollen med första touchen riktad framåt.
  - Rör dig direkt efter passningen, stå inte still.
varianter:
  lattare: Stå i fasta hörn och passa i ett fast mönster.
  svarare: Tillåt bara två toucher per spelare innan bollen ska passas vidare.
anpassning:
  fler_spelare: Lägg till fler rutor med fyra spelare i varje bredvid varandra.
  udda_antal: Den femte spelaren går in i rutan, en vilar och byter in efter någon minut.
  ledare: Utan ledare klarar sig övningen själv när den väl är igång.
planskiss:
  version: 1
  omrade:
    langd: 10
    bredd: 10
  beskrivning: >-
    Ruta 10 x 10 meter med en kon i varje hörn. Fyra spelare rör sig fritt och håller
    igång en boll med passningar. Efter varje passning rör sig spelaren till en ny
    öppen del av rutan.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 10, bredd: 10, stil: streckad }
    - { typ: kon, x: 0, y: 0 }
    - { typ: kon, x: 10, y: 0 }
    - { typ: kon, x: 10, y: 10 }
    - { typ: kon, x: 0, y: 10 }
    - { id: p1, typ: spelare, x: 2, y: 2, lag: a }
    - { id: p2, typ: spelare, x: 8, y: 2, lag: a }
    - { id: p3, typ: spelare, x: 8, y: 8, lag: a }
    - { id: p4, typ: spelare, x: 2, y: 8, lag: a }
    - { typ: boll, x: 2.8, y: 2 }
  rorelser:
    - { typ: passning, fran: { objekt: p1 }, till: { objekt: p3 }, ordning: 1 }
    - { typ: lopning, fran: { objekt: p1 }, till: { x: 5, y: 7 }, ordning: 2 }
    - { typ: lopning, fran: { objekt: p2 }, till: { x: 5, y: 3 }, ordning: 2 }
  skalning:
    strategi: koer
    koer:
      - { vid: p1, riktning: 270, avstand: 3.5, etikett: "Vilande, byter in" }
kalla: Egen övning, inspirerad av allmänt känd passningsövning i rörlig ruta.
status: godkand
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: Godkänd utan ändringar. Syftet, huvudfokus passning-mottagning och innehållet hänger ihop, och första touchen och rörelsen efter passningen är rätt innehåll för fas-10-12. Fyra spelare och en boll på 10 x 10 meter ger många bollkontakter utan kö, övningen är självgående när den är igång, och de båda varianterna är verkliga steg i svårighet. Lösningen för udda antal med en femte spelare som byter in fungerar.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
  - datum: 2026-09-28
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Ingen ytreferens: för liten eller ingen plandel med rätt form. En kvadrat om 10 x 10 meter har
      ingen motsvarighet bland planens linjer. Facit i ytreferenser.md, avsnitt 6.2, anger fasta
      positioner, men spelarna rör sig fritt i rutan och ingen motståndare är med. Jag föreslår att
      facit rättas. Utfallet, ingen referens, är detsamma.
  - datum: 2026-10-07
    av: huvudsession
    roll: huvudsession
    kommentar: >-
      Omgång 5B: spelformer ändrade från [7mot7] till [5mot5, 7mot7, 9mot9] enligt
      fotbollsexpertens lista i docs/doman/plan-omgang-5b.md, införd mekaniskt. Inga andra fält ändrade.
