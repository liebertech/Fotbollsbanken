schema: 1
id: omstallning-med-jokrar
namn: Omställning med jokrar
syfte: Spelarna ska ställa om snabbt både till anfall och försvar när bollen byter lag.
beskrivning: |
  Två lag om fyra spelare möts på en yta om 35 x 25 meter med två jokrar som alltid
  spelar med laget som har bollen. Så fort ett lag vinner bollen ska det anfalla snabbt
  innan motståndarna hinner organisera sig, och det lag som förlorar bollen ska pressa
  direkt för att vinna tillbaka den.
organisation: |
  Två lag om fyra spelare plus två jokrar, totalt upp till tio spelare per yta. Mål eller
  minimål i var ände.
fokusomraden:
  - omstallning
  - spelbarhet
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 6
  max: 10
grupptyp: tva-lag
tid:
  kortast: 10
  rekommenderad: 14
  langst: 15
yta:
  alla:
    langd: 35
    bredd: 25
ytreferens:
  alla: ungefär halva 7 mot 7-planen
material:
  - typ: vast
    antal: 6
    anteckning: fyra i en färg till det ena laget och två i en annan färg till jokrarna
  - typ: boll
    antal: 2
  - typ: minimal
    antal: 2
coachningspunkter:
  - Reagera direkt när bollen byter lag, stå inte kvar.
  - Sök djup snabbt när ditt lag just vunnit bollen.
  - Pressa bollhållaren direkt om ditt lag förlorar bollen.
varianter:
  lattare: Ingen press tillåten de första två sekunderna efter en bollvinst.
  svarare: Ta bort jokrarna så att lagen möts jämnt.
anpassning:
  fler_spelare: Gör ytan större och lägg till en spelare i varje lag.
  udda_antal: Den udda spelaren blir en tredje joker som alltid spelar med bollförande lag.
  ledare: Övningen är självgående när lagen och reglerna är satta.
planskiss:
  version: 1
  omrade:
    langd: 35
    bredd: 25
  beskrivning: >-
    Yta 35 x 25 meter med ett minimål i var ände. Två mot två med två jokrar som
    alltid spelar med laget som har bollen. Fler spelare går in i lagen, upp till
    fyra mot fyra. Vid udda antal blir den udda spelaren en tredje joker, men
    bilden visar då ett lag med en spelare mer.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 35, bredd: 25, stil: streckad }
    - { id: mal-a, typ: mal, x: 0, y: 12.5, storlek: smamal, riktning: hoger }
    - { id: mal-b, typ: mal, x: 35, y: 12.5, storlek: smamal, riktning: vanster }
    - { id: a1, typ: spelare, x: 10, y: 8, lag: a }
    - { id: a2, typ: spelare, x: 10, y: 17, lag: a }
    - { id: b1, typ: spelare, x: 25, y: 8, lag: b }
    - { id: b2, typ: spelare, x: 25, y: 17, lag: b }
    - { id: j1, typ: spelare, x: 17.5, y: 8, lag: neutral }
    - { id: j2, typ: spelare, x: 17.5, y: 17, lag: neutral }
    - { typ: boll, x: 10.8, y: 8 }
  rorelser:
    - { typ: passning, fran: { objekt: a1 }, till: { objekt: j1 }, ordning: 1 }
    - { typ: lopning, fran: { objekt: b1 }, till: { x: 18, y: 9 }, ordning: 1 }
    - { typ: passning, fran: { objekt: j1 }, till: { objekt: a2 }, ordning: 2 }
  skalning:
    strategi: platser
    platser:
      - { x: 6, y: 12.5, lag: a }
      - { x: 29, y: 12.5, lag: b }
      - { x: 13, y: 4, lag: a }
      - { x: 22, y: 21, lag: b }
kalla: Egen övning, inspirerad av allmänt kända omställningsspel med jokrar.
status: godkand
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: Omställning är kärnområde för fas-10-12 och jokrarna gör att bollen byter lag ofta, vilket är precis det spelarna ska öva. Ytan 35 x 25 meter för upp till tio spelare ger utrymme att kontra, tiden ligger inom gränsen för en spelövning i fasen och övningen är självgående. Jag rättade materiallistan, som angav två västar för två lag. Antalet avser antal plagg, och jokrarna måste dessutom synas i en egen färg, så det står nu fyra västar i en färg till det ena laget och två i en annan till jokrarna. Lösningen för udda antal med en tredje joker fungerar.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
