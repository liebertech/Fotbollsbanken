schema: 1
id: malvaktsspel-i-smaspel
namn: Målvaktsspel i smålagsspel
syfte: Spelarna, särskilt målvakterna, ska öva utkast och passningsspel med fötterna i ett matchlikt spel.
beskrivning: |
  Två lag spelar mot varandra med varsin målvakt på en yta om 50 x 30 meter. Retreatlinjerna
  märks ut sju meter från mittlinjen på varje planhalva, och när målvakten har bollen backar
  motståndarna dit tills bollen är utspelad, precis som i 7 mot 7. Extra poäng ges för mål
  som föregås av att målvakten spelat ut bollen med fötterna i stället för med händerna.
  Båda målvakterna byts av under passet så att fler får prova.
organisation: |
  Två lag om upp till sju spelare vardera, inklusive en målvakt per lag. En ledare vid
  varje mål coachar respektive målvakt.
fokusomraden:
  - malvaktsspel
  - speluppbyggnad
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-2
passdelar:
  - del-spel
ledarbehov: 2
ledaruppgift: En ledare vid varje mål coachar sin målvakt i utkast, positionering och spel med
  fötterna, och styr byte av vem som står i mål.
spelare:
  min: 10
  max: 14
grupptyp: tva-lag
tid:
  kortast: 12
  rekommenderad: 20
  langst: 25
yta:
  alla:
    langd: 50
    bredd: 30
ytreferens:
  alla: hela 7 mot 7-planen, ungefär en fjärdedel av stora planen
material:
  - typ: mal
    antal: 2
  - typ: vast
    antal: 7
    anteckning: till det ena laget
  - typ: boll
    antal: 3
  - typ: kon
    antal: 4
    anteckning: två per retreatlinje, ställs utanför sidlinjen
coachningspunkter:
  - Målvakten lägger ner bollen och passar i stället för att sparka långt.
  - Sök en fri medspelare innan du spelar ut bollen.
  - Backa till rätt position i mål efter varje spelvändning.
varianter:
  lattare: Målvakten får kasta ut bollen med händerna mot en fri medspelare.
  svarare: Bara två toucher tillåtna för utespelarna i egen planhalva.
anpassning:
  fler_spelare: Gör planen större och spela med fullstora mål och fler spelare i laget.
  udda_antal: Ett lag får en utespelare mer i stället för att sakna målvakt.
  ledare: Med bara en ledare coachas målvakterna växelvis, en period i taget.
kalla: Egen övning, inspirerad av vanligt smålagsspel med fokus på målvaktens spel med fötterna.
status: godkand
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Innehållet stämmer med 7 mot 7, där målvakten lägger ner bollen och passar i stället för att
      sparka ut den ur händerna, och poängregeln gör att det händer ofta. Ytan 50 x 30 meter är
      spelformens minsta mått och att flera får prova målvaktsrollen följer det som gäller för
      fasen. Ledarbehov 2 är rimligt här, eftersom två målvakter ska coachas samtidigt, men det
      betyder att övningen bara kan väljas när minst två ledare finns. Jag lade till retreatlinjerna
      i beskrivningen med koner i materiallistan. Utan dem faller själva poängen med övningen, för
      det är retreatlinjen som ger målvakten tid att spela ut bollen med fötterna. Västarna angavs
      som två för två lag, men antalet avser antal plagg, så det står nu sju till det ena laget.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
