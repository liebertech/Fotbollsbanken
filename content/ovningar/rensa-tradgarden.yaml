schema: 1
id: rensa-tradgarden
namn: Rensa trädgården
syfte: Spelarna ska stoppa en rullande boll under foten och passa den längs marken med insidan.
beskrivning: |
  Två lag står i var sin halva av en yta om 18 x 12 meter. Mitt på ytan finns en fri zon, ungefär
  2 meter på var sida om mittlinjen, markerad med koner, där ingen får stå. Alla har en boll från
  start. På signal passar alla sina bollar längs marken med insidan över till den andra halvan,
  för att rensa sin egen trädgård. En boll som kommer in i den egna halvan stoppas under foten
  innan den passas tillbaka. På "stopp" fryser alla, och lagen räknar bollarna i sin halva. Det
  lag som har färst bollar vinner omgången. I uppvärmningen räcker att passa med insidan och
  stoppa. I Öva passar man varannan boll med den fot man tycker är svårast, och bollen ska stoppas
  helt innan den passas.
organisation: |
  Två lag, en halva var, och en omgång tar ungefär en minut. Lagen byter halva efter varje omgång.
  Ingen står i den fria zonen, och bollar som stannar där hämtas först efter "stopp". Är ni färre
  än åtta spelare görs ytan ungefär 14 x 9 meter, med samma fria zon. Två ytor ryms på en kvarts
  plan. Vid udda antal har ett lag en spelare mer, och en spelare byter lag mellan omgångarna.
  Alla passningar går längs marken.
fokusomraden:
  - lek
  - passning-mottagning
  - bollkansla
alder:
  min: 6
  max: 7
spelformer:
  - 3mot3
  - 5mot5
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-uppvarmning
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 16
grupptyp: fri
tid:
  kortast: 5
  rekommenderad: 7
  langst: 8
yta:
  alla:
    langd: 18
    bredd: 12
ytreferens:
  alla: stora planens målområde, dubbelt så djupt
material:
  - typ: boll
    antal: 16
    anteckning: en per spelare
  - typ: kon
    antal: 12
    anteckning: fyra markerar den fria zonen och resten ytans hörn och mittlinje
  - typ: vast
    antal: 8
    anteckning: i två färger, för de två lagen
coachningspunkter:
  - Stoppa bollen under foten innan du passar den.
  - Passa med insidan och håll bollen på marken.
  - Titta upp, så ser du var det finns plats att passa till.
varianter:
  lattare: Bollen får stoppas med händerna innan den passas.
  svarare: Tre konportar, en meter breda, står i den fria zonen, och en boll räknas bara som rensad om den går genom en port. Mottagningen ska föra bollen åt sidan i stället för att stoppa den död.
anpassning:
  fler_spelare: Lägg till en ny yta bredvid för varje grupp om åtta till sexton spelare.
  udda_antal: Ett lag har en spelare mer, och en spelare byter lag mellan omgångarna så att alla får vara i det mindre laget en gång.
  ledare: En ledare räcker för att ge signalerna "kör" och "stopp" och se att ingen står i den fria zonen.
