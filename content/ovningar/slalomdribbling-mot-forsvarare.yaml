schema: 1
id: slalomdribbling-mot-forsvarare
namn: Dribbling mot passiv försvarare
syfte: Spelarna ska dribbla förbi en motståndare med finter och fartväxling.
beskrivning: |
  Två spelare bildar ett par på en yta om 15 x 10 meter med ett konmål i var ände. Den
  ena dribblar mot försvararen som till en början rör sig passivt, och de byter roll efter
  varje försök. När paret lyckats flera gånger höjs försvararens intensitet.
organisation: |
  Ett par per yta, med två koner som mål i var ände. Paret byter roll efter varje försök
  och höjer försvararens intensitet när dribblingen lyckas flera gånger i rad.
fokusomraden:
  - dribbling
  - ett-mot-ett
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-2
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 2
  max: 2
grupptyp: par
tid:
  kortast: 6
  rekommenderad: 10
  langst: 15
yta:
  alla:
    langd: 15
    bredd: 10
ytreferens:
  alla: ungefär en fjärdedel av stora planens straffområde
material:
  - typ: boll
    antal: 1
    anteckning: en per par
  - typ: kon
    antal: 8
    anteckning: fyra till ytans hörn och två till varje konmål
coachningspunkter:
  - Använd en fint innan du sätter fart förbi försvararen.
  - Skydda bollen med kroppen när försvararen är nära.
  - Byt fart, gå inte i samma tempo hela vägen.
varianter:
  lattare: Försvararen står helt still under hela övningen.
  svarare: Försvararen får försöka vinna bollen aktivt från start.
anpassning:
  fler_spelare: Lägg till fler ytor med par bredvid varandra.
  udda_antal: >-
    Vid udda antal blir en grupp en trio. Den tredje väntar vid anfallarens
    konmål. Efter varje försök blir anfallaren försvarare, försvararen går
    till andra konmålet och den som väntade får bollen och anfaller.
  ledare: Med en ledare i närheten kan hen ropa ut för alla par samtidigt när intensiteten ska höjas.
planskiss:
  version: 1
  omrade:
    langd: 15
    bredd: 10
  beskrivning: >-
    Yta 15 x 10 meter med ett konmål i var ände. Anfallaren dribblar mot försvararen,
    som till en början rör sig passivt, och paret byter roll efter varje försök.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 15, bredd: 10, stil: streckad }
    - { typ: kon, x: 0, y: 0 }
    - { typ: kon, x: 15, y: 0 }
    - { typ: kon, x: 15, y: 10 }
    - { typ: kon, x: 0, y: 10 }
    - { typ: kon, x: 0, y: 3 }
    - { typ: kon, x: 0, y: 7 }
    - { typ: kon, x: 15, y: 3 }
    - { typ: kon, x: 15, y: 7 }
    - { id: a1, typ: spelare, x: 2, y: 5, lag: a, etikett: A }
    - { id: f1, typ: spelare, x: 8, y: 5, lag: b, etikett: F }
    - { typ: boll, x: 2.8, y: 5 }
  rorelser:
    - typ: dribbling
      fran: { objekt: a1 }
      till: { x: 13, y: 5 }
      via: [{ x: 8, y: 1 }]
      ordning: 1
  skalning:
    strategi: koer
    koer:
      - { vid: a1, riktning: 135, avstand: 5, etikett: Nästa anfallare väntar }
kalla: Egen övning, inspirerad av allmänt känd 1 mot 1-träning med stigande motstånd.
status: utkast
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: Stigande motstånd från passiv till aktiv försvarare är rätt sätt att öva dribbling i fas-10-12, och coachningspunkterna om fint, kroppsskydd och fartväxling är korrekta. Jag ändrade ledarbehovet från 1 till 0, eftersom 1 gäller per grupp och tolv spelare då hade krävt sex ledare. Att ropa när intensiteten höjs klarar en ledare för alla par samtidigt, vilket nu står i organisationen. Jag skrev också om målen till konmål, eftersom materiallistan bara har koner, och angav hur många koner som behövs.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
  - datum: 2026-10-05
    av: ovningsforfattare
    roll: ovningsforfattare
    kommentar: >-
      Skrev om anpassning.udda_antal enligt fotbollsexpertens mall för R-058 och
      bytte köns etikett i planskissen till övningens lösning, enligt beslutet
      2026-10-02.
