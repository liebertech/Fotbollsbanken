schema: 1
id: stort-spel-tio-till-elva-mot-elva
namn: Stort spel, tio mot tio till elva mot elva
syfte: Spelarna ska bygga upp spelet bakifrån, hantera inövade fasta situationer och försvara
  tillsammans med offside i ett matchlikt elva mot elva.
beskrivning: |
  Två lag möts på en yta om 100 x 60 meter, elva mot elva-planens minsta mått,
  med fullstora mål och varsin målvakt. Vanliga regler gäller, inklusive
  offside, inkast, hörna, frispark och inspark. Laget bestämmer före
  perioden vilken variant det ska använda på en hörna eller frispark i
  anfallszonen, och spelar den när läget uppstår. Målvakten spelar ut kort
  och säkert efter varje räddning och inspark, i stället för att chippa
  bollen långt. Laget med boll ska bygga upp genom lagdelarna, och laget
  utan boll ska hålla en samlad backlinje och döma offside tillsammans.
  Hörnor, frisparkar och inlägg slås längs marken eller i midjehöjd,
  eftersom övningen inte är en nickövning.
organisation: |
  Två lag om sammanlagt 19 till 23 spelare, inklusive två målvakter. Lagen
  är så jämnstora som möjligt: vid 19 spelare nio mot åtta utespelare, vid
  20 nio mot nio, vid 21 tio mot nio, vid 22 tio mot tio (fullt elva mot
  elva). Vid 23 spelare är båda lagen fulla, och den tjugotredje spelaren
  är avbytare som byts in i tur och ordning var femte minut, så att alla
  får lika mycket speltid. Spelas i perioder om tolv till femton minuter
  med två till tre minuters vattenpaus mellan perioderna: en period vid
  femton minuters speltid, två vid trettio och tre vid fyrtiofem. Lagen
  byter planhalva mellan perioderna. Ytan är matchplanens minsta mått också
  vid nitton spelare, eftersom spelet ska vara matchens egen form.
fokusomraden:
  - forsvarsspel
  - speluppbyggnad
  - fasta-situationer
alder:
  min: 15
  max: 19
spelformer:
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spel
ledarbehov: 0
spelare:
  min: 19
  max: 23
grupptyp: tva-lag
tid:
  kortast: 15
  rekommenderad: 30
  langst: 45
yta:
  alla:
    langd: 100
    bredd: 60
ytreferens:
  alla: hela 11 mot 11-planen
material:
  - typ: mal
    antal: 2
  - typ: vast
    antal: 10
    anteckning: till det ena lagets utespelare
  - typ: boll
    antal: 3
  - typ: kon
    antal: 4
    anteckning: markerar hörnflaggornas plats
coachningspunkter:
  - Håll formen i din lagdel och fyll ut utrymmet när bollen flyttar sig.
  - Spela snabbt och enligt lagets bestämda mönster på fasta situationer.
  - Målvakten spelar ut kort och säkert i stället för att chippa bollen långt.
  - Pressa tillsammans direkt efter en bolltapp, håll ihop backlinjen och döm offside som ett lag.
varianter:
  lattare: Ingen offside döms, så att anfallsspelet flyter utan avbrott.
  svarare: Efter halva tiden gäller högst två touchar per spelare på egen planhalva.
anpassning:
  fler_spelare: Vid fler än tjugotre spelare, bygg en andra yta med samma mått bredvid om en hel plan
    till finns. Annars turas fler spelare om att vara avbytare, i samma ordning som de andra.
  udda_antal: Lagen görs en spelare olika stora i stället för att generatorn sätter in en joker, se
    fördelningen i organisation för varje antal.
  ledare: Övningen är självgående när reglerna och avbytarordningen är satta. En ledare kan döma
    offside och fasta situationer och hålla koll på avbytarrotationen från sidan. Utan ledare dömer
    lagen själva.
