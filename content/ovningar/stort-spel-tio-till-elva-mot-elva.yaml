kalla: Egen övning, inspirerad av vanligt stort matchspel med rullande avbytare.
status: granskad
granskning:
  - datum: 2026-10-08
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter fyra småfel som jag har rättat själv. Ytan är 11 mot 11-planens minsta mått: 261
      kvadratmeter per spelare vid 23 (golv 90) och 316 vid 19, 16 procent över taket 273. Det är
      godtagbart för matchens egen form, och skälet står nu i organisationen. Avbytare i stället för
      joker följer F6, och fördelningen för 19-23 spelare är entydig. Tiden 15/30/45 klarar
      designregel 3. Rättat: 1. Vattenpausen står i minuter, två till tre (designregel 16). 2. En
      mening om att hörnor, frisparkar och inlägg slås längs marken eller i midjehöjd, eftersom
      övningen har fasta-situationer men inte nickspel (designregel 17, R-081). 3. Den svårare
      varianten sa "uppbyggnadszon", som inte är definierad. Nu: egen planhalva. 4. Ledartexten sa
      att ledaren dömer, fast ledarbehovet är 0. Nu kan en ledare döma, annars dömer lagen själva.
      Skissen är kontrollerad för hand: 19 spelare, nio mot åtta utespelare, tre passningar från
      målvakten utan skott, närmaste motståndare 3,0 meter från passningslinjen (B på 55, 30), och
      fyra platser varvade b, a, b och en avbytare utanför sidlinjen. Ytreferensen hela 11 mot
      11-planen är rätt.
