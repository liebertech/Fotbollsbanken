schema: 1
id: portpassning-i-par
namn: Portpassning i par
syfte: Spelarna ska passa genom en port och ställa sig så att kompisen kan se och passa till dem.
beskrivning: |
  Åtta portar, ungefär 1,5 meter breda, står utspridda i en yta om 18 x 12 meter. Paret har en
  boll. Den ena passar genom en port till kompisen på andra sidan, kompisen tar emot, och båda
  letar upp en ny port. Samma port får inte användas två gånger i rad. Paret räknar hur många
  portar de hinner på en minut och försöker slå sitt eget rekord. Ledaren frågar: "Var kan du
  stå så att kompisen kan passa dig?" Efter halva tiden ska den som har passat springa direkt
  till en ny port, så att kompisen kan passa vidare så fort bollen är stoppad.
organisation: |
  En boll per par, och flera par delar på ytan och portarna. Är ni färre än åtta spelare görs ytan
  ungefär 12 x 9 meter med fyra portar, så att paren möts lagom ofta. Det ska alltid finnas fler
  portar än par, så med fjorton eller sexton spelare ställer ni ut tio portar. Två ytor ryms på
  en kvarts plan. Efter varje minut kan paret byta kompis med ett annat par. Vid udda antal
  bildar sista gruppen en trio.
fokusomraden:
  - passning-mottagning
  - spelbarhet
  - bollkansla
alder:
  min: 6
  max: 7
spelformer:
  - 3mot3
  - 5mot5
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 16
grupptyp: fri
tid:
  kortast: 5
  rekommenderad: 7
  langst: 8
yta:
  alla:
    langd: 18
    bredd: 12
ytreferens:
  alla: stora planens målområde, dubbelt så djupt
material:
  - typ: boll
    antal: 8
    anteckning: en per par
  - typ: kon
    antal: 20
    anteckning: två per port, åtta portar och tio med fjorton eller fler spelare
coachningspunkter:
  - Ställ dig så att kompisen ser dig genom porten.
  - Passa längs marken med insidan och lagom hårt.
  - Titta upp efter andra par innan du passar.
varianter:
  lattare: Kompisen står stilla vid porten, och avståndet är 3-4 meter.
  svarare: Portarna är en meter breda, bollen tas emot i rörelse åt sidan och passas vidare med högst två touchar.
anpassning:
  fler_spelare: Med fjorton eller sexton spelare ställer ni ut tio portar. Är ni fler än sexton läggs en ny yta bredvid.
  udda_antal: >-
    En trio passar i tur och ordning, ett till två, två till tre och tre till ett. Den som har passat
    letar upp en ny port, och den som tar emot passar vidare genom nästa port.
  ledare: Ledaren går runt, ställer frågan om var man ska stå och ser att ingen passar hårt.
