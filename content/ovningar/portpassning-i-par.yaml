kalla: Egen övning, inspirerad av vanliga passningslekar genom portar.
status: granskad
granskning:
  - datum: 2026-10-09
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter fyra småfel som jag har rättat själv. Passning i par genom portar, där den som
      ska ta emot måste ställa sig så att kompisen ser hen genom porten. Det är spelbarhet i sin
      enklaste form, utan motståndare, och det passar åldern (F4 i plan-omgang-8.md). Passning och
      mottagning är huvudfokus, och alla tre fokus är K eller R för 6-7 år. Bara Öva (F1). En boll
      per par, så taket prövas (F5): 216 kvadratmeter ger 13,5 per spelare vid sexton, över golvet
      8, och den mindre ytan 12 x 9 meter med fyra portar för färre än åtta ger 27 vid fyra, 8
      procent över taket 25. Det godtar jag, eftersom portarna behöver plats och passningarna ändå
      är 3-6 meter. Åtta portar på den stora ytan och fyra på den lilla, som författaren valt inom
      planens sex till åtta, godtas. Två grupper ryms på kvarts plan (21 x 15 x 2 = 630). Nivå 3
      med smala portar, mottagning i rörelse och högst två touchar ger mindre mål och färre
      touchar. Trion vid udda antal syns bara i skissens beskrivning, och det räcker för en övning
      med grupptyp fri (regel 14 i plan-omgang-6.md). Rättat: 1. Med sexton spelare var det åtta
      par på åtta portar, och då får något par alltid vänta på en ledig port. Nu ska det alltid
      finnas fler portar än par, och med fjorton eller sexton spelare ställs tio portar ut.
      Material, anpassning och skissens beskrivning är ändrade efter det (kon 20). 2.
      fler_spelare sa en ny yta för varje grupp om åtta spelare, fast övningen tar sexton. Nu sägs
      en ny yta först över sexton. 3. Det stod inte vad som ändras efter halva tiden (regel 14).
      Nu springer den som har passat direkt till en ny port. 4. Bollen vid spelare 3 låg 0,1 meter
      från spelarens mitt, under symbolen. Nu ligger den på sidan mot porten, som för spelare 1.
      Ytreferensen stora planens målområde, dubbelt så djupt stämmer exakt (18 x 12). Namnet: jag
      hittade ingen övning med namnet i SvFF:s övningsbank vid sökning 2026-10-09, men banken är
      bara delvis sökbar.
