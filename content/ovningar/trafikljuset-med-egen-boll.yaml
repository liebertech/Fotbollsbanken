schema: 1
id: trafikljuset-med-egen-boll
namn: Trafikljuset med egen boll
syfte: Spelarna ska hålla bollen nära foten med båda fötterna, reagera på signal och titta upp medan de driver.
beskrivning: |
  Alla har varsin boll och driver fritt i rutan. Ledaren ropar eller visar en signal. Grönt betyder
  driva i fart. Gult betyder driva sakta med sulan. Rött betyder stoppa bollen och stå på ett ben
  med foten på bollen. Lägg sedan till signaler som tränar koordinationen. "Rondell" betyder gå
  runt bollen med foten på den. "Farthinder" betyder hoppa jämfota över bollen och landa mjukt.
  "Backa" betyder dra bollen bakåt med sulan. Som uppvärmning räcker de tre första signalerna.
  Som övning läggs fler och svårare signaler till efter några minuter, och ledaren byter signal
  ungefär var tionde sekund. Ge alla en chans att prova med båda fötterna.
organisation: |
  En ruta på 20 x 20 meter för upp till sexton spelare. Alla har varsin boll. Är gruppen färre än
  åtta gör ni rutan ungefär 12 x 12 meter, så att spelarna måste titta upp för att inte krocka.
  Ledaren står vid sidan av rutan och ropar eller visar signalerna. En ledare kan ge signaler till
  två rutor bredvid varandra. Är ni fler än sexton bygger ni en ruta till.
fokusomraden:
  - lek
  - bollkansla
  - koordination
alder:
  min: 8
  max: 9
spelformer:
  - 3mot3
  - 5mot5
  - 7mot7
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-uppvarmning
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 16
grupptyp: fri
tid:
  kortast: 5
  rekommenderad: 8
  langst: 10
yta:
  alla:
    langd: 20
    bredd: 20
ytreferens:
  alla: en ruta något större än stora planens mittcirkel
material:
  - typ: boll
    antal: 16
    anteckning: en per spelare
  - typ: kon
    antal: 4
    anteckning: hörnen på rutan
  - typ: kon
    antal: 3
    anteckning: i grönt, gult och rött, till ledarens signaler på nivå 3
coachningspunkter:
  - Titta upp och se signalen, inte bara bollen.
  - Små touchar med både höger och vänster fot.
  - Stanna bollen mjukt och stå stadigt på ett ben.
varianter:
  lattare: Bara de tre färgsignalerna, och ledaren visar dem tydligt med armen.
  svarare: Signalen visas bara med en färgad kon eller en handrörelse, utan rop. Spelaren byter
    fot vid varje signal.
anpassning:
  fler_spelare: Mer än sexton spelare delas på två rutor med samma mått.
  udda_antal: Spelar ingen roll, eftersom alla har egen boll.
  ledare: Övningen kräver bara att någon ger signaler. En ledare kan ge signaler till två rutor.
