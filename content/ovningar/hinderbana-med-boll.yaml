schema: 1
id: hinderbana-med-boll
namn: Hinderbana med boll
syfte: Spelarna ska föra bollen i fart genom riktningsförändringar och över hinder med god bollkontroll.
beskrivning: |
  En bana på ungefär 15 meter byggs upp med fyra koner i slalom och fyra låga hinder att
  kliva över med bollen kvar vid foten. Spelarna startar en och en med några sekunders
  mellanrum, kör banan i eget tempo och joggar tillbaka till kön för ett nytt varv.
organisation: |
  En bana per grupp om upp till åtta spelare. Fler grupper byggs bredvid varandra med
  samma uppsättning koner och hinder.
fokusomraden:
  - koordination
  - bollkansla
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-1
  - niva-2
passdelar:
  - del-uppvarmning
ledarbehov: 0
spelare:
  min: 4
  max: 8
grupptyp: fri
tid:
  kortast: 6
  rekommenderad: 8
  langst: 10
yta:
  alla:
    langd: 20
    bredd: 15
ytreferens:
  alla: ungefär halva stora planens straffområde
material:
  - typ: boll
    antal: 1
    anteckning: en per spelare
  - typ: kon
    antal: 8
    anteckning: fyra till slalomen och fyra som markerar start och mål
  - typ: hinder
    antal: 4
coachningspunkter:
  - Håll bollen nära fötterna genom hindren.
  - Byt mellan höger och vänster fot.
  - Titta upp mellan toucherna, inte bara ner på bollen.
varianter:
  lattare: Ta bort hindren och kör bara slalomen mellan konerna.
  svarare: Tidta varvet och försök slå sin egen tid på nästa försök.
anpassning:
  fler_spelare: Bygg en andra bana bredvid med samma antal koner och hinder.
  udda_antal: Alla kör med egen boll i eget tempo, så udda antal spelar ingen roll.
  ledare: Med fler ledare kan en peppa vid start och en vid hindren.
kalla: Egen övning, inspirerad av vanliga koordinationsbanor med boll.
status: godkand
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: Innehåll, syfte och fokusområden hänger ihop och passar uppvärmning för 10-12 år. Jag ändrade antalet spelare per grupp från 6-16 till 4-8, eftersom organisationen säger en bana per grupp om upp till åtta och eftersom 16 spelare på en bana ger för lång kö för fasen. Med max 8 delar generatorn själv upp i flera banor. Jag förklarade också vad de åtta konerna används till.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
