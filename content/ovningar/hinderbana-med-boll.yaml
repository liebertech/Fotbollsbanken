schema: 1
id: hinderbana-med-boll
namn: Hinderbana med boll
syfte: Spelarna ska föra bollen i fart genom riktningsförändringar och över hinder med god bollkontroll.
beskrivning: |
  En bana på ungefär 15 meter byggs upp med fyra koner i slalom och fyra låga hinder att
  kliva över med bollen kvar vid foten. Spelarna startar en och en med några sekunders
  mellanrum, kör banan i eget tempo och joggar tillbaka till kön för ett nytt varv.
organisation: |
  En bana per grupp om upp till åtta spelare. Fler grupper byggs bredvid varandra med
  samma uppsättning koner och hinder.
fokusomraden:
  - koordination
  - bollkansla
alder:
  min: 10
  max: 12
spelformer:
  - 5mot5
  - 7mot7
  - 9mot9
niva:
  - niva-1
  - niva-2
passdelar:
  - del-uppvarmning
ledarbehov: 0
spelare:
  min: 4
  max: 8
grupptyp: fri
tid:
  kortast: 6
  rekommenderad: 8
  langst: 10
yta:
  alla:
    langd: 20
    bredd: 15
ytreferens:
  alla: ungefär halva stora planens straffområde
material:
  - typ: boll
    antal: 1
    anteckning: en per spelare
  - typ: kon
    antal: 8
    anteckning: fyra till slalomen och fyra som markerar start och mål
  - typ: hinder
    antal: 4
coachningspunkter:
  - Håll bollen nära fötterna genom hindren.
  - Byt mellan höger och vänster fot.
  - Titta upp mellan toucherna, inte bara ner på bollen.
varianter:
  lattare: Ta bort hindren och kör bara slalomen mellan konerna.
  svarare: Tidta varvet och försök slå sin egen tid på nästa försök.
anpassning:
  fler_spelare: Bygg en andra bana bredvid med samma antal koner och hinder.
  udda_antal: Alla kör med egen boll i eget tempo, så udda antal spelar ingen roll.
  ledare: Med fler ledare kan en peppa vid start och en vid hindren.
planskiss:
  version: 1
  omrade:
    langd: 20
    bredd: 15
  beskrivning: >-
    Yta 20 x 15 meter med en startport, fyra slalomkoner, fyra låga hinder
    och en målport. Spelaren i tur startar vid porten, driver bollen genom
    slalomen och över hindren, och joggar tillbaka till kön för ett nytt varv.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 20, bredd: 15, stil: streckad }
    - { typ: kon, x: 4, y: 6 }
    - { typ: kon, x: 4, y: 9 }
    - { typ: kon, x: 6, y: 7.5 }
    - { typ: kon, x: 8, y: 7.5 }
    - { typ: kon, x: 10, y: 7.5 }
    - { typ: kon, x: 12, y: 7.5 }
    - { typ: ruta, x: 13.25, y: 6.75, langd: 0.5, bredd: 1.5, stil: heldragen, etikett: Hinder }
    - { typ: ruta, x: 14.75, y: 6.75, langd: 0.5, bredd: 1.5, stil: heldragen }
    - { typ: ruta, x: 16.25, y: 6.75, langd: 0.5, bredd: 1.5, stil: heldragen }
    - { typ: ruta, x: 17.75, y: 6.75, langd: 0.5, bredd: 1.5, stil: heldragen }
    - { typ: kon, x: 19, y: 6 }
    - { typ: kon, x: 19, y: 9 }
    - { id: sp-1, typ: spelare, x: 4, y: 7.5, lag: a, etikett: "1" }
    - { id: sp-2, typ: spelare, x: 3, y: 7.5, lag: a, etikett: "2" }
    - { id: sp-3, typ: spelare, x: 2, y: 7.5, lag: a, etikett: "3" }
    - { id: sp-4, typ: spelare, x: 1, y: 7.5, lag: a, etikett: "4" }
    - { typ: boll, x: 4.3, y: 8 }
  rorelser:
    - typ: dribbling
      fran: { objekt: sp-1 }
      till: { x: 9, y: 7.5 }
      via: [{ x: 6, y: 1 }, { x: 8, y: 14 }]
      ordning: 1
    - typ: dribbling
      fran: { x: 9, y: 7.5 }
      till: { x: 13, y: 7.5 }
      via: [{ x: 10, y: 1 }, { x: 12, y: 14 }]
    - typ: dribbling
      fran: { x: 13, y: 7.5 }
      till: { x: 19, y: 7.5 }
    - typ: lopning
      fran: { x: 19, y: 7.5 }
      till: { objekt: sp-4 }
      via: [{ x: 17, y: 14 }, { x: 5, y: 14 }]
      ordning: 2
      etikett: Joggar tillbaka till kön
  skalning:
    strategi: koer
    koer:
      - { vid: sp-4, riktning: 180, avstand: 0.75 }
kalla: Egen övning, inspirerad av vanliga koordinationsbanor med boll.
status: godkand
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: Innehåll, syfte och fokusområden hänger ihop och passar uppvärmning för 10-12 år. Jag ändrade antalet spelare per grupp från 6-16 till 4-8, eftersom organisationen säger en bana per grupp om upp till åtta och eftersom 16 spelare på en bana ger för lång kö för fasen. Med max 8 delar generatorn själv upp i flera banor. Jag förklarade också vad de åtta konerna används till.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
  - datum: 2026-10-07
    av: huvudsession
    roll: huvudsession
    kommentar: >-
      Omgång 5B: spelformer ändrade från [7mot7] till [5mot5, 7mot7, 9mot9] enligt
      fotbollsexpertens lista i docs/doman/plan-omgang-5b.md, införd mekaniskt. Inga andra fält ändrade.
