schema: 1
id: en-mot-en-till-mal
namn: 1 mot 1 till mål
syfte: Spelarna ska både utmana en motståndare med bollen och försvara sitt mål i enkla dueller en mot en.
beskrivning: |
  Anfallaren startar med bollen åtta meter från ett litet mål. Försvararen startar fyra
  meter från målet och får inte gå fram och pressa förrän anfallaren har rört bollen.
  Anfallaren försöker göra mål, försvararen försöker vinna bollen eller få den utanför
  ytan. Efter varje försök byter de två roller: den som blir ny försvarare hämtar
  reservbollen vid målet och rullar in den till den nya anfallaren, som startar nästa
  duell direkt.
organisation: |
  En yta per par med ett minimål i ena änden. Paret sköter rotationen själva: roll och
  startposition byts efter varje försök, och reservbollen vid målet gör att nästa duell
  kan starta utan att vänta på någon utifrån. Flera ytor läggs bredvid varandra om
  gruppen är större.
fokusomraden:
  - ett-mot-ett
  - avslut
alder:
  min: 8
  max: 9
spelformer:
  - 5mot5
niva:
  - niva-1
  - niva-2
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 2
  max: 2
grupptyp: par
tid:
  kortast: 6
  rekommenderad: 8
  langst: 10
yta:
  alla:
    langd: 10
    bredd: 8
material:
  - typ: minimal
    antal: 1
  - typ: boll
    antal: 2
    anteckning: en i spel och en i reserv vid målet
  - typ: kon
    antal: 4
    anteckning: markerar ytans hörn
coachningspunkter:
  - Möt anfallaren i vinkel, spring inte rakt mot bollen.
  - Skydda bollen med kroppen när försvararen kommer nära.
  - Var snabb med avslutet så fort vägen till mål är öppen.
varianter:
  lattare: Försvararen väntar en extra sekund innan hen får gå fram och pressa.
  svarare: Försvararen får gå fram samtidigt som anfallaren startar, utan fördröjning.
anpassning:
  fler_spelare: Lägg fler ytor med samma uppställning bredvid, tre meters mellanrum.
  udda_antal: Tredje spelaren gör paret till en trio med tre roller i rotation, anfallare,
    försvarare och vilande, där den vilande hämtar och rullar in reservbollen till nästa
    duell.
  ledare: Övningen sköter sig själv när paret har förstått rotationen. En ledare kan gå
    mellan ytorna och ge tips om vinkel och timing.
kalla: Egen övning, inspirerad av vanliga 1 mot 1-dueller till mål i ungdomsfotboll.
status: utkast
granskning:
  - datum: 2026-09-23
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Övningen fyller luckan jag bad om i omgång 3: en enkel spelövning i 1 mot 1 på nivå 1 för 8-9
      år. Ytan håller. 10 x 8 meter för två spelare är 40 kvadratmeter per spelare, över golvet 25
      för fas-8-9 med motståndare och under 5 mot 5-matchens trängsta värde 45 (passuppbyggnad.md).
      Den nedre gränsen 12 x 8 som jag satte för en duell i en-mot-en-till-smamal gällde fas-10-12,
      där golvet är 45 och en elvaåring behöver längre sträcka för att hinna accelerera förbi. 10 x 8
      är rätt mått för den här åldern, så den gränsen ska inte flyttas hit. En sak ska ändras.
      Fälten och texten säger emot varandra. Organisationen beskriver en kö utanför ytan och att
      nästa par går in efter varje försök, men spelare är 2 till 2 och grupptypen är par, alltså
      finns ingen kö: gruppen ÄR de två som duellerar. Tillsammans med ledarbehov 1 blir följden att
      varje par kräver en egen ledare (R-050, R-055). Med tolv spelare och två ledare blir det sex
      par och sex ledare, och generatorn kan då aldrig välja övningen. Välj en av två vägar. 1.
      Behåll ledarbehov 1 och gör gruppen större, till exempel 4 spelare, där två är inne på ytan och
      två står i kö utanför. Skriv det i organisationen. Ytan räknas då fortfarande på de två som är
      inne (passuppbyggnad.md, Så räknas talet fram, punkt 4), och kötiden håller riktvärdet 2-3 per
      mål. 2. Eller sätt ledarbehov 0 och låt det par som just kört hämta reservbollen och starta om,
      som i godkända 2 mot 1 till mål. Då kan en ensam ledare ha flera ytor igång (R-055).
