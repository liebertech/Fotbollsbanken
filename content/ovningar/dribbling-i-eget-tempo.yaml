schema: 1
id: dribbling-i-eget-tempo
namn: Dribbling i eget tempo
syfte: Spelarna ska föra bollen med kontroll och byta riktning i eget tempo, utan motstånd.
beskrivning: |
  En slalombana på ungefär 15 meter byggs upp med fyra koner. Spelarna startar en och en med
  några sekunders mellanrum, driver bollen genom slalomen och joggar tillbaka till kön för ett
  nytt varv i eget tempo.
organisation: |
  En bana per grupp om upp till åtta spelare. Fler grupper byggs bredvid varandra med samma
  uppsättning koner.
fokusomraden:
  - dribbling
  - bollkansla
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-1
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 8
grupptyp: fri
tid:
  kortast: 6
  rekommenderad: 8
  langst: 10
yta:
  alla:
    langd: 20
    bredd: 15
material:
  - typ: boll
    antal: 1
    anteckning: en per spelare
  - typ: kon
    antal: 6
    anteckning: fyra till slalomen och två som markerar start och mål
coachningspunkter:
  - Håll bollen nära fötterna i varje riktningsbyte.
  - Använd insidan och utsidan av foten växelvis.
  - Titta upp mellan toucherna, inte bara ner på bollen.
varianter:
  lattare: Färre koner med längre mellanrum, så att riktningsbytena blir enklare.
  svarare: Fler koner med kortare mellanrum, och tidta varvet mot sin egen förra tid.
anpassning:
  fler_spelare: Bygg en andra bana bredvid med samma uppsättning koner.
  udda_antal: Alla kör med egen boll i eget tempo, så udda antal spelar ingen roll.
  ledare: En ledare räcker för att visa banan och peppa. Med fler ledare kan en stå vid start och en
    vid slalomen och ge tips under tiden.
kalla: Egen övning, inspirerad av vanliga slalombanor för dribbling.
status: utkast
granskning: []
