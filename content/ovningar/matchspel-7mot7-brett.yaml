schema: 1
id: matchspel-7mot7-brett
namn: Matchspel i litet format
syfte: Spelarna ska hålla bollen inom laget och sprida ut sig i ett matchlikt spel.
beskrivning: |
  Två lag om upp till sju spelare, inklusive målvakt om gruppen är tillräckligt stor, möts på
  en yta om 50 x 30 meter med mål i var ände. Laget som har boll ska sprida ut sig och hålla
  bollen genom passningar, i stället för att klumpa ihop sig runt bollhållaren. Vanliga regler
  i 7 mot 7 gäller, inklusive retreatlinjen: när målvakten har bollen i händerna backar
  motståndarna till linjen 7 meter från mittlinjen på sin egen planhalva och stannar där tills
  bollen har lämnat målvaktens händer.
organisation: |
  Två lag om upp till sju spelare per yta, inklusive varsin målvakt om gruppen är tillräckligt
  stor. Ledaren markerar retreatlinjen med koner 7 meter från mittlinjen på båda planhalvor.
fokusomraden:
  - spelbarhet
  - passning-mottagning
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spel
ledarbehov: 0
spelare:
  min: 8
  max: 14
grupptyp: tva-lag
tid:
  kortast: 10
  rekommenderad: 20
  langst: 25
yta:
  alla:
    langd: 50
    bredd: 30
material:
  - typ: mal
    antal: 2
  - typ: vast
    antal: 7
    anteckning: till det ena laget
  - typ: boll
    antal: 3
  - typ: kon
    antal: 4
    anteckning: markerar retreatlinjen på båda planhalvor
coachningspunkter:
  - Sprid ut er i bredd och djup så att bollhållaren har flera passningsval.
  - Backa till retreatlinjen så fort er målvakt har bollen i händerna.
  - Rör dig direkt efter din passning för att bli spelbar igen.
varianter:
  lattare: Ledaren fryser spelet kort och pekar ut en ledig yta när laget klumpar ihop sig.
  svarare: Poäng bara för mål som föregås av minst fyra passningar i följd.
anpassning:
  fler_spelare: Gör planen större, upp mot 55 x 35 meter, och spela med fler spelare i varje lag.
  udda_antal: Ett lag spelar med en spelare mer än det andra.
  ledare: Övningen är självgående. Ledaren dömer, påminner om retreatlinjen och peppar från sidan.
kalla: Egen övning, inspirerad av vanligt matchspel i 7 mot 7-format.
status: atgarda
granskning:
  - datum: 2026-09-21
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Tre saker ska ändras. 1. Coachningspunkten om retreatlinjen är omvänd. Det står "Backa till
      retreatlinjen så fort er målvakt har bollen i händerna". Det är motståndarna som backar: laget
      vars målvakt inte har bollen går till linjen sju meter från mittlinjen på sin egen planhalva
      och stannar där tills bollen har lämnat målvaktens händer (spelformer.md, SvFF:s spelformsblad
      7 mot 7, hämtat 2026-09-11). Skriv "motståndarnas målvakt" i punkten. 2. Det står inte när
      målvakter används. Beskrivningen och organisationen säger "om gruppen är tillräckligt stor"
      utan något antal, fast minsta antal är åtta. Då kan ledaren läsa det som fyra mot fyra utan
      målvakt, med två obevakade mål på fem gånger två meter och utan den retreatregel beskrivningen
      bygger på. Skriv ut vad som gäller per gruppstorlek, som matchspelet för 5 mot 5 i samma
      omgång: åtta = tre mot tre plus målvakter, tio = fyra mot fyra plus målvakter, fjorton = sex
      mot sex plus målvakter. Väg in att tre mot tre på 50 x 30 meter ger 250 kvadratmeter per
      utespelare och mest blir spring; minsta antal tio, som i godkända målvaktsspel i smålagsspel
      (10 till 14 på samma yta), är rimligare, och vid åtta till nio finns redan smålagsspel med
      fasta situationer. 3. Namnet stämmer inte. "Matchspel i litet format" låter som smålagsspel,
      men det är 7 mot 7 på matchens egen plan med mål i spelformens storlek. Byt till exempel till
      Matchspel 7 mot 7 i bredd. Id:t ändras aldrig. Det som stämmer: 50 x 30 är SvFF:s minsta
      planmått för 7 mot 7 och ger 107 kvadratmeter per spelare vid fjorton, som i två godkända
      spel-övningar. Tiden 10 till 25 minuter ligger inom fasens gräns för spel (30 minuter),
      ledarbehov 0 är rätt (R-057) och nivålistan 1 till 3 godtar jag.
