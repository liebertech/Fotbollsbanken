schema: 1
id: matchspel-7mot7-brett
namn: Matchspel 7 mot 7 i bredd
syfte: Spelarna ska hålla bollen inom laget och sprida ut sig i ett matchlikt spel.
beskrivning: |
  Två lag möts på en yta om 50 x 30 meter med mål i var ände, alltid med varsin målvakt.
  Antalet utespelare i varje lag beror på gruppens storlek: tio spelare ger fyra mot fyra,
  tolv ger fem mot fem och fjorton, fullstort 7 mot 7, ger sex mot sex. Är antalet udda
  spelar det ena laget med en utespelare mer. Laget som har boll ska sprida ut sig och hålla
  bollen genom passningar, i stället för att klumpa ihop sig runt bollhållaren. Vanliga regler
  i 7 mot 7 gäller, inklusive retreatlinjen: när målvakten har bollen i händerna backar
  motståndarna till linjen 7 meter från mittlinjen på sin egen planhalva och stannar där tills
  bollen har lämnat målvaktens händer.
organisation: |
  Två lag per yta, alltid med varsin målvakt. Tio spelare: fyra mot fyra. Tolv spelare: fem
  mot fem. Fjorton spelare: sex mot sex. Vid elva eller tretton spelare spelar det ena laget
  med en utespelare mer än det andra. Ledaren markerar retreatlinjen med koner 7 meter från
  mittlinjen på båda planhalvor.
fokusomraden:
  - spelbarhet
  - passning-mottagning
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spel
ledarbehov: 0
spelare:
  min: 10
  max: 14
grupptyp: tva-lag
tid:
  kortast: 10
  rekommenderad: 20
  langst: 25
yta:
  alla:
    langd: 50
    bredd: 30
ytreferens:
  alla: hela 7 mot 7-planen, ungefär en fjärdedel av stora planen
material:
  - typ: mal
    antal: 2
  - typ: vast
    antal: 7
    anteckning: till det ena laget
  - typ: boll
    antal: 3
  - typ: kon
    antal: 4
    anteckning: markerar retreatlinjen på båda planhalvor
coachningspunkter:
  - Sprid ut er i bredd och djup så att bollhållaren har flera passningsval.
  - Backa till retreatlinjen så fort motståndarnas målvakt har bollen i händerna.
  - Rör dig direkt efter din passning för att bli spelbar igen.
varianter:
  lattare: Ledaren fryser spelet kort och pekar ut en ledig yta när laget klumpar ihop sig.
  svarare: Poäng bara för mål som föregås av minst fyra passningar i följd.
anpassning:
  fler_spelare: Gör planen större, upp mot 55 x 35 meter, och spela med fler spelare i varje lag.
  udda_antal: Ett lag spelar med en spelare mer än det andra.
  ledare: Övningen är självgående. Ledaren dömer, påminner om retreatlinjen och peppar från sidan.
planskiss:
  version: 1
  omrade:
    langd: 50
    bredd: 30
  beskrivning: >-
    Yta 50 x 30 meter med ett mål och en målvakt på varje kortsida. Fyra mot fyra
    ute vid tio spelare, spridda över hela planen. Retreatlinjen är markerad sju
    meter från mittlinjen på båda planhalvor. Lag A anfaller åt höger.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 50, bredd: 30, stil: heldragen }
    - { id: mal-a, typ: mal, x: 0, y: 15, storlek: 7mot7, riktning: hoger }
    - { id: mal-b, typ: mal, x: 50, y: 15, storlek: 7mot7, riktning: vanster }
    - { typ: markering, form: linje, x: 18, y: 0, till: { x: 18, y: 30 } }
    - { typ: markering, form: linje, x: 32, y: 0, till: { x: 32, y: 30 } }
    - { typ: spelare, x: 2, y: 15, lag: a, malvakt: true, etikett: MV }
    - { typ: spelare, x: 48, y: 15, lag: b, malvakt: true, etikett: MV }
    - { id: a1, typ: spelare, x: 10, y: 6, lag: a }
    - { id: a2, typ: spelare, x: 10, y: 24, lag: a }
    - { id: a3, typ: spelare, x: 18, y: 10, lag: a }
    - { id: a4, typ: spelare, x: 18, y: 20, lag: a }
    - { id: b1, typ: spelare, x: 40, y: 6, lag: b }
    - { id: b2, typ: spelare, x: 40, y: 24, lag: b }
    - { id: b3, typ: spelare, x: 32, y: 10, lag: b }
    - { id: b4, typ: spelare, x: 32, y: 20, lag: b }
