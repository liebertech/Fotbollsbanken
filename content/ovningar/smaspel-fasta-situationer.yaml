schema: 1
id: smaspel-fasta-situationer
namn: Smålagsspel med fasta situationer
syfte: Spelarna ska öva fasta situationer som en naturlig del av ett vanligt matchspel.
beskrivning: |
  Två lag spelar mot varandra på en yta om 50 x 30 meter med fasta mål. Varje gång bollen
  går ut spelas situationen som hörna, inkast eller frispark enligt spelets vanliga regler
  i 7 mot 7, i stället för att bara rullas in. Hörnor och frisparkar slås längs marken
  eller till en spelare som tar emot bollen, eftersom nickning inte tränas före 13 år.
  Ledaren påminner om avstånd och snabb återstart.
organisation: |
  Två lag om upp till sju spelare, inklusive målvakt om gruppen är tillräckligt stor.
  Spelplanens hörn märks ut med markeringar.
fokusomraden:
  - fasta-situationer
  - avslut
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
  - 9mot9
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spel
ledarbehov: 0
spelare:
  min: 8
  max: 14
grupptyp: tva-lag
tid:
  kortast: 10
  rekommenderad: 20
  langst: 25
yta:
  alla:
    langd: 50
    bredd: 30
ytreferens:
  alla: hela 7 mot 7-planen, ungefär en fjärdedel av stora planen
material:
  - typ: mal
    antal: 2
  - typ: vast
    antal: 7
    anteckning: till det ena laget
  - typ: boll
    antal: 3
  - typ: markering
    antal: 4
    anteckning: hörnmarkeringar
coachningspunkter:
  - Var snabb ut i position vid en fast situation, stå inte still.
  - Håll avståndet som gäller vid frisparkar och hörnor.
  - Leta efter en snabb återstart när motståndarna inte är klara.
  - Slå hörnan längs marken till en medspelare som tar emot bollen.
varianter:
  lattare: Bara inkast och frisparkar, inga hörnor.
  svarare: Lägg till en regel om att bara två toucher gäller efter en fast situation.
anpassning:
  fler_spelare: Gör planen större och spela med fler spelare i varje lag.
  udda_antal: Ett lag får en spelare mer, eller en joker spelar med laget som har färre.
  ledare: Med en ledare som dömer blir de fasta situationerna mest matchlika. Utan ledare dömer lagen
    själva, vilket också tränar fair play.
planskiss:
  version: 1
  omrade:
    langd: 50
    bredd: 30
  beskrivning: >-
    Yta 50 x 30 meter med ett mål och en målvakt på varje kortsida. Tre mot tre ute
    plus målvakter. Skissen visar en hörna för lag A som slås kort längs marken till
    en medspelare. Lag A anfaller åt höger.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 50, bredd: 30, stil: heldragen }
    - { id: mal-a, typ: mal, x: 0, y: 15, storlek: 7mot7, riktning: hoger }
    - { id: mal-b, typ: mal, x: 50, y: 15, storlek: 7mot7, riktning: vanster }
    - { typ: markering, form: platta, x: 0, y: 0 }
    - { typ: markering, form: platta, x: 50, y: 0 }
    - { typ: markering, form: platta, x: 50, y: 30 }
    - { typ: markering, form: platta, x: 0, y: 30 }
    - { typ: spelare, x: 2, y: 15, lag: a, malvakt: true, etikett: MV }
    - { typ: spelare, x: 48, y: 15, lag: b, malvakt: true, etikett: MV }
    - { id: a1, typ: spelare, x: 51, y: -1, lag: a }
    - { id: a2, typ: spelare, x: 40, y: 12, lag: a }
    - { id: a3, typ: spelare, x: 44, y: 4, lag: a }
    - { id: b1, typ: spelare, x: 46, y: 7, lag: b }
    - { id: b2, typ: spelare, x: 44, y: 12, lag: b }
    - { id: b3, typ: spelare, x: 45, y: 19, lag: b }
    - { typ: boll, x: 50, y: 0 }
  rorelser:
    - typ: passning
      fran: { x: 50, y: 0 }
      till: { objekt: a3 }
      ordning: 1
      etikett: Hörna
  skalning:
    strategi: platser
    platser:
      - { x: 30, y: 8, lag: a }
      - { x: 41, y: 22, lag: b }
      - { x: 36, y: 22, lag: a }
      - { x: 28, y: 15, lag: b }
      - { x: 24, y: 20, lag: a }
      - { x: 47, y: 10, lag: b }
kalla: Egen övning, inspirerad av vanligt smålagsspel med fasta situationer inbyggda.
status: godkand
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Att spela in de fasta situationerna i ett vanligt spel är rätt sätt att träna dem i den här
      åldern, i stället för att öva dem torrt. Jag avgjorde måttfrågan så här. Ytan höjs från 45 x
      30 till 50 x 30 meter, alltså SvFF minsta mått för 7 mot 7. Skälet är att övningen med flit
      använder fasta mål och 7 mot 7 vanliga regler för hörnor och frisparkar, och då ska avstånden
      till mål och kortlinje vara matchlika. 50 x 30 får fortfarande plats på en kvarts plan, så
      övningen kan användas av lag som delar plan. Jag ändrade också ledarbehovet från 1 till 0. Ett
      smålagsspel är självgående, och med ledarbehov 1 hade taket på tolv spelare per ledare tvingat
      generatorn att dela fjorton spelare i två spel med fyra mål. Ledaren dömer från sidan och att
      lagen ibland dömer själva tränar fair play. Jag lade till att hörnor och frisparkar slås längs
      marken eller till en spelare som tar emot bollen, eftersom nickning inte tränas före 13 år,
      och samma sak som coachningspunkt. Västarna angavs som två för två lag, men antalet avser
      antal plagg, så det står nu sju till det ena laget. Jag lade till niva-3, eftersom matchspel
      med fasta situationer fungerar på alla tre nivåer och den svårare varianten med två toucher
      efter en återstart ger utmaning nog.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
  - datum: 2026-10-07
    av: huvudsession
    roll: huvudsession
    kommentar: >-
      Omgång 5B: spelformer ändrade från [7mot7] till [7mot7, 9mot9] enligt
      fotbollsexpertens lista i docs/doman/plan-omgang-5b.md, införd mekaniskt. Inga andra fält ändrade.
