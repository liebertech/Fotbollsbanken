  omrade:
    langd: 16
    bredd: 14
  beskrivning: >-
    Yta 16 x 14 meter med sex stationer, tre på varje rad. Alla gör sin station samtidigt och
    roterar medurs på ledarens signal. Balansstationen har alltid minst två. Ledaren står i mitten
    och rättar knäläget.
