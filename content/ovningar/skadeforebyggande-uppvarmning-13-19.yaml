kalla: Egen övning, inspirerad av skadeförebyggande program som SvFF rekommenderar för 13-19 år.
status: godkand
granskning:
  - datum: 2026-10-06
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Ledarbehov 1 är rätt. Ytan godtas enligt undantag 3, stationer med minst två meter mellan
      arbetsplatserna. Ingen ytreferens: stationer (ytreferenser.md, avsnitt 4). Tre saker ska
      ändras. 1. Sätt spelare.min till 6. Balansstationen får två även vid sex spelare, och
      organisationen säger redan att färre stationer körs i en liten grupp. 2. Sexton platser för
      sexton spelare räcker inte när blocken roterar, eftersom ett block om tre kommer till balansen
      och till utfallsstegen. Skriv att varje station tar upp till tre, och att balansstationen har
      minst två där två turas om att knuffa när de är tre. 3. Skissen: ta bort ordning från de sex
      löpningarna eftersom alla roterar samtidigt, ge den första etiketten "Alla roterar medurs", ta
      bort spelaren på (13, 13) och lägg till en ledare på (8, 7). Ny beskrivning till skissen står
      i docs/doman/granskning-omgang-5.md, B4.
  - datum: 2026-10-06
    av: ovningsforfattare
    roll: ovningsforfattare
    kommentar: >-
      Alla tre punkterna åtgärdade. Sänkte spelare.min till 6. Skrev om organisation så att varje
      station tar upp till tre spelare, att balansstationen alltid har minst två och att de turas om
      att knuffa när de är tre, och att en station står tom vid sex spelare. I skissen: tog bort
      ordning från alla sex löpningar, gav den första etiketten "Alla roterar medurs", tog bort
      spelaren på (13, 13) så att basskissen har sex spelare, lade till en ledare på (8, 7) och
      skrev om skissens beskrivning.
  - datum: 2026-10-06
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller. Spelare.min är 6, och sex stationer med upp till tre spelare ger arton platser för
      högst sexton, så blocken får plats när de roterar. Balansstationen har minst två.
      Gruppdelningen: taket per ledare är 14 för 13-14 år, så femton och sexton spelare blir två
      grupper om minst sju med två ledare. För 15-19 år räcker en ledare upp till sexton. Skissen är
      kontrollerad: inga ordning på de sex löpningarna, etiketten "Alla roterar medurs", sex spelare
      och en ledare på (8, 7), som står minst 3,4 meter från alla pilar. Ingen ytreferens: stationer
      (ytreferenser.md, avsnitt 4). Kvar för redaktören: övningen ligger mycket nära
      skadeforebyggande-9mot9, se granskning-omgang-5.md, Beslut som behövs.
  - datum: 2026-10-07
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #34."
