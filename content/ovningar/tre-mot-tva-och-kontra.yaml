schema: 1
id: tre-mot-tva-och-kontra
namn: Tre mot två och kontra
syfte: Spelarna ska utnyttja överläget som anfallare, och som försvarare skydda målet, vinna bollen och kontra.
beskrivning: |
  Ytan är 28 x 18 meter med ett mål vid ena kortsidan och en startlinje med två konportar, två
  meter breda, vid den andra. Tre anfallare startar med boll vid startlinjen och anfaller målet mot
  två försvarare. Försvararna skyddar målet. Vinner de bollen ska de spela den genom en av de två
  konportarna på anfallarnas startlinje, och anfallarna ska vinna tillbaka bollen. Gör anfallarna
  mål, eller spelar försvararna bollen genom en port, är försöket slut. Med fler spelare växer
  övningen till fyra mot tre och fem mot fyra.
  Rotation: efter varje anfall går en anfallare till försvaret och en försvarare till anfallet, i
  tur och ordning. Den extra spelaren vid udda antal är alltid anfallare. Så fördelas spelarna: fem
  är tre mot två, sex är fyra mot två, sju är fyra mot tre, åtta är fem mot tre, nio är fem mot fyra
  och tio är sex mot fyra.
organisation: |
  En yta på 28 x 18 meter per grupp om fem till tio spelare, med ett mål i ena änden. Målvakten är
  frivillig, har handskar om laget har, och byts efter en serie om sex till åtta skott. Utan
  målvakt går det lika bra, och då räknas bara mål i nätet eller mellan stolparna. Skott tas från
  minst tio meter. Är ni fler än tio bygger ni en yta till bredvid med tre meters mellanrum. Två
  ytor ryms på en kvarts plan.
fokusomraden:
  - omstallning
  - forsvarsspel
  - spelbarhet
alder:
  min: 10
  max: 12
spelformer:
  - 5mot5
  - 7mot7
  - 9mot9
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
  - del-spelovning
ledarbehov: 0
spelare:
  min: 5
  max: 10
grupptyp: tva-lag
tid:
  kortast: 6
  rekommenderad: 12
  langst: 15
yta:
  alla:
    langd: 28
    bredd: 18
ytreferens:
  alla: ungefär två tredjedelar av stora planens straffområde
material:
  - typ: mal
    antal: 1
    anteckning: 7 mot 7-mål, 5 x 2 meter, eller 5 mot 5-mål
  - typ: kon
    antal: 8
    anteckning: fyra till portarna och fyra till hörnen
  - typ: boll
    antal: 4
  - typ: vast
    antal: 4
    anteckning: till försvararna
coachningspunkter:
  - Anfallare, skapa en fri passning, den som saknar boll flyttar sig.
  - Försvarare, en pressar och en täcker, och prata med varandra.
  - Efter bollvinst, spela genom porten direkt.
varianter:
  lattare: Försvararna får inte gå fram förrän den första passningen är spelad.
  svarare: Anfallarna har sex sekunder på sig att avsluta.
anpassning:
  fler_spelare: Bygg en yta till bredvid med samma mått. Två ytor ryms på en kvarts plan.
  udda_antal: Den extra spelaren är alltid anfallare.
  ledare: Övningen är självgående när rotationen är visad en gång.
