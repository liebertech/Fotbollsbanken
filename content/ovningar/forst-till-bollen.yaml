schema: 1
id: forst-till-bollen
namn: Först till bollen
syfte: Spelarna ska starta snabbt mot bollen och göra mål eller försvara direkt efter kapplöpningen.
beskrivning: |
  Ytan är 10 x 6 meter med ett litet mål mitt på var kortsida, utan målvakt. Bollen ligger mitt
  på ytan. De två i paret står sida vid sida vid mitten av ena långsidan, ungefär en och en halv
  meter isär. Den ena anfaller alltid det högra målet och den andra det vänstra. På signal
  springer båda till bollen. Den som når den först anfaller sitt mål, och den andra försvarar och
  anfaller sitt eget mål om hen vinner bollen. Duellen är slut vid mål, när bollen går ut eller
  efter ungefär 15 sekunder. Paret startar varje gång i ett nytt läge: stående, sittande, på mage,
  på huk som en groda eller med ryggen mot bollen.
organisation: |
  En yta per par, med ett småmål på var kortsida. Flera ytor ligger bredvid varandra med tre
  meters mellanrum. Ledaren klappar för alla par på en gång, eller så räknar den som förlorade
  förra duellen "ett, två, tre". En duell är högst cirka 15 sekunder, och paret vilar cirka 30
  sekunder medan bollen läggs tillbaka och nästa startläge väljs. Byt motståndare efter ungefär
  två minuter. Efter halva tiden byter paret sida så att alla anfaller båda målen. Paret står
  alltid sida vid sida och aldrig mitt emot varandra, så att ingen springer rakt mot den andra.
  Spela på bollen: ingen knuffar eller tar bollen bakifrån. Ytan är något större per spelare än i
  match, så att det finns en startsträcka att springa på.
fokusomraden:
  - snabbhet
  - ett-mot-ett
  - avslut
alder:
  min: 6
  max: 7
spelformer:
  - 3mot3
  - 5mot5
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 2
  max: 2
grupptyp: par
tid:
  kortast: 5
  rekommenderad: 7
  langst: 8
yta:
  alla:
    langd: 10
    bredd: 6
material:
  - typ: boll
    antal: 2
    anteckning: en i spel och en reserv per par
  - typ: minimal
    antal: 2
    anteckning: ett mål per kortsida, två koner fungerar om minimål saknas
  - typ: kon
    antal: 4
coachningspunkter:
  - Spring direkt på signalen och titta på bollen hela vägen.
  - Först fram skyddar bollen med kroppen innan skottet.
  - Den som kommer sist försvarar direkt, utan att vänta.
varianter:
  lattare: Båda startar stående med blicken mot bollen, och den som kom sist väntar en sekund innan hen får försvara.
  svarare: Start med ryggen mot bollen, och den som är först har högst åtta sekunder på sig att göra mål.
anpassning:
  fler_spelare: Lägg till fler ytor med par bredvid varandra, tio par ryms på en kvarts plan.
  udda_antal: >-
    Vid udda antal blir en grupp en trio. Den tredje väntar utanför långsidan bakom paret med en
    reservboll. Efter första duellen går den som kom sist ut och den tredje tar hens plats och mål.
    Sedan går alltid den ut som har spelat två dueller i rad, och den som kommer in tar den
    utgåendes mål och plats vid långsidan. Alla spelar då två dueller och vilar en.
  ledare: Övningen sköter sig själv när paren väl är igång. Ledaren ger startsignalen och väljer startläge.
planskiss:
  version: 1
  omrade:
    langd: 10
    bredd: 6
  beskrivning: >-
    Yta 10 x 6 meter med ett litet mål på var kortsida. Paret står sida vid sida vid nedre
    långsidan, och bollen ligger i mitten. Båda springer till bollen, och den som kommer först
    driver mot sitt mål och skjuter. Vid udda antal väntar en tredje bakom paret, utanför ytan,
    med en reservboll.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 10, bredd: 6, stil: streckad }
    - { id: mal-a, typ: mal, x: 0, y: 3, storlek: smamal, riktning: hoger }
    - { id: mal-b, typ: mal, x: 10, y: 3, storlek: smamal, riktning: vanster }
    - { id: sp-1, typ: spelare, x: 4.2, y: 6, lag: a, etikett: "1" }
    - { id: sp-2, typ: spelare, x: 5.8, y: 6, lag: b, etikett: "2" }
    - { typ: boll, x: 5, y: 3 }
  rorelser:
    - { typ: lopning, fran: { objekt: sp-1 }, till: { x: 4.3, y: 3.7 }, ordning: 1 }
    - { typ: lopning, fran: { objekt: sp-2 }, till: { x: 5.7, y: 3.7 }, ordning: 1 }
    - { typ: dribbling, fran: { x: 5.3, y: 3 }, till: { x: 8, y: 3 }, ordning: 2 }
    - { typ: skott, fran: { x: 8, y: 3 }, till: { objekt: mal-b }, ordning: 3 }
  skalning:
    strategi: koer
    koer:
      - { vid: sp-1, riktning: 90, avstand: 1.5, etikett: Väntar med ny boll }
kalla: Egen övning, inspirerad av vanliga startlekar där två barn tävlar om samma boll.
status: granskad
granskning:
  - datum: 2026-10-09
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter tre småfel som jag har rättat själv. Kapplöpningen till bollen och starten i
      olika lägen är leken, och den korta duellen efteråt ger ett mot ett och avslut. Snabbhet,
      ett mot ett och avslut är K eller R för 6-7 år och hör ihop med syftet. Bara Spelövning (F1
      i plan-omgang-8.md). Arbete och vila i siffror: högst cirka 15 sekunder duell och cirka 30
      sekunders vila (regel 17). Paret startar sida vid sida (F6). Yta: 60 kvadratmeter ger 30 per
      spelare, 20 procent över taket 25, för startsträckan. Tio par ryms på kvarts plan (13 x 9 x
      10 = 1 170). Nivå 3 med start med ryggen mot bollen och högst åtta sekunder ger kortare tid.
      Udda antal: författarens avvikelse från planen godtas. Den tredje väntar bakom paret,
      utanför samma långsida, eftersom en kö högst kan ligga 5 meter bort. Där står hen utanför
      ytan och utanför skottlinjerna, och paret springer bort från hen. Rotationen är entydig: efter
      första duellen går den som kom sist till bollen ut, och sedan går alltid den ut som har
      spelat två dueller i rad. Alla spelar två dueller och vilar en. Den som vilar står utanför
      i under en minut, och det godtar jag i en snabbhetsövning, där vilan ändå ska vara minst
      dubbelt så lång som arbetet. Rättat: 1. Texten sa inget om att spela på
      bollen eller varför paret står sida vid sida. Det står nu i organisation (regel 16). 2. Skälet
      till ytan över taket stod inte i texten. Det står nu i organisation. 3. Löppilarna slutade 0,8
      meter från varandra och 0,6 från bollen, och skissen hoppade från kapplöpningen direkt till
      ett skott 3 meter bort. Nu slutar löpningarna 1,4 meter isär, en dribbling visar att den som
      kom först driver mot sitt mål, och skottet går från 2 meter. Skissens beskrivning är
      omskriven så att den säger samma sak och håller sig under 300 tecken. Ingen ytreferens:
      duell med startavstånd (ytreferenser.md, avsnitt 4). Namnet: jag hittade ingen övning med
      namnet i SvFF:s övningsbank vid sökning 2026-10-09, men banken är bara delvis sökbar.
