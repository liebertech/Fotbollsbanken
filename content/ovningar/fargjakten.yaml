schema: 1
id: fargjakten
namn: Färgjakten
syfte: Spelarna ska reagera på en signal och spurta med bollen nära foten, och vända runt en kon utan att tappa den.
beskrivning: |
  Åtta koner i fyra färger står längs sidorna av en ruta om 18 x 18 meter, två av varje färg på
  motsatta sidor. Alla driver lugnt med egen boll inne i rutan. Ledaren ropar en färg, eller håller
  upp en kon i färgen. Alla driver så snabbt de kan till en kon i den färgen, runt den och tillbaka
  in i rutan, och fortsätter lugnt. Före spurten intar alla ett startläge som ledaren visar, till
  exempel sitta på bollen, ligga på rygg bredvid den eller stå på ett ben med foten på bollen.
  Spurten tar 5-8 sekunder, och mellan signalerna driver alla lugnt i 20-30 sekunder. I
  uppvärmningen är det få signaler och lugnt tempo. I Öva ropas två färger i rad ("röd, sedan
  blå") och vändningen runt konen görs med sulan.
organisation: |
  En boll per spelare i samma ruta. Alla rundar konen åt samma håll, och det står två koner per
  färg så att inte alla möts vid samma kon. Titta upp när du vänder. Är ni färre än åtta spelare
  görs rutan ungefär 12 x 12 meter. Två rutor ryms på en kvarts plan. Ledaren visar startläget en
  gång innan spurten.
fokusomraden:
  - snabbhet
  - koordination
  - dribbling
alder:
  min: 6
  max: 7
spelformer:
  - 3mot3
  - 5mot5
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-uppvarmning
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 16
grupptyp: fri
tid:
  kortast: 5
  rekommenderad: 7
  langst: 8
yta:
  alla:
    langd: 18
    bredd: 18
ytreferens:
  alla: en ruta som rymmer stora planens mittcirkel
material:
  - typ: boll
    antal: 16
    anteckning: en per spelare
  - typ: kon
    antal: 8
    anteckning: i fyra färger, två av varje
coachningspunkter:
  - Spring direkt när du hör eller ser färgen.
  - Håll bollen nära foten hela vägen runt konen.
  - Titta upp när du vänder, så att du ser var de andra är.
varianter:
  lattare: En färg i taget och inget startläge, bara spurt på signalen.
  svarare: Signalen visas bara med en kon, utan rop, och två färger ropas i rad med vändning med sulan runt konen.
anpassning:
  fler_spelare: Lägg till fler bollar i samma ruta eller en ny ruta bredvid för varje grupp om åtta till sexton spelare.
  udda_antal: Spelar ingen roll, varje spelare har sin egen boll.
  ledare: En ledare räcker för att visa färgen och startläget och se att alla rundar konen åt samma håll.
