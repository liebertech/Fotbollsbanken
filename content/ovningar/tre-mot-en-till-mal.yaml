schema: 1
id: tre-mot-en-till-mal
namn: 3 mot 1 till mål
syfte: Spelarna ska hitta en fri passningsväg i numerärt överläge och avsluta mot mål.
beskrivning: |
  Tre anfallare möter en försvarare på en yta om 18 x 12 meter med ett minimål utan
  målvakt i ena änden. Anfallarna ska sprida ut sig, passa till den som är fri och
  avsluta mot målet så fort läget finns. Försvararen försöker störa passningarna och
  vinna bollen. Efter ett mål eller en bollvinst startar gruppen om med en ny boll.
organisation: |
  En grupp om fyra spelare per yta: tre anfallare och en försvarare. Gruppen bestämmer i
  början en turordning, och försvararrollen går vidare ett steg i den ordningen efter varje
  mål eller bollvinst. Då vet alla vems tur det är utan att en ledare styr bytet, och var
  och en försvarar var fjärde omgång.
fokusomraden:
  - spelbarhet
  - avslut
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-1
  - niva-2
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 4
  max: 4
grupptyp: fast-storlek
udda_antal_losning: true
tid:
  kortast: 8
  rekommenderad: 10
  langst: 15
yta:
  alla:
    langd: 18
    bredd: 12
ytreferens:
  alla: stora planens målområde, dubbelt så djupt
material:
  - typ: boll
    antal: 2
    anteckning: en i spel och en i reserv vid sidan av ytan
  - typ: kon
    antal: 4
    anteckning: markerar ytans hörn
  - typ: minimal
    antal: 1
coachningspunkter:
  - Sprid ut er så att försvararen inte kan täcka alla tre.
  - Passa till den som är fri i stället för att dribbla rakt in i press.
  - Skynda dig att avsluta så fort läget finns.
varianter:
  lattare: Försvararen får bara jaga och störa passningar, inte tackla, de första omgångarna.
  svarare: Sätt en tidsgräns på 15 sekunder från första passningen till avslut.
anpassning:
  fler_spelare: Bygg en till yta med samma uppställning och ett eget mål bredvid.
  udda_antal: En femte spelare rullar in nya bollar och byts in som ny försvarare efter varje mål.
  ledare: Övningen sköter sig själv när gruppen förstått rollerna, men en ledare kan gå mellan ytorna
    och ge tips.
kalla: Egen övning, inspirerad av vanliga överlägesövningar mot mål.
status: godkand
granskning:
  - datum: 2026-09-13
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Övningen fyller luckan den skrevs för: den är en riktig spelövning på niva-1, inte en
      Öva-övning med annan etikett. Det finns motståndare, riktning, mål och omstart, och övertalet
      tre mot en gör att anfallarna hinner lyckas, vilket är precis vad niva-1 behöver. Syftet, att
      hitta en fri passningsväg i överläge, hänger ihop med huvudfokus spelbarhet, och avslut som
      andra fokus stämmer med att varje omgång slutar i ett skott. Organisationen är enkel nog att
      visas på under en minut. Gruppstorleken fungerar bra i generatorn: fyra spelare med lösning
      för udda antal ger hela grupper vid tolv, tretton och fjorton spelare, och med ledarbehov 0
      kan alla tre ytorna köras med en ledare. Ytan 18 x 12 meter och minimål utan målvakt är
      rimliga för fas-10-12, och utan målvakt finns ingen risk i skottmomentet. Varianterna är
      verkliga steg: passiv försvarare i början, tidsgräns som svårare. En egen rättelse.
      Beskrivningen sa bara att rollerna byts, inte i vilken ordning. Med ledarbehov 0 måste bytet
      vara självgående, annars blir det diskussion i varje omgång, så jag skrev in att gruppen
      bestämmer en turordning i början och att försvararrollen går vidare ett steg i den ordningen.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
