schema: 1
id: spela-ut-fran-malvakten-mot-press
namn: Spela ut från målvakten mot press
syfte: Spelarna ska bygga upp spelet från målvakten, hitta fria spelare och spela sig förbi pressen.
beskrivning: |
  Ytan är 28 x 18 meter med ett mål med målvakt i ena kortsidan och två konportar i den andra.
  Uppspelslaget har målvakten och tre till fem utespelare. Pressarna är en färre än uppspelslagets
  utespelare, och två färre vid udda antal. Målvakten startar med bollen. Pressarna startar bakom
  en konlinje 10 meter från målet och får gå fram först när målvakten har spelat den första
  passningen. Uppspelslaget får en poäng när en spelare tar emot bollen bakom en av konportarna.
  Vinner pressarna bollen ska de göra mål inom åtta sekunder, och de skjuter utanför konlinjen.
  Efter varje försök startar målvakten om med en ny boll.
  Rotation: efter tre minuter byter två pressare roll med två uppspelare, i tur och ordning, så
  att alla får vara pressare. Med fem spelare finns bara en pressare, och hen byter med en
  uppspelare. Målvakten står hela tiden om hen vill det, annars byts målvakt vid varje byte. Så här fördelas
  spelarna: fem är målvakt, tre uppspelare och en pressare. Sex är målvakt, tre och två. Sju är
  målvakt, fyra och två. Åtta är målvakt, fyra och tre. Nio är målvakt, fem och tre. Tio är
  målvakt, fem och fyra. Den extra spelaren vid udda antal är alltid i uppspelslaget.
organisation: |
  En yta på 28 x 18 meter per grupp om fem till tio spelare. Målet står på ena kortsidan och
  konportarna, två meter breda, på den andra. En konlinje 10 meter från målet visar var pressarna
  startar. Målvakten är frivillig och har handskar om laget har. Är ni fler än tio bygger ni en yta
  till bredvid med tre meters mellanrum. Två ytor ryms på en kvarts plan.
