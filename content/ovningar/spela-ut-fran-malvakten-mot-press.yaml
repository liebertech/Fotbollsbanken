    antal: 1
    anteckning: 7 mot 7-mål, 5 x 2 meter, eller 5 mot 5-mål
  - typ: kon
    antal: 12
    anteckning: fyra i portarna, fyra i hörnen och fyra i konlinjen
  - typ: boll
    antal: 4
  - typ: vast
    antal: 4
    anteckning: till pressarna
coachningspunkter:
  - Målvakt, titta upp innan du spelar, och spela till den som är fri.
  - Uppspelare, visa er så att målvakten har en passning, och ta emot i rörelse.
  - Pressare, gå fram tillsammans och stäng passningsvägarna.
varianter:
  lattare: Pressarna är halvaktiva, de stänger passningsvägar men tar inte bollen.
  svarare: Lika många pressare som uppspelare.
anpassning:
  fler_spelare: Bygg en yta till bredvid med samma mått. Två ytor ryms på en kvarts plan.
  udda_antal: Den extra spelaren är alltid i uppspelslaget.
  ledare: Övningen är självgående. Ledaren kan hålla tiden för rotationen.
