      - { x: 36, y: 18, lag: b }
      - { x: 26, y: 5, lag: a }
      - { x: 34, y: 24, lag: b }
      - { x: 24, y: 20, lag: a }
      - { x: 30, y: 26, lag: b }
      - { x: 22, y: 10, lag: a }
      - { x: 32, y: 29, lag: b }
