    - { typ: passning, fran: { objekt: a1 }, till: { objekt: a2 }, ordning: 2 }
    - { typ: skott, fran: { objekt: a2 }, till: { objekt: mal-1 }, ordning: 3 }
  skalning:
    strategi: platser
    platser:
