schema: 1
id: fasta-situationer-anfall-mot-forsvar
namn: Fasta situationer, anfall mot försvar med kontring
syfte: Spelarna ska anfalla och försvara fasta situationer med motstånd, och ställa om till kontring
  direkt efter bollvinst.
beskrivning: |
  Två lag på en yta om 42 x 32 meter med ett mål och en målvakt i ena
  kortsidan. Det anfallande laget slår fem fasta situationer i följd från
  olika platser runt målet: kort hörna, låg hörna till första stolpen, inkast
  i anfallszonen och spelad frispark. Det försvarande laget har målvakt,
  markerar och försvarar. Vinner det bollen kontrar det mot två konportar på
  den motsatta kortlinjen och spelar bollen genom en av dem. Mål på fast
  situation ger två poäng, mål inom åtta sekunder efter en fast situation en
  poäng, och ett kontringsmål en poäng till försvararna. Efter fem situationer
  byter lagen roll. Hörnor och inlägg slås längs marken eller i midjehöjd, och
  ingen nickning är planerad.
organisation: |
  Två lag om tre till sju spelare, målvakten inräknad: tre mot tre vid sex
  spelare och sju mot sju vid fjorton. Anfallarna numreras och slagaren byter
  i tur och ordning: den första situationen slås av nummer ett, den andra av
  nummer två och så vidare, och räcker inte antalet börjar numreringen om. Den
  som slagit går in i anfallet efter sin boll och är löpare vid nästa. En omgång
  är fem fasta situationer i varje riktning. Mellan omgångarna är det en minuts
  vila, och laget som anfaller bestämmer då sina varianter. Laget som försvarar
  byter målvakt efter varje omgång om ingen vill stå kvar. Målvakten har
  handskar, och står en utespelare i mål placeras skotten i stället för att
  skjutas hårt. Ingen tvingas stå i mål. Ytan är lika stor också för sex
  spelare, eftersom de fasta situationerna ska slås från sina platser runt
  målet och kontringen behöver sin längd.
fokusomraden:
  - fasta-situationer
  - forsvarsspel
  - omstallning
alder:
  min: 13
  max: 19
spelformer:
  - 7mot7
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 6
  max: 14
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 15
  langst: 25
yta:
  alla:
    langd: 42
    bredd: 32
ytreferens:
  alla: stora planens straffområde, nästan dubbelt så djupt
material:
  - typ: mal
    antal: 1
    anteckning: i den spelform ni tränar för
  - typ: vast
    antal: 7
    anteckning: till det ena laget, som behåller dem när lagen byter roll
  - typ: boll
    antal: 6
  - typ: kon
    antal: 8
    anteckning: fyra till konportarna och fyra till hörnen
coachningspunkter:
  - Försvarare markerar varsin anfallare innan bollen slås, ingen står kvar på bollen.
  - Anfallarna spelar efter lagets mönster, kort och snabbt längs marken.
  - Vinner ni bollen, spela ut direkt och kontra genom konporten.
  - Rop på markeringen, säg vem du tar och vem som täcker.
varianter:
  lattare: Ingen kontring och inga extra poäng, försvararna rensar bara. Anfallet får tio sekunder på sig.
  svarare: Slagaren har bara åtta sekunder på sig från att bollen läggs ned, och försvararna byter
    markering efter varje situation så att ingen markerar samma anfallare två gånger.
anpassning:
  fler_spelare: Vid fler än fjorton spelare delar generatorn gruppen och bygger en andra yta med eget
    mål bredvid.
  udda_antal: Den extra spelaren är alltid med det anfallande laget. Efter varje omgång byter lagen
    roll, så alla är i överläge varannan omgång.
  ledare: Övningen är självgående när varianterna är bestämda. Ledaren kan hålla räkningen på de fem
    situationerna och poängen.
