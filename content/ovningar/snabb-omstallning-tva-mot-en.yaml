schema: 1
id: snabb-omstallning-tva-mot-en
namn: Snabb omställning två mot en
syfte: Spelarna ska reagera snabbt och pressa direkt när de tappar bollen.
beskrivning: |
  Två anfallare möter en försvarare på en yta om 20 x 15 meter med ett litet mål utan
  målvakt. Anfallarna spelar mot försvararen i överläge. Vinner försvararen bollen har
  anfallarna sex sekunder på sig att pressa tillbaka och vinna tillbaka bollen innan en ny
  boll sätts i spel. Efter varje mål eller misslyckad återpress byts försvararen ut.
organisation: |
  En grupp om tre spelare per yta: två anfallare och en försvarare. Gruppen bestämmer i
  början en turordning, och försvararrollen går vidare ett steg i den ordningen efter varje
  mål eller bollvinst.
fokusomraden:
  - omstallning
  - forsvarsspel
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 3
  max: 3
grupptyp: fast-storlek
udda_antal_losning: true
tid:
  kortast: 8
  rekommenderad: 10
  langst: 12
yta:
  alla:
    langd: 20
    bredd: 15
material:
  - typ: minimal
    antal: 1
  - typ: vast
    antal: 1
    anteckning: till försvararen
  - typ: boll
    antal: 3
    anteckning: så att en ny boll snabbt kan sättas i spel efter varje omgång
  - typ: kon
    antal: 4
    anteckning: markerar ytans hörn
coachningspunkter:
  - Reagera direkt när ni tappar bollen, stå inte kvar.
  - Pressa den som har bollen i stället för att jaga efter ett läge.
  - Sök snabbt framåt igen så fort ni vunnit tillbaka bollen.
varianter:
  lattare: Tidsgränsen för att pressa tillbaka höjs till tio sekunder.
  svarare: Tidsgränsen sänks till fyra sekunder, och lyckas det inte blir det en poäng till
    försvararen.
anpassning:
  fler_spelare: Bygg en andra yta med samma uppställning bredvid.
  udda_antal: En fjärde spelare rullar in nya bollar och byts in som ny försvarare efter varje
    omgång.
  ledare: Utan extra ledare håller gruppen själv koll på tiden och byter roller i tur och ordning.
    Med en ledare kan hen hålla tiden och servar nya bollar.
kalla: Egen övning, inspirerad av vanlig omställningsträning i överläge.
status: granskad
granskning:
  - datum: 2026-09-21
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Övningen håller och fyller ett hål: omställning i öva-delen för 10-12 år. Ett överläge två mot
      en är precis vad öva-delen ska innehålla enligt passuppbyggnad.md, och både omställning och
      försvarsspel är kärnområden för fas-10-12 (fokusomraden.md). Kravet på återpress inom sex
      sekunder gör att omställningen händer många gånger i stället för att bara pratas om, och
      coachningspunkterna är korrekta och lätta att använda för en ideell ledare. Ytan 20 x 15 meter
      ger 300 kvadratmeter på tre spelare, alltså gott om plats för att pressa, vända och avsluta.
      Ingen kö: alla tre är i spel varje gång, och den fjärde spelaren vid udda antal rullar in nya
      bollar och byts in, vilket ger korta naturliga pauser i en i övrigt intensiv övning. Tiden 8
      till 12 minuter ligger inom fasens gräns för öva, 15 minuter. Ledarbehov 0 är rätt, och tre
      bollar gör att spelet startar om snabbt. Fast storlek tre med lösning för udda antal ger
      grupper om tre eller fyra (R-050), och det spannet täcker alla vanliga gruppstorlekar utan att
      någon grupp blir för liten. Nivå 2 och 3 är rätt: att pressa direkt efter en bollförlust
      förutsätter att gruppen redan vet åt vilket håll den ska, vilket är nivå 2 i nivaer.md, och den
      svårare varianten med fyra sekunder räcker för nivå 3. En mindre sak, som inte hindrar
      godkännande: beskrivningen säger att försvararen byts efter mål eller misslyckad återpress
      medan organisationen säger efter mål eller bollvinst. Vid nästa revidering bör de två
      formuleringarna bli en och samma, så att ledaren vet exakt när rollerna roterar.
