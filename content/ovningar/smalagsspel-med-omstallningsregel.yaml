kalla: Egen övning, inspirerad av allmänt kända smålagsspel med poängregler.
status: granskad
granskning:
  - datum: 2026-10-08
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter fem småfel som jag har rättat själv. Omgångens viktigaste övning: ett
      smålagsspel för 4-10 spelare där regeln om dubbla mål inom åtta sekunder gör att
      omställningen händer hela tiden, och därför både Spelövning och Spel (regel 9). Omställning,
      försvarsspel och avslut är K för 10-12 år. Ingen joker, med rätt skäl (F8). Längst 30
      minuter håller, eftersom perioder om 4-5 minuter, en minuts vila och regelbytet efter halva
      tiden står i siffror (F2). Yta: 480 kvadratmeter ger 48 per spelare vid tio, över golvet 45.
      Två ytor ryms på kvarts plan (33 x 19 x 2 = 1 254). Rättat: 1. Den lättare varianten hade
      sex sekunder i stället för åtta, men en kortare tid gör det svårare att få dubbla mål. Nu tio
      sekunder. Felet fanns i min plan. 2. 480 / 4 = 120 kvadratmeter är 12 procent över taket
      107, och skälet saknades i organisation (regel 13). Nu står att ytan kan kortas till ungefär
      24 meter med fyra spelare (96 per spelare). 3. Regeln efter halva tiden räknar med
      planhalvor, men ingen mittlinje var markerad. Nu en kon mitt på varje långsida, i text,
      material och skiss. 4. Skissen visade en passning från lag B till en punkt där ingen
      medspelare fanns, ett skott på 12 meter utan skytt och en passning rakt genom pressaren.
      Bollen låg dessutom bakom B1. Nu visar skissen det övningen handlar om: lag A har tappat
      bollen, A1 pressar bollhållaren och A2 stänger passningen, minst 1,4 meter från platserna.
      Inget skott ritas (designregel 11 i plan-omgang-6.md). 5. Det stod inte vad som händer när
      bollen går ut. Ytreferensen ungefär tre fjärdedelar av stora planens straffområde stämmer
      (480 mot 495 kvadratmeter, samma form).
