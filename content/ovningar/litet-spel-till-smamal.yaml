schema: 1
id: litet-spel-till-smamal
namn: Litet spel till småmål
syfte: Spelarna ska utmana i 1 mot 1-situationer och avsluta mot mål i ett litet matchspel.
beskrivning: |
  Två lag om två till tre spelare möts på en yta om 18 x 12 meter med ett litet mål i var
  ände utan målvakt. Lagen spelar match med vanliga regler i litet format, med mycket
  bolltid och många avslutsförsök för alla. Extra poäng ges för mål som föregås av att
  spelaren dribblat förbi en direkt motståndare.
organisation: |
  Två lag om två till tre spelare per yta. Flera ytor läggs bredvid varandra om gruppen är
  större, med tre meters avstånd mellan dem.
fokusomraden:
  - ett-mot-ett
  - avslut
alder:
  min: 8
  max: 9
spelformer:
  - 5mot5
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spel
ledarbehov: 0
spelare:
  min: 4
  max: 7
grupptyp: tva-lag
tid:
  kortast: 10
  rekommenderad: 15
  langst: 20
yta:
  alla:
    langd: 18
    bredd: 12
material:
  - typ: minimal
    antal: 2
  - typ: vast
    antal: 4
    anteckning: till det ena laget
  - typ: boll
    antal: 2
coachningspunkter:
  - Utmana motståndaren i stället för att passa bort bollen direkt.
  - Skydda bollen med kroppen när en försvarare kommer nära.
varianter:
  lattare: Försvararna får bara gå, inte springa, när de pressar bollhållaren.
  svarare: Bara en touch tillåten den sista metern innan avslut.
anpassning:
  fler_spelare: Lägg fler ytor bredvid varandra med samma mått och tre meters mellanrum, hellre än att
    lägga in fler spelare på samma yta.
  udda_antal: Ett lag spelar med en spelare mer än det andra.
  ledare: Övningen är självgående. Ledaren dömer och peppar från sidan.
kalla: Egen övning, inspirerad av vanligt smålagsspel till småmål.
status: godkand
granskning:
  - datum: 2026-09-14
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Ett riktigt spel i passets spel-del, med två lag, riktning och mål, precis som R-008 kräver.
      Formen är den bästa som finns för fas-8-9: små lag på liten yta ger flest bollkontakter och
      flest avslut per spelare, och minimål utan målvakt tar bort träffrisken. Fokusområdena 1 mot 1
      och avslut är båda kärnområden för fasen och stämmer med syftet. Ledarbehov 0 är rätt, ledaren
      dömer och peppar från sidan, och tiderna ligger inom fasens gräns för spel. En egen rättelse
      av antalet spelare. Fältet gäller en yta, men det stod högst tio medan organisationen säger
      två till tre spelare per lag och västarna räckte till tre. Tio spelare på 18 x 12 meter är
      drygt tjugo kvadratmeter per spelare, alltså långt trängre än en 5 mot 5-match, och då
      försvinner både utmaningarna i 1 mot 1 och avsluten. Jag har satt högst sju, vilket rymmer tre
      mot tre plus en extra spelare i ena laget, och höjt västarna till fyra. Minsta antal fyra står
      kvar, och med fyra till sju går varje antal från fyra och uppåt jämnt ihop när generatorn
      delar gruppen. Jag har också skrivit om anpassningen för fler spelare: den sa att ytan skulle
      göras större och lagen fyras, vilket säger emot både organisationen och det fasta ytmåttet. Nu
      står det att fler ytor läggs bredvid varandra, vilket är samma sak som organisationen säger
      och det som ger mest speltid. En egen rättelse av nivålistan. Övningen stod som niva-1 och
      niva-2. Ett litet spel till småmål är rätt för alla tre nivåerna i den här åldern: spelet
      anpassar sig efter spelarna, och den svårare varianten med en touch den sista metern före
      avslut ger en van grupp något att bita i. Jag har lagt till niva-3. Utan det hade ett
      niva-3-lag med elva till femton spelare inte kunnat få något spel alls, eftersom det andra
      spelet i banken kräver åtta till tio spelare i gruppen.
  - datum: 2026-09-21
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #8."
