schema: 1
id: lek-med-egen-boll
namn: Lek med egen boll
syfte: Spelarna ska bli trygga med egen boll genom lekfull rörelse och enkla bollkonster.
beskrivning: |
  Varje spelare har en egen boll inne i en yta om 18 x 12 meter och rör sig fritt. På
  ledarens rop eller tecken byter alla till en ny uppgift, till exempel att stoppa bollen
  under foten, vända med bollen, rulla den mellan fötterna eller driva till ett bestämt
  hörn. Ingen tävlar mot någon annan, alla övar samtidigt i sin egen takt.
organisation: |
  En boll per spelare i samma yta. Ledaren visar och ropar en ny uppgift ungefär varje
  minut, så att gruppen hela tiden har något nytt att göra.
fokusomraden:
  - lek
  - bollkansla
  - koordination
alder:
  min: 6
  max: 7
spelformer:
  - 3mot3
  - 5mot5
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-uppvarmning
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 16
grupptyp: fri
tid:
  kortast: 5
  rekommenderad: 7
  langst: 8
yta:
  alla:
    langd: 18
    bredd: 12
ytreferens:
  alla: stora planens målområde, dubbelt så djupt
material:
  - typ: boll
    antal: 16
    anteckning: en per spelare
  - typ: kon
    antal: 4
coachningspunkter:
  - Håll bollen nära fötterna när du rör dig.
  - Lyssna och reagera snabbt på nästa uppgift.
  - Prova att använda båda fötterna, inte bara den du gillar bäst.
varianter:
  lattare: Gå i stället för att springa mellan uppgifterna.
  svarare: Lägg till en extra regel, till exempel att bara röra bollen med vänster fot.
anpassning:
  fler_spelare: Lägg till fler bollar i samma yta, eller gör ytan något större om det blir
    trångt för alla att röra sig fritt.
  udda_antal: Spelar ingen roll, varje spelare har sin egen boll.
  ledare: En ledare räcker för att visa nya uppgifter och se att alla är igång.
