schema: 1
id: knakontroll-uppvarmning
namn: Knäkontroll i uppvärmningen
syfte: Spelarna ska öva landningsteknik och kroppskontroll som grund för skadeförebyggande träning.
beskrivning: |
  Spelarna joggar mellan sex markeringar i en cirkel och gör en övning vid varje markering:
  enbenshopp med mjuk landning, sidohopp över en linje och stillastående balans på ett ben.
  Ledaren visar varje övning innan gruppen sätter igång och går runt för att rätta till
  knäläget vid landning.
organisation: |
  En cirkel med sex markeringar per grupp om upp till tolv spelare, en eller två vid varje
  markering. Spelarna roterar medurs mellan stationerna på ledarens signal.
fokusomraden:
  - skadeforebyggande
  - koordination
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-uppvarmning
ledarbehov: 1
ledaruppgift: Ledaren visar varje övning, går runt och rättar till knäläget vid landning så att knäna inte viker inåt.
spelare:
  min: 6
  max: 12
grupptyp: fri
tid:
  kortast: 6
  rekommenderad: 10
  langst: 12
yta:
  alla:
    langd: 12
    bredd: 10
material:
  - typ: markering
    antal: 6
  - typ: kon
    antal: 4
coachningspunkter:
  - Landa mjukt på hela foten med lätt böjda knän.
  - Låt inte knäna vika inåt vid landning.
  - Håll blicken framåt, inte ner mot fötterna.
varianter:
  lattare: Ta bort hoppen och gör bara balansövningen vid varje station.
  svarare: Håll balansen tre sekunder efter varje landning och blunda under balansövningen på ett ben.
anpassning:
  fler_spelare: Bygg en andra cirkel med samma sex stationer bredvid.
  udda_antal: Spelarna roterar i egen takt, så udda antal spelar ingen roll.
  ledare: Med två ledare kan en visa och en rätta till teknik samtidigt.
planskiss:
  version: 1
  omrade:
    langd: 12
    bredd: 10
  beskrivning: >-
    Yta 12 x 10 meter med sex stationer i en cirkel, en eller två spelare vid
    varje. Alla gör övningen vid sin station samtidigt och joggar medurs till
    nästa på ledarens signal. Ledaren står i mitten och rättar knäläget.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 12, bredd: 10, stil: streckad }
    - { typ: kon, x: 0, y: 0 }
    - { typ: kon, x: 12, y: 0 }
    - { typ: kon, x: 12, y: 10 }
    - { typ: kon, x: 0, y: 10 }
    - { typ: ruta, x: 5.75, y: 0.75, langd: 0.5, bredd: 0.5, stil: heldragen, etikett: Station 1 }
    - { typ: ruta, x: 9.25, y: 2.75, langd: 0.5, bredd: 0.5, stil: heldragen, etikett: Station 2 }
    - { typ: ruta, x: 9.25, y: 6.75, langd: 0.5, bredd: 0.5, stil: heldragen, etikett: Station 3 }
    - { typ: ruta, x: 5.75, y: 8.75, langd: 0.5, bredd: 0.5, stil: heldragen, etikett: Station 4 }
    - { typ: ruta, x: 2.25, y: 6.75, langd: 0.5, bredd: 0.5, stil: heldragen, etikett: Station 5 }
    - { typ: ruta, x: 2.25, y: 2.75, langd: 0.5, bredd: 0.5, stil: heldragen, etikett: Station 6 }
    - { id: sp-1, typ: spelare, x: 6.7, y: 1, lag: neutral }
    - { id: sp-2, typ: spelare, x: 10.2, y: 3, lag: neutral }
    - { id: sp-3, typ: spelare, x: 10.2, y: 7, lag: neutral }
    - { id: sp-4, typ: spelare, x: 6.7, y: 9, lag: neutral }
    - { id: sp-5, typ: spelare, x: 3.2, y: 7, lag: neutral }
    - { id: sp-6, typ: spelare, x: 3.2, y: 3, lag: neutral }
    - { typ: ledare, x: 6, y: 5 }
  rorelser:
    - typ: lopning
      fran: { objekt: sp-1 }
      till: { objekt: sp-2 }
      etikett: Alla roterar medurs
    - { typ: lopning, fran: { objekt: sp-2 }, till: { objekt: sp-3 } }
    - { typ: lopning, fran: { objekt: sp-3 }, till: { objekt: sp-4 } }
    - { typ: lopning, fran: { objekt: sp-4 }, till: { objekt: sp-5 } }
    - { typ: lopning, fran: { objekt: sp-5 }, till: { objekt: sp-6 } }
    - { typ: lopning, fran: { objekt: sp-6 }, till: { objekt: sp-1 } }
  skalning:
    strategi: platser
    platser:
      - { x: 5.3, y: 1, lag: neutral }
      - { x: 8.8, y: 3, lag: neutral }
      - { x: 8.8, y: 7, lag: neutral }
      - { x: 5.3, y: 9, lag: neutral }
      - { x: 1.8, y: 7, lag: neutral }
      - { x: 1.8, y: 3, lag: neutral }
kalla: Egen övning, inspirerad av skadeförebyggande program som SvFF rekommenderar.
status: godkand
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: Landningsteknik och kroppskontroll är rätt innehåll för fas-10-12 och coachningspunkterna om mjuk landning och knäläge är korrekta och lätta att förstå. Jag lade till niva-1, eftersom skadeförebyggande uppvärmning gäller alla nivåer och den lättare varianten passar en grundgrupp. Jag sänkte max från 16 till 12 spelare per grupp, vilket är taket per ledare i fasen och stämmer med att övningen är ledarstyrd. Den svårare varianten krävde en boll som inte fanns i materiallistan, så jag bytte den mot en progression utan boll.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
  - datum: 2026-09-28
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Ingen ytreferens: stationer. Det som styr är avståndet mellan de sex arbetsplatserna i cirkeln,
      inte ytans storlek, och en storleksjämförelse skulle locka till att sprida ut stationerna
      (ytreferenser.md, avsnitt 4).
