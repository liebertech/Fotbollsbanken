schema: 1
id: fyra-horn-med-boll
namn: Fyra hörn med boll
syfte: Spelarna ska leka sig varma med egen boll och öva riktningsförändringar med bollkontroll.
beskrivning: |
  I ett kvadratiskt område om 18 x 18 meter markeras fyra hörn med koner. Alla spelare har
  varsin boll och dribblar fritt inne i rutan i valfri riktning. Ledaren ropar ut ett av
  hörnen, och alla dribblar dit så fort de kan utan att tappa bollen eller krocka med någon.
  Ledaren byter vilket hörn som ropas hela tiden.
organisation: |
  Alla spelare är i samma ruta med varsin boll. Är gruppen mycket stor läggs en andra ruta
  bredvid med samma mått och koner, med tre meters avstånd mellan rutorna.
  Är ni färre än nio, gör rutan ungefär 13 x 13 meter, så att spelarna måste titta upp för att inte krocka.
fokusomraden:
  - lek
  - koordination
alder:
  min: 8
  max: 9
spelformer:
  - 3mot3
  - 5mot5
  - 7mot7
niva:
  - niva-1
  - niva-2
passdelar:
  - del-uppvarmning
ledarbehov: 0
spelare:
  min: 6
  max: 12
grupptyp: fri
tid:
  kortast: 5
  rekommenderad: 7
  langst: 8
yta:
  alla:
    langd: 18
    bredd: 18
ytreferens:
  alla: en ruta som rymmer stora planens mittcirkel
material:
  - typ: boll
    antal: 1
    anteckning: en per spelare
  - typ: kon
    antal: 4
    anteckning: markerar de fyra hörnen
coachningspunkter:
  - Håll bollen nära fötterna när du byter riktning.
  - Titta upp så att du ser var hörnen och kompisarna är.
  - Sakta ner och stanna bollen vid konen, spring inte in i varandra i hörnet.
varianter:
  lattare: Gå eller jogga till hörnen i stället för att springa.
  svarare: Ledaren ropar två hörn efter varandra, och alla ska hinna till båda.
anpassning:
  fler_spelare: Bygg en andra ruta bredvid med samma mått och koner.
  udda_antal: Alla har egen boll och rör sig fritt i samma ruta, så udda antal spelar ingen roll.
  ledare: En ledare räcker för att ropa hörn. Med fler ledare kan de ropa växelvis från olika sidor.
