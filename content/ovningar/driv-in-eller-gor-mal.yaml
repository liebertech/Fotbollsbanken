schema: 1
id: driv-in-eller-gor-mal
namn: Driv in eller gör mål
syfte: Spelarna ska våga dribbla förbi en motståndare och välja mellan säker poäng och dubbel poäng.
beskrivning: |
  Två lag spelar på en yta på 30 x 16 meter. På varje kortsida står två småmål med ungefär 10 meter
  emellan, och framför kortsidan finns en zon som är 3 meter djup. Ett lag får en poäng för att driva
  in bollen i motståndarnas zon och stoppa den där. Det får två poäng för mål i ett av småmålen,
  men bara om en spelare i samma anfall har dribblat förbi en motståndare. Efter poäng startar
  motståndarna med boll från sin egen zon.
  Spela i perioder om tre till fyra minuter med en minuts vila emellan. Vid udda antal spelar ett lag
  med en spelare mer, och det byts efter varje period.
organisation: |
  En yta på 30 x 16 meter per grupp om fyra till åtta spelare, med två småmål och en zon på varje
  kortsida. Fyra spelare ger två mot två, åtta ger fyra mot fyra. Med fyra spelare kan ni korta
  ytan till ungefär 24 meter, så att två mot två inte blir för glest. Lagen har olika färg på västar.
  Är ni fler än åtta bygger ni en yta till bredvid med tre meters mellanrum. Två ytor ryms på en
  kvarts plan. Med fler än sexton spelare behövs en tredje yta utanför kvarts plan.
fokusomraden:
  - dribbling
  - ett-mot-ett
  - avslut
alder:
  min: 10
  max: 12
spelformer:
  - 5mot5
  - 7mot7
  - 9mot9
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 4
  max: 8
grupptyp: tva-lag
tid:
  kortast: 6
  rekommenderad: 12
  langst: 15
yta:
  alla:
    langd: 30
    bredd: 16
ytreferens:
  alla: ungefär tre fjärdedelar av stora planens straffområde
material:
  - typ: minimal
    antal: 4
    anteckning: småmål, två i varje kortsida
  - typ: kon
    antal: 8
    anteckning: hörn och zongränser
  - typ: boll
    antal: 3
  - typ: vast
    antal: 4
    anteckning: till det ena laget
coachningspunkter:
  - Våga driva på en motståndare, drivet in i zonen ger alltid poäng.
  - Välj, säker poäng i zonen eller dubbel poäng på mål.
  - Titta upp innan du dribblar, se var luckan finns.
varianter:
  lattare: Zonen görs fem meter djup, och försvararna får inte gå in i sin egen zon. Då är det
    lättare att våga driva in.
  svarare: Zonen tas bort och bara mål ger poäng, och målet räknas bara om spelaren har dribblat förbi en motståndare.
anpassning:
  fler_spelare: Bygg en yta till bredvid med samma mått. Två ytor ryms på en kvarts plan.
  udda_antal: Ett lag spelar med en spelare mer, och det byts efter varje period.
  ledare: Övningen är självgående. Ledaren kan hålla tiden för perioderna.
