kalla: Egen övning, inspirerad av allmänt kända smålagsspel med poängregler.
status: granskad
granskning:
  - datum: 2026-10-08
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter tre småfel som jag har rättat själv. Smålagsspel där två sätt att göra poäng
      gör att det lönar sig att våga dribbla: drivet in i zonen ger alltid en poäng, mål efter en
      dribbling två. Dribbling, ett mot ett och avslut är K för 10-12 år. Nivå 3, där zonen tas
      bort och bara mål efter dribbling räknas, är färre val och mer press. Perioder om 3-4
      minuter och en minuts vila står i siffror. Yta: 480 kvadratmeter ger 60 per spelare vid åtta,
      över golvet 45. Två ytor ryms på kvarts plan, och att tre inte gör det med 17-20 spelare står
      i organisation (planen, O7-08). Skottet i skissen tas från 8 meter mot ett småmål utan
      målvakt. Rättat: 1. Den lättare varianten var samma sak som grundformen och gjorde inget
      lättare. Nu är zonen fem meter djup och försvararna får inte gå in i sin egen zon, så att
      drivet in lyckas oftare på nivå 1. 2. 480 / 4 = 120 kvadratmeter är 12 procent över taket
      107, och skälet saknades i organisation (regel 13). Nu står att ytan kan kortas till ungefär
      24 meter med fyra spelare. 3. Den åttonde spelarens plats (16, 2) låg 1,25 meter från
      dribblingen. Nu står hen på (25, 12), minst 4 meter från rörelserna. Ytreferensen ungefär
      tre fjärdedelar av stora planens straffområde stämmer, samma mått som O7-06.
