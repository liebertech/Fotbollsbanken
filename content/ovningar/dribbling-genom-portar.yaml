schema: 1
id: dribbling-genom-portar
namn: Dribbling genom portar
syfte: Spelarna ska driva bollen förbi motstånd genom en öppen port på väg mot mål.
beskrivning: |
  Två lag om två till tre spelare möts på en yta om 18 x 12 meter med ett litet mål i var
  ände. Tre portar av koner står utspridda i mittzonen. Ett lag får en extra poäng om en
  spelare driver bollen genom en valfri port, med bollen i egna fötter, innan laget gör mål i
  samma anfall. Motståndarna försvarar både portarna och målen.
organisation: |
  Två lag om två till tre spelare per yta. Flera ytor läggs bredvid varandra om gruppen är
  större, med tre meters mellanrum.
fokusomraden:
  - dribbling
  - ett-mot-ett
alder:
  min: 8
  max: 9
spelformer:
  - 5mot5
niva:
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 4
  max: 6
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 10
  langst: 10
yta:
  alla:
    langd: 18
    bredd: 12
material:
  - typ: minimal
    antal: 2
  - typ: kon
    antal: 6
    anteckning: tre portar om två koner vardera
  - typ: vast
    antal: 3
    anteckning: till det ena laget
  - typ: boll
    antal: 2
coachningspunkter:
  - Driv bollen i fart mot en öppen port i stället för att vänta på ett läge.
  - Skydda bollen med kroppen när en försvarare är nära.
  - Titta upp för att se vilken port som är fri just nu.
varianter:
  lattare: Portarna görs dubbelt så breda och försvararna får bara gå, inte springa, mot porten.
  svarare: Bara en port i taget är öppen, och laget som gjorde senaste målet väljer vilken.
anpassning:
  fler_spelare: Bygg en till yta med samma uppställning bredvid, tre meters mellanrum.
  udda_antal: Den udda spelaren blir en joker som alltid spelar med laget som har bollen.
  ledare: Övningen är självgående. Med en ledare vid sidan kan hen bekräfta porträffar och byta
    vilken port som är öppen i den svårare varianten.
kalla: Egen övning, inspirerad av vanliga smålagsspel med dribblingsportar.
