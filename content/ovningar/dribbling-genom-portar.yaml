schema: 1
id: dribbling-genom-portar
namn: Dribbling genom portar
syfte: Spelarna ska driva bollen förbi motstånd genom en öppen port på väg mot mål.
beskrivning: |
  Två lag om två till tre spelare möts på en yta om 18 x 12 meter med ett litet mål i var
  ände. Tre portar av koner står utspridda i mittzonen. Ett lag får en extra poäng om en
  spelare driver bollen genom en valfri port, med bollen i egna fötter, innan laget gör mål i
  samma anfall. Motståndarna försvarar både portarna och målen.
organisation: |
  Två lag om två till tre spelare per yta. Flera ytor läggs bredvid varandra om gruppen är
  större, med tre meters mellanrum.
fokusomraden:
  - dribbling
  - ett-mot-ett
alder:
  min: 8
  max: 9
spelformer:
  - 5mot5
niva:
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 4
  max: 6
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 10
  langst: 10
yta:
  alla:
    langd: 18
    bredd: 12
material:
  - typ: minimal
    antal: 2
  - typ: kon
    antal: 6
    anteckning: tre portar om två koner vardera
  - typ: vast
    antal: 3
    anteckning: till det ena laget
  - typ: boll
    antal: 2
coachningspunkter:
  - Driv bollen i fart mot en öppen port i stället för att vänta på ett läge.
  - Skydda bollen med kroppen när en försvarare är nära.
  - Titta upp för att se vilken port som är fri just nu.
varianter:
  lattare: Portarna görs dubbelt så breda och försvararna får bara gå, inte springa, mot porten.
  svarare: Bara en port i taget är öppen, och laget som gjorde senaste målet väljer vilken.
anpassning:
  fler_spelare: Bygg en till yta med samma uppställning bredvid, tre meters mellanrum.
  udda_antal: Den udda spelaren blir en joker som alltid spelar med laget som har bollen.
  ledare: Övningen är självgående. Med en ledare vid sidan kan hen bekräfta porträffar och byta
    vilken port som är öppen i den svårare varianten.
kalla: Egen övning, inspirerad av vanliga smålagsspel med dribblingsportar.
status: granskad
granskning:
  - datum: 2026-09-21
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Övningen håller. Dribbling och 1 mot 1 är båda kärnområden för fas-8-9 (fokusomraden.md), och
      bonusregeln gör att dribblingen faktiskt händer i stället för att bara nämnas. Ytan 18 x 12
      meter är 216 kvadratmeter, alltså 36 per spelare vid sex och 54 vid fyra. Det är rymligare än
      godkända litet spel till småmål, som har samma yta men sju spelare (30,9 per spelare), och
      passar 3 mot 3 i åldern. Tiden 8 till 10 minuter ligger inom fasens gräns för spelövning, 10
      minuter (passuppbyggnad.md). Ledarbehov 0 är rätt: reglerna är få, och att döma sig själv i
      smålagsspel hör till fas-8-9 (aldrar-och-fokus.md). Ingen kö, alla är i spel hela tiden. Nivå 2
      och 3 är rätt satt: att driva bollen genom en försvarad port kräver att spelaren behåller
      bollen med en motståndare nära, vilket är nivå 2 i nivaer.md, och den svårare varianten med
      bara en öppen port i taget räcker för nivå 3. Grupptyp och lösning för udda antal stämmer med
      R-054. Tre mindre noteringar, som inte hindrar godkännande. Materiallistan saknar koner för att
      markera ytans sidlinjer, vilket ledaren löser på plats. Portarna står inne på spelytan, så
      platta markeringar är att föredra framför strutkoner om klubben har det. Vid sju spelare kan
      generatorn inte använda övningen, eftersom grupperna då blir fyra och tre och tre är under
      minsta antal (R-051, R-052).
