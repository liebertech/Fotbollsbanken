schema: 1
id: malvaktsduell-raddning-och-snabbt-utspel
namn: "Målvaktsduell: räddning och snabbt utspel"
syfte: Målvakterna ska rädda skott och starta nya anfall snabbt, och utespelarna ska avsluta på mål
  och ställa om direkt när bollen byter lag.
beskrivning: |
  Två lag möts på en yta om 36 x 30 meter med ett mål och en målvakt i varje
  kortsida och ingen mittzon. Två mot två till fyra mot fyra ute. Mål räknas
  bara på skott som tas utanför en markering ungefär åtta meter från målet,
  så att målvakterna får många skott men inga från nära håll. Efter varje
  räddning startar målvakten ett nytt anfall inom sex sekunder, med kast,
  med utspel med foten eller, i nio mot nio och elva mot elva, med inspark.
  Det ger både målvaktsspel och omställning. Spelet går i perioder om tre
  minuter med en minuts vila.
organisation: |
  Sex till tio spelare: två mot två till fyra mot fyra utespelare plus en
  målvakt per lag. Vid udda antal spelar ett lag med en utespelare mer, och
  det laget byter en spelare till det andra efter varje period. Lagets egna
  målvakter står hela tiden om det finns några. Annars är målvakten nästa
  nummer i tur och ordning i laget vid varje period, och den som stått i mål
  går ut. Ingen tvingas stå i mål. Målvakten har handskar. Står en
  utespelare i mål placeras skotten i stället för att skjutas hårt. Ledaren
  eller en spelare vid sidan håller tiden på sex sekunderna. Spelet tar ofta
  slut på bollen, så några bollar står i reserv bakom varje mål.
fokusomraden:
  - malvaktsspel
  - avslut
  - omstallning
alder:
  min: 13
  max: 19
spelformer:
  - 7mot7
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 6
  max: 10
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 15
  langst: 25
yta:
  alla:
    langd: 36
    bredd: 30
ytreferens:
  alla: ungefär stora planens straffområde, nästan dubbelt så djupt
material:
  - typ: mal
    antal: 2
    anteckning: i den spelform ni tränar för, förankrade
  - typ: vast
    antal: 5
    anteckning: till det ena lagets utespelare
  - typ: boll
    antal: 8
    anteckning: fyra bakom varje mål
  - typ: markering
    antal: 6
    anteckning: markerar linjen åtta meter från varje mål
  - typ: ovrigt
    antal: 2
    anteckning: målvaktshandskar till de som står i mål
coachningspunkter:
  - Målvakten ropar och läser spelet, ta ett steg ut mot skytten.
  - Skjut lågt mot hörnen och följ upp till retur.
  - Spela ut direkt efter räddningen, leta efter en fri medspelare.
  - Ställ om direkt, anfallet ska vara igång inom sex sekunder.
varianter:
  lattare: Målvakten får tio sekunder på sig och spelar ut med händerna till en medspelare nära.
  svarare: Målvakten får fyra sekunder på sig, och ett mål efter utspelet inom åtta sekunder
    räknas dubbelt. Utespelarna har högst två touchar.
anpassning:
  fler_spelare: Vid fler än tio spelare byggs en andra yta bredvid med samma mått, eller så står de
    extra utanför som avbytare och byter in efter varje period.
  udda_antal: Ett lag spelar med en utespelare mer. Det laget byter en spelare till det andra efter
    varje period, så att alla spelar i både över- och underläge.
  ledare: Övningen är självgående när reglerna är satta. Ledaren kan stå vid sidan, rätta
    målvakternas teknik och hålla koll på sexsekundersregeln.
