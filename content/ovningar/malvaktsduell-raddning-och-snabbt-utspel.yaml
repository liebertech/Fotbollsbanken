kalla: Egen övning, inspirerad av allmänna målvaktsspel med snabba utspel.
status: granskad
granskning:
  - datum: 2026-10-08
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter fyra småfel som jag har rättat själv. 108 kvadratmeter per spelare vid tio
      (golv 90) och 180 vid sex (tak 181). Målvakten får många skott men inga inifrån åtta meter,
      och startar nya anfall inom sex sekunder, så både målvaktsspel och omställning händer hela
      tiden. Perioder om tre minuter med en minuts vila. Handskar, placerade skott mot en
      utespelare i mål, och 7mot7 är rätt eftersom insparken bara är ett av tre sätt att starta.
      Målen ritas i den spelform passet gäller. För en målvaktsövning är det rätt att målvakten
      står i sitt eget matchmål. Rättat: 1. Coachningen sa "följ upp till retur", men en retur
      innanför markeringen kan inte ge mål. Nu går utespelarna inte in innanför markeringen, och en
      retur där tillhör målvakten. Det skyddar också målvakten mot närkamper på mållinjen. 2.
      Coachningspunkten är omskriven till att skjuta så fort läget finns utanför markeringen. 3.
      Målvaktsrotationen och "ingen tvingas" sa emot varandra. Nu hoppar den som inte vill över sin
      tur. 4. Sexsekundersregeln lades på ledaren fast ledarbehovet är 0. Nu räknar målvakten själv.
      I skissen stod platsen (29, 25) innanför markeringen. Den står nu på (26, 25). Ytreferensen,
      ungefär stora planens straffområde, nästan dubbelt så djupt, håller: 1 080 kvadratmeter mot
      referensens 1 200-1 350, 10 procent mindre, och ungefär säger det. Målen står på kortsidorna
      om 30 meter, och referensen jämför bara storlek (konvention 2). Skissen är kontrollerad för
      hand: skottet går från 15,1 meter, utanför markeringen, och träffar målet i alla tre
      spelformernas målbredd. Skottlinjen går 2,7 meter förbi målvakten.
