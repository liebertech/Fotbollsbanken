    bredd: 30
  beskrivning: >-
    Yta 36 x 30 meter med ett mål och en målvakt i varje kortsida och en linje åtta meter från
    varje mål. Två mot två ute. Lag A avslutar från cirka 15 meter, utanför linjen. Fler spelare
    fyller på lagen jämnt. Lag A anfaller åt höger.
