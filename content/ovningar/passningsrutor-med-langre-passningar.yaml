schema: 1
id: passningsrutor-med-langre-passningar
namn: Passningsrutor med längre passningar
syfte: Spelarna ska passa och ta emot längre bollar med rätt kraft och röra sig för att bli
  spelbara igen.
beskrivning: |
  Fyra spelare rör sig fritt inne i en stor ruta och håller bollen inom gruppen med
  passningar på minst tio meter. Efter varje passning ska mottagaren ta första touchen i
  en ny riktning innan nästa passning slås. Ingen motståndare är med, men spelarna ska
  hela tiden söka en öppen yta i stället för att stå still.
organisation: |
  En ruta om 20 x 20 meter per grupp om fyra, en boll per grupp. Fler grupper läggs
  bredvid varandra med tre meters mellanrum om gruppen är större.
fokusomraden:
  - passning-mottagning
  - spelbarhet
alder:
  min: 13
  max: 14
spelformer:
  - 9mot9
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 4
grupptyp: fast-storlek
udda_antal_losning: true
tid:
  kortast: 6
  rekommenderad: 10
  langst: 14
yta:
  alla:
    langd: 20
    bredd: 20
material:
  - typ: boll
    antal: 1
    anteckning: en per grupp
  - typ: kon
    antal: 4
coachningspunkter:
  - Sätt tillräcklig kraft på passningen så att den bär hela sträckan.
  - Ta första touchen bort från den du passade till.
  - Sök en ny öppen yta så fort du har passat bollen.
varianter:
  lattare: Krymp rutan till 14 x 14 meter tills passningarna sitter säkert på avstånd.
  svarare: Högst två touchar per spelare, och en av spelarna byter riktning på bollen med
    en volley eller halvvolley när det går.
anpassning:
  fler_spelare: Bygg fler rutor bredvid varandra, tre meters mellanrum.
  udda_antal: Den femte spelaren är alltid spelbar som en extra mottagare och räknas inte
    som en fast position.
  ledare: Övningen är självgående. Med en ledare i närheten kan hen påminna om passningens
    kraft och om att söka ny yta.
kalla: Egen övning, inspirerad av allmänt kända passningsrutor med rörelse.
status: granskad
granskning:
  - datum: 2026-09-23
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Kontrollräknat: 20 x 20 meter är 400 kvadratmeter, alltså 100 per spelare vid fyra. Golvet
      utan motståndare för fas-13-14 är 20 och taket, 9 mot 9-matchens trängsta värde, är 181, så
      övningen ligger i spannet (passuppbyggnad.md). Rutan är stor nog för de passningar på minst
      tio meter som beskrivningen kräver. Längdkriteriet på 35 meter gäller inte: ingen
      försvarslinje att spela bakom och ingen riktning, bara bollhållning utan press. Passning och
      mottagning och spelbarhet är kärnområden för fas-13-14 och syftet hänger ihop med huvudfokus.
      Coachningspunkterna är korrekta och begripliga: kraft på passningen, första touchen bort från
      den du passade till och att söka ny yta direkt. Tiden 6 till 14 minuter ligger inom fasens
      gräns för en övning, 20 minuter. Fast storlek fyra med en femte spelare som extra mottagare är
      en fungerande lösning för udda antal (R-050). Nivå 1 till 3 godtar jag: den lättare varianten
      krymper rutan till 14 x 14 meter, där tio meters passningar fortfarande får plats. Två saker
      att veta, ingen av dem stoppar övningen. 1. Riktvärdet för fasen är en boll per två spelare i
      passningsdelar (aldrar-och-fokus.md), och här delar fyra på en boll. Det är normalt i en
      passningsruta, men en andra boll när gruppen är van ger fler bollkontakter. 2. Volleyn i den
      svårare varianten är ett fotmoment, inte nickning, så märkningen nickspel ska inte läggas till
      här (R-081).
