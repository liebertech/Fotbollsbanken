schema: 1
id: hitta-den-fria-i-overlage
namn: Hitta den fria i överläge
syfte: Spelarna ska lära sig spela ihop i överläge och hitta den fria medspelaren innan
  avslutet.
beskrivning: |
  Två eller tre anfallare möter en eller två försvarare på en yta om 12 x 8 meter med ett
  litet mål i ena änden, utan målvakt. Anfallarna startar med bollen vid den andra
  kortsidan och försöker göra mål. Med tre spelare blir det två mot en, med fyra tre mot
  en och med fem tre mot två. Vinner försvararna bollen driver de ut den över anfallarnas
  kortlinje, och då börjar ett nytt anfall.
organisation: |
  En yta per grupp om tre till fem spelare. Efter varje anfall byter en anfallare plats
  med en försvarare, i tur och ordning, så att alla får försvara lika ofta. Flera ytor
  läggs bredvid varandra med tre meters mellanrum och med målen åt samma håll.
fokusomraden:
  - spelbarhet
  - passning-mottagning
  - ett-mot-ett
alder:
  min: 6
  max: 7
spelformer:
  - 3mot3
  - 5mot5
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 3
  max: 5
grupptyp: tva-lag
tid:
  kortast: 5
  rekommenderad: 7
  langst: 8
yta:
  alla:
    langd: 12
    bredd: 8
material:
  - typ: minimal
    antal: 1
  - typ: boll
    antal: 2
  - typ: vast
    antal: 2
    anteckning: till försvararna
  - typ: kon
    antal: 4
    anteckning: en i varje hörn
coachningspunkter:
  - Ställ dig en bit ifrån kompisen med bollen, så att försvararen inte kan ta er båda.
  - Passa till den som är fri, inte bara till kompisen bredvid.
  - Kommer försvararen mot dig, passa. Kommer hen inte, driv själv mot mål.
varianter:
  lattare: Försvararen får bara gå, inte springa.
  svarare: Mål efter en passning räknas dubbelt.
anpassning:
  fler_spelare: Lägg till fler ytor bredvid varandra med samma uppställning.
  udda_antal: >-
    Antalet avgör formen: tre spelare blir två mot en, fyra blir tre mot en och fem blir
    tre mot två. Ingen behöver vara joker.
  ledare: Övningen går själv när rollerna är förklarade. Ledaren kan byta roller mellan
    omgångarna.
planskiss:
  version: 1
  omrade:
    langd: 12
    bredd: 8
  beskrivning: >-
    Yta 12 x 8 meter med ett litet mål utan målvakt på högra kortsidan. Två mot en. A1
    driver mot B1, som pressar, och passar till A2, som är fri och avslutar. Med fyra
    spelare blir det tre mot en och med fem tre mot två. Lag A anfaller åt höger.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 12, bredd: 8, stil: streckad }
    - { id: mal-1, typ: mal, x: 12, y: 4, storlek: smamal, riktning: vanster }
    - { id: a1, typ: spelare, x: 2, y: 2.5, lag: a, etikett: "A1" }
    - { id: a2, typ: spelare, x: 2, y: 5.5, lag: a, etikett: "A2" }
    - { id: b1, typ: spelare, x: 8, y: 4, lag: b, etikett: "B1" }
    - { typ: boll, x: 2.3, y: 2.5 }
  rorelser:
    - { typ: dribbling, fran: { objekt: a1 }, till: { x: 5, y: 2.5 }, ordning: 1 }
    - { typ: lopning, fran: { objekt: b1 }, till: { x: 6.5, y: 2.5 }, ordning: 1, etikett: Pressar }
    - { typ: lopning, fran: { objekt: a2 }, till: { x: 6.5, y: 6.5 }, ordning: 1 }
    - { typ: passning, fran: { x: 5, y: 2.5 }, till: { x: 6.5, y: 6.5 }, ordning: 2 }
    - { typ: dribbling, fran: { x: 6.5, y: 6.5 }, till: { x: 9.5, y: 5.5 }, ordning: 3 }
    - { typ: skott, fran: { x: 9.5, y: 5.5 }, till: { objekt: mal-1 }, ordning: 4 }
  skalning:
    strategi: platser
    platser:
      - { x: 2, y: 0.8, lag: a }
      - { x: 10, y: 2, lag: b }
kalla: Egen övning, inspirerad av vanliga övningar med överläge i litet format.
status: utkast
granskning:
  - datum: 2026-10-06
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Åtgärda. Två mot en är rätt form för spelbarhet i åldern. Yta: 32 kvadratmeter per
      spelare vid tre, 28 procent över taket 25. Godtas, eftersom passningen behöver plats för
      att vara ett alternativ och minsta antal måste vara tre. Ingen ytreferens: för liten
      eller ingen plandel med rätt form. Ändringar, exakta i docs/doman/granskning-omgang-5.md
      under A7: spelare.max 5 och formen per antal i stället för joker, rotation där en
      anfallare byter med en försvarare efter varje anfall, nya coachningspunkter (pressa när
      ni vinner bollen var fel), varianter utan planhalva, västar 2, och planskissen, där A2:s
      pil gick 0,4 m från B1 och var en löpning fast A2 hade bollen.
  - datum: 2026-10-06
    av: ovningsforfattare
    roll: ovningsforfattare
    kommentar: >-
      Åtgärdat enligt docs/doman/granskning-omgang-5.md, A7. Satte spelare.max till 5 och
      skrev om beskrivning, organisation och anpassning.udda_antal så att formen (två mot
      en, tre mot en, tre mot två) följer antalet och rollerna roterar i tur och ordning i
      stället för med joker. Bytte alla tre coachningspunkter och båda varianterna, och
      satte västarna till 2. I planskissen flyttade jag a1, a2 och b1, skrev om rörelserna
      så att A2:s löpning till den fria ytan och passningen dit blir tydliga, och kortade
      platslistan till två poster för det nya spannet 3–5.
