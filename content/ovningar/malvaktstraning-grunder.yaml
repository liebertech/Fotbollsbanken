schema: 1
id: malvaktstraning-grunder
namn: Målvaktsträning, grunder
syfte: Spelarna ska öva grundställning, att fånga bollen och att rulla ut den till en medspelare.
beskrivning: |
  Spelarna delas i par. Den ena står i grundställning som målvakt vid en liten port av koner,
  den andra kastar eller rullar bollen mjukt mot målvakten från fem meter. Målvakten fångar
  eller stoppar bollen och rullar den sedan tillbaka längs marken till kompisen. Efter fem
  bollar byter paret roller.
organisation: |
  Ett par delar en port. Fler par ställer upp med varsin port bredvid, med tre meters
  mellanrum.
fokusomraden:
  - malvaktsspel
  - passning-mottagning
alder:
  min: 8
  max: 9
spelformer:
  - 5mot5
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 2
  max: 2
grupptyp: par
tid:
  kortast: 8
  rekommenderad: 10
  langst: 10
yta:
  alla:
    langd: 6
    bredd: 5
material:
  - typ: boll
    antal: 1
    anteckning: en per par
  - typ: kon
    antal: 2
    anteckning: markerar en liten målvaktsport
coachningspunkter:
  - Stå i grundställning med lätta fötter innan bollen kommer.
  - Fånga bollen med hela handen och håll den nära kroppen.
  - Faller du, gör det på sidan med bollen intill kroppen, ta aldrig emot med raka armar.
varianter:
  lattare: Kompisen kastar bollen rakt i famnen på målvakten.
  svarare: Kompisen kastar bollen lite åt sidan så att målvakten måste förflytta sig och falla mjukt.
anpassning:
  fler_spelare: Bygg fler portar bredvid varandra med samma mått.
  udda_antal: Tre spelare delar en port och roterar som målvakt, kastare och vilande.
  ledare: Övningen är självgående efter att ledaren visat grundställning och fångteknik en gång.
kalla: Egen övning, inspirerad av vanlig grundträning för unga målvakter.
status: godkand
granskning:
  - datum: 2026-09-14
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Rätt innehåll för fas-8-9. Målvakten kommer in i spelet i 5 mot 5, och grundställning, fånga
      och rulla ut är just det aldrar-och-fokus.md pekar ut för åldern. Att övningen körs i par
      betyder att alla får prova målvaktsrollen, vilket är min rekommendation för den här åldern,
      och att ingen står i kö. Målvaktsspel är relevant för fasen och passning-mottagning
      kärnområde, så märkningen är tillåten. Säkerheten är bra löst: bollen kastas eller rullas
      mjukt från fem meter, inga hårda skott mot ett barn utan skydd. En egen rättelse av
      nivålistan. Övningen stod som niva-1 och niva-2. Målvaktsteknik är nytt för alla i den här
      åldern, oavsett hur bra gruppen spelar i sin spelform, och den svårare varianten, där bollen
      kastas åt sidan så att målvakten måste förflytta sig och falla mjukt, är en verklig utmaning
      också för en van grupp. Eftersom det här är bankens enda Öva-övning med målvaktsspel för 5 mot
      5 skulle en snävare lista dessutom lämna niva-3-lag helt utan målvaktsträning. Jag har lagt
      till niva-3. Jag har också lagt till en coachningspunkt om att falla på sidan och aldrig ta
      emot med raka armar. Den svårare varianten innehåller ett fallmoment, och då ska ledaren ha
      den punkten framför sig. Ledarbehov 0, ytan 6 x 5 meter, tiderna och materialet stämmer med
      beskrivningen.
  - datum: 2026-09-21
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #8."
