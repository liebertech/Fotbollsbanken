schema: 1
id: bollkansla-och-driv-med-egen-boll
namn: Bollkänsla och driv med egen boll
syfte: Spelarna ska få många bollkontakter och lära sig driva bollen med kontroll i olika
  riktningar.
beskrivning: |
  Varje spelare har en egen boll inne i en yta om 15 x 10 meter, utan motståndare. De
  driver bollen fritt med olika delar av foten, och var eller varannan minut visar
  ledaren en ny touch: stanna bollen snabbt, vända med insidan, föra bollen i en liten
  åtta runt två koner eller byta riktning på en signal.
organisation: |
  En boll per spelare inne i den markerade ytan. Ledaren visar och byter uppgift ungefär
  varje minut och går runt och peppar under tiden.
fokusomraden:
  - bollkansla
  - dribbling
  - koordination
alder:
  min: 6
  max: 7
spelformer:
  - 3mot3
  - 5mot5
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 16
grupptyp: fri
tid:
  kortast: 5
  rekommenderad: 7
  langst: 8
yta:
  alla:
    langd: 15
    bredd: 10
ytreferens:
  alla: ungefär en fjärdedel av stora planens straffområde
material:
  - typ: boll
    antal: 16
    anteckning: en per spelare
  - typ: kon
    antal: 8
    anteckning: fyra i hörnen, fyra till åttorna
coachningspunkter:
  - Styr bollen med utsidan och insidan av foten, inte bara med tårna.
  - Håll bollen nära fötterna när du vänder eller byter riktning.
  - Titta upp ibland, inte bara ner på bollen hela tiden.
varianter:
  lattare: Gå i stället för att springa mellan toucherna.
  svarare: Lägg till en snabb vändning varje gång ledaren ropar till.
anpassning:
  fler_spelare: Lägg till fler bollar i samma yta, eller gör ytan något större om det blir
    trångt.
  udda_antal: Spelar ingen roll, varje spelare har sin egen boll.
  ledare: En ledare räcker för att visa nya toucher och gå runt och peppa.
planskiss:
  version: 1
  omrade:
    langd: 15
    bredd: 10
  beskrivning: >-
    Yta 15 x 10 meter där varje spelare har en egen boll och övar driv och vändningar utan
    motståndare. Ledaren visar en ny touch ungefär varje minut.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 15, bredd: 10, stil: streckad }
    - { id: sp-1, typ: spelare, x: 3, y: 2, lag: neutral, etikett: "1" }
    - { id: sp-2, typ: spelare, x: 11, y: 2, lag: neutral, etikett: "2" }
    - { id: sp-3, typ: spelare, x: 3, y: 8, lag: neutral, etikett: "3" }
    - { id: sp-4, typ: spelare, x: 11, y: 8, lag: neutral, etikett: "4" }
    - { typ: boll, x: 3.3, y: 2 }
    - { typ: boll, x: 11.3, y: 2 }
    - { typ: boll, x: 3.3, y: 8 }
    - { typ: boll, x: 11.3, y: 8 }
    - { typ: kon, x: 6, y: 4 }
    - { typ: kon, x: 6, y: 6 }
  rorelser:
    - typ: dribbling
      fran: { objekt: sp-1 }
      till: { x: 6, y: 5 }
      via: [{ x: 5, y: 3 }]
      ordning: 1
      etikett: Åtta runt konerna
    - typ: dribbling
      fran: { objekt: sp-3 }
      till: { x: 9, y: 5 }
      ordning: 1
kalla: Egen övning, inspirerad av vanliga bollkänsleövningar med egen boll.
status: utkast
granskning: []
