schema: 1
id: skadeforebyggande-9mot9
namn: Skadeförebyggande program 13-14 år
syfte: Spelarna ska öva knä- och fotledskontroll, bålstabilitet och landningsteknik som
  förberedelse inför träningens mer intensiva delar.
beskrivning: |
  Spelarna joggar mellan sex markerade stationer i en cirkel och gör en övning vid varje
  station: enbenshopp med mjuk landning, utfallssteg, sidohopp över en linje, planka,
  balans på ett ben med lätt och kontrollerad knuff från en medspelare och rak löpning med
  höga knän. Ledaren visar varje övning innan gruppen sätter igång och går runt för att
  rätta till knäläget vid landning och hopp.
organisation: |
  En cirkel med sex stationer per grupp om upp till fjorton spelare, med minst två meters
  avstånd mellan spelarna på samma station. Balansstationen bemannas alltid av två
  spelare, eftersom övningen kräver en medspelare som knuffar. Planka, sidohopp och höga
  knän tar upp till tre spelare var. Enbenshopp och utfallssteg tar upp till två spelare
  var. Spelarna roterar medurs mellan stationerna på ledarens signal. Fler grupper bygger
  en egen cirkel bredvid.
fokusomraden:
  - skadeforebyggande
  - koordination
alder:
  min: 13
  max: 14
spelformer:
  - 9mot9
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-uppvarmning
ledarbehov: 1
ledaruppgift: Ledaren visar varje övning, går runt och rättar till knäläget vid landning
  och hopp så att knäna inte viker inåt.
spelare:
  min: 7
  max: 14
grupptyp: fri
tid:
  kortast: 8
  rekommenderad: 12
  langst: 15
yta:
  alla:
    langd: 14
    bredd: 12
material:
  - typ: markering
    antal: 6
  - typ: kon
    antal: 4
coachningspunkter:
  - Landa mjukt på hela foten med lätt böjda knän.
  - Låt inte knäna vika inåt vid landning eller riktningsbyte.
  - Håll bålen stilla och blicken framåt, inte ner mot fötterna.
  - Knuffen på balansstationen ska vara lätt och kontrollerad, inte ett knuff-slag.
varianter:
  lattare: Ta bort hoppen och gör bara balans- och stabilitetsövningarna vid varje station.
  svarare: Håll balansen fem sekunder efter varje landning och lägg till en snabb
    riktningsändring efter utfallssteget.
anpassning:
  fler_spelare: Bygg en andra cirkel med samma sex stationer bredvid.
  udda_antal: Udda antal spelar ingen roll utom vid balansstationen, som alltid ska ha två.
    Låt vid behov en spelare göra en station två gånger i rad så att balansstationen får
    ett par.
  ledare: Med två ledare kan en visa och en rätta till teknik samtidigt vid olika stationer.
kalla: Egen övning, inspirerad av skadeförebyggande program som SvFF rekommenderar för
  13-19 år.
status: utkast
granskning:
  - datum: 2026-09-23
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Undantaget håller, innehållet har tre luckor. Först ytan: 14 x 12 meter är 168 kvadratmeter,
      alltså 12,0 per spelare vid fjorton, mot golvet 20 utan motståndare för fas-13-14. Övningen
      träffas av undantag 3, spelare på egna platser eller bestämd bana, och texten visar det:
      organisationen säger sju fasta stationer, en till två spelare per station och minst två meters
      avstånd mellan spelarna på samma station. Det är precis vad undantaget kräver
      (passuppbyggnad.md). Ytan godtas alltså. Tre saker ska ändras. 1. Antalet stationer stämmer
      inte. Beskrivningen räknar upp sex övningar (enbenshopp, utfallssteg, sidohopp, planka, balans
      på ett ben och höga knän), medan organisationen och materiallistan säger sju. Lägg till en
      sjunde eller ändra till sex överallt. 2. Balansstationen kräver en medspelare som knuffar
      lätt, men organisationen tillåter en ensam spelare per station. Skriv att den stationen alltid
      bemannas av två, och lägg till en coachningspunkt om att knuffen ska vara lätt och
      kontrollerad. I den här åldern eskalerar den annars snabbt. 3. Rotationen beskrivs på två
      sätt: medurs på ledarens signal i beskrivningen, i egen takt i anpassningen för udda antal.
      Välj ett. Det som stämmer: tiden 8 till 15 minuter ligger i nivå med de 10 till 15 minuter
      SvFF anger för Knäkontroll i uppvärmningen (passuppbyggnad.md, hämtat 2026-09-11), ledarbehov
      1 med högst fjorton spelare stämmer med taket per ledare (R-050), och texten är egen och inte
      en avskrift av något program.
  - datum: 2026-09-24
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Två av tre punkter är åtgärdade, men ändringen till sex stationer har öppnat en lucka i
      räkningen. Klart: sex stationer i beskrivningen, i organisationen och i materiallistan (sex
      markeringar), balansstationen alltid bemannad av två, en coachningspunkt om att knuffen ska
      vara lätt och kontrollerad, och en enad rotation, medurs på ledarens signal, där anpassningen
      för udda antal nu bara handlar om hur balansstationen får sitt par. En sak ska ändras.
      Platserna räcker inte till det högsta antalet spelare. Organisationen säger upp till fjorton
      spelare, men också att balansstationen har två och de övriga fem stationerna en till två var.
      Det är som mest 2 plus 5 gånger 2, alltså tolv platser. Med fjorton spelare vet ledaren inte
      var de två sista ska stå, och det var sju stationer som tidigare fick summan att gå jämnt ut.
      Välj en väg. 1. Sätt spelare.max till 12 och skriv upp till tolv i organisationen. 2. Eller
      tillåt tre spelare på de stationer som tål det, till exempel planka, sidohopp och höga knän,
      och skriv ut vilka. Tvåmetersavståndet gäller oavsett vilket, och ytan 14 x 12 meter rymmer
      det. Undantag 3 gäller oförändrat, så ytan ska inte växa.
  - datum: 2026-09-24
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Platsräkningen går ihop nu, men vägen som valdes stänger övningen för de vanligaste
      gruppstorlekarna. Genomräknat med R-050 till R-055 för fas-13-14, där taket per ledare är 14
      och ledarbehovet är 1: med spelare 7 till 12 blir största grupp 12. Sju till tolv spelare ger
      en grupp och en ledare, det fungerar. Tretton kräver två grupper, sju och sex, och sexan är
      under minsta antal, så övningen kan inte användas alls, oavsett hur många ledare som finns
      (R-051, R-052). Fjorton ger sju och sju, vilket fungerar men kräver två ledare (R-055). Med
      max 14 räckte en grupp och en ledare hela vägen upp till fjorton. Förlusten landar mitt i ett
      normalt 9 mot 9-lag, och det här är bankens enda skadeförebyggande övning för spelformen, ett
      kärnområde som SvFF vill se två gånger i veckan. Använd väg 2 i stället. Sätt tillbaka
      spelare.max till 14, vilket ligger precis på taket per ledare, och skriv i organisationen att
      planka, sidohopp och höga knän tar upp till tre spelare, att enbenshopp och utfallssteg tar
      upp till två och att balansstationen alltid har två. Det ger femton platser, alltså marginal
      till fjorton. Tvåmetersavståndet håller: en cirkel i ytan 14 x 12 meter ger ungefär sex meter
      per station, och tre platser med två meters lucka tar fyra. Ytan ska inte växa, undantag 3
      gäller. Behåll meningen om att en spelare kan göra en station två gånger i rad, så att
      balansstationen alltid får ett par.
