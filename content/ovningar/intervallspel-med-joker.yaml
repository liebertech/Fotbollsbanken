schema: 1
id: intervallspel-med-joker
namn: Intervallspel två mot två till tre mot tre med joker
syfte: Spelarna ska hålla hög intensitet i korta spelperioder, ställa om direkt vid bollvinst och
  ta emot och spela vidare med få touchar när pulsen är hög.
beskrivning: |
  Två lag möts på en yta om 33 x 20 meter med ett minimål i varje ände och
  ingen målvakt, så att spelet går fort. Spelet består av perioder med
  arbete och vila. Två mot två spelar en och en halv minut och vilar en och
  en halv. Tre mot tre, med eller utan joker, spelar två till tre minuter och
  vilar en och en halv. Antalet perioder följer tiden: ungefär två perioder
  på åtta minuter och fem till åtta på tjugofem minuter. Under vilan passar
  spelarna lugnt i par vid sidan av ytan och dricker. Laget som vinner bollen
  ställer om direkt mot motståndarnas mål. Jokern spelar alltid med laget som
  har bollen och får inte göra mål.
organisation: |
  Två lag om två till tre spelare, plus en joker vid udda antal: fyra
  spelare är två mot två, fem är två mot två och joker, sex är tre mot tre
  och sju är tre mot tre och joker. Jokern byts efter varje period. Spelarna
  numreras och jokern är nästa nummer i tur och ordning, så att ingen är
  joker två perioder i rad. Den som var joker går in i det lag som den nya
  jokern lämnade. Mål räknas bara i minimålen. Efter mål startar laget som
  släppte in, och efter utboll laget som inte rörde bollen sist, med en ny
  boll från sin kortlinje. Spelet
  används i delen Spelövning eller i delen Spel, och den som vill hålla
  intervallerna längre ökar antalet perioder, inte periodernas längd.
fokusomraden:
  - uthallighet
  - omstallning
  - spelbarhet
alder:
  min: 15
  max: 19
spelformer:
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
  - del-spel
ledarbehov: 0
spelare:
  min: 4
  max: 7
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 18
  langst: 25
yta:
  alla:
    langd: 33
    bredd: 20
ytreferens:
  alla: ungefär tre fjärdedelar av stora planens straffområde, några steg djupare
material:
  - typ: minimal
    antal: 2
  - typ: vast
    antal: 4
    anteckning: tre till det ena laget och en till jokern
  - typ: boll
    antal: 4
    anteckning: några i reserv vid målen
  - typ: kon
    antal: 4
    anteckning: markerar ytans hörn
coachningspunkter:
  - Ställ om direkt när bollen byter lag, första passningen framåt.
  - Spela på få touchar, ta emot med kroppen vänd mot spelet.
  - Håll tempot under hela perioden och vila ordentligt i pausen.
  - Jokern erbjuder sig hela tiden åt det lag som har bollen.
varianter:
  lattare: Kortare perioder, en minut spel och en och en halv minut vila, och ingen begränsning av touchar.
  svarare: Högst två touchar per spelare, och ett mål räknas först när alla i laget utom jokern har
    rört bollen under anfallet.
anpassning:
  fler_spelare: Vid fler än sju spelare delas gruppen i två spel på varsin yta. Två ytor ryms bredvid
    varandra på en kvarts plan, upp till fjorton spelare.
  udda_antal: En joker som spelar med laget som har bollen och byts efter varje period, i tur och
    ordning efter spelarnas nummer.
  ledare: Övningen är självgående när perioderna är satta. Ledaren håller tiden på arbete och vila
    och ser till att ingen går över sin puls.
planskiss:
  version: 1
  omrade:
    langd: 33
    bredd: 20
  beskrivning: >-
    Yta 33 x 20 meter med ett minimål i varje ände, utan målvakt. Två mot två i grundläget. A2
    driver in mellan försvararna och skjuter från cirka 10 meter. Vid udda antal blir en spelare joker
    som spelar med laget som har bollen, men bilden visar ett lag med en spelare mer. Lag A anfaller åt
    höger.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 33, bredd: 20, stil: heldragen }
    - { id: mal-a, typ: mal, x: 0, y: 10, storlek: smamal, riktning: hoger }
    - { id: mal-b, typ: mal, x: 33, y: 10, storlek: smamal, riktning: vanster }
    - { id: a1, typ: spelare, x: 8, y: 5, lag: a, etikett: A1 }
    - { id: a2, typ: spelare, x: 8, y: 15, lag: a, etikett: A2 }
    - { id: b1, typ: spelare, x: 22, y: 5, lag: b, etikett: B1 }
    - { id: b2, typ: spelare, x: 22, y: 15, lag: b, etikett: B2 }
    - { typ: boll, x: 8.9, y: 5 }
  rorelser:
    - { typ: passning, fran: { objekt: a1 }, till: { objekt: a2 }, ordning: 1 }
    - { typ: dribbling, fran: { objekt: a2 }, till: { x: 23, y: 10 }, ordning: 2 }
    - { typ: skott, fran: { x: 23, y: 10 }, till: { objekt: mal-b }, ordning: 3 }
  skalning:
    strategi: platser
    platser:
      - { x: 14, y: 4, lag: a }
      - { x: 28, y: 16, lag: b }
      - { x: 18, y: 17, lag: neutral }
kalla: Egen övning, inspirerad av vanligt intervallspel i smålag med joker.
status: granskad
granskning:
  - datum: 2026-10-08
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter fyra småfel som jag har rättat själv. Intervaller bara för 15-19 år enligt F3,
      arbete och vila i minuter (designregel 16), och både Spelövning och Spel enligt F4. 94
      kvadratmeter per spelare vid sju (golv 90) och 165 vid fyra (tak 273). Två ytor ryms på
      kvarts plan. Rättat: 1. "Fyra till sex perioder" gick inte ihop med kortast åtta minuter. Nu
      följer antalet perioder tiden, ungefär två på åtta minuter och fem till åtta på tjugofem. 2.
      Jokerbytet sa inte vart den förra jokern tar vägen. Nu går den in i laget som den nya jokern
      lämnade (designregel 15). 3. Omstarten efter utboll sa "laget som släppte in". Nu startar
      laget som inte rörde bollen sist. 4. Den svårare varianten hade en mindre yta, 28 x 17,
      som ger 68 kvadratmeter per spelare vid sju, under golvet 90. Strukit. Kvar är två touchar och
      att alla utom jokern ska ha rört bollen, vilket är nivå 3 enligt designregel 19. Ytreferensen,
      ungefär tre fjärdedelar av stora planens straffområde, några steg djupare, håller: 30 x 20
      mot 33 x 20. Skissen är kontrollerad för hand: dribblingen går mitt emellan försvararna, 5,1
      meter från var och en, skottet går från 10 meter, och tre platser (a, b, joker) räcker till
      sju.
