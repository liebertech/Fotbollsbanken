kalla: Egen övning, inspirerad av allmänt kända positionsspel med portar.
status: granskad
granskning:
  - datum: 2026-10-08
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Håller, efter två småfel som jag har rättat själv. Uppbyggnad genom lagdelar i liten form:
      en poäng för en passning genom en port i mittzonen, två när laget sedan når en medspelare i
      motståndarnas bakre zon. Passning-mottagning, speluppbyggnad och spelbarhet är K för 10-12
      år. Djupledskravet gäller inte fas-10-12 (passuppbyggnad.md, Minsta längd). Jokern vid udda
      antal är rätt här, till skillnad från O7-06, eftersom övningen handlar om att hitta den fria
      och inte om att försvara efter bolltapp. Yta: 504 kvadratmeter ger 50,4 per spelare vid tio
      med jokern, över golvet 45. Rättat: 1. 504 / 4 = 126 kvadratmeter är 18 procent över taket
      107, och skälet saknades i organisation (regel 13). Nu står det: tre zoner och tre portar
      behöver platsen, och avståndet ger den som ska ta emot tid att bli fri. 2. Passningen genom
      porten var ritad som en böjd boll som gick 0,4 meter från en kon, eftersom spelarna inte stod
      i linje med porten, och den andra passningen gick till en punkt där ingen fanns. Nu står A1
      och A2 i linje med mittporten, passningen går rakt genom portens mitt, och A1 löper in i den
      bakre zonen genom luckan mellan portarna och får bollen där. Löpningen går minst 1,3 meter
      från spelare, koner och platser. Den tredje platsen för lag A flyttades från (11, 10), 1
      meter från passningen, till (12, 14). Ytreferensen ungefär två tredjedelar av stora planens
      straffområde stämmer (504 mot 445 kvadratmeter).
