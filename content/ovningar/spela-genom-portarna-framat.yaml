schema: 1
id: spela-genom-portarna-framat
namn: Spela genom portarna framåt
syfte: Spelarna ska bygga upp spelet genom lagdelarna med passningar framåt som kamraterna kan ta emot.
beskrivning: |
  Ytan är 28 x 18 meter och delas på längden i tre zoner. Den bakre zonen vid varje kortsida är
  7 meter djup. Mittzonen är 14 meter djup och har tre konportar, två meter breda, på en rad tvärs
  över ytan. Två lag spelar mot varandra. Ett lag får en poäng när det spelar en passning genom en
  port i mittzonen till en medspelare som tar emot bollen på andra sidan. Laget får två poäng när det
  därefter passar vidare till en medspelare som tar emot i motståndarnas bakre zon. Det är uppbyggnad
  genom lagdelar i liten form. Vid poäng startar motståndarna om med boll från sin egen bakre zon.
  Lagen anfaller åt var sitt håll och byter håll efter varje period om fyra till fem minuter.
organisation: |
  En yta på 28 x 18 meter per grupp om fyra till tio spelare, med två lag. Fyra spelare ger två
  mot två, tio ger fem mot fem. Vid udda antal blir en spelare joker, som spelar med laget som har
  bollen och inte får ta emot i den bakre zonen. Är ni fler än tio bygger ni en yta till bredvid med
  tre meters mellanrum. Två ytor ryms på en kvarts plan.
fokusomraden:
  - passning-mottagning
  - speluppbyggnad
  - spelbarhet
alder:
  min: 10
  max: 12
spelformer:
  - 5mot5
  - 7mot7
  - 9mot9
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 4
  max: 10
grupptyp: tva-lag
tid:
  kortast: 6
  rekommenderad: 12
  langst: 15
yta:
  alla:
    langd: 28
    bredd: 18
ytreferens:
  alla: ungefär två tredjedelar av stora planens straffområde
material:
  - typ: kon
    antal: 14
    anteckning: sex till portarna, fyra till hörnen och fyra till zongränserna
  - typ: boll
    antal: 3
  - typ: vast
    antal: 5
    anteckning: till det ena laget
coachningspunkter:
  - Spela genom porten till en kompis som visar sig.
  - Ta emot i rörelse och titta framåt direkt.
  - Rör er i lagdelar, så att det alltid finns en fri spelare att passa till.
varianter:
  lattare: Bara den första poängen räknas, och ingen får stå i en port.
  svarare: Högst två touchar per spelare, och portarna görs en meter smalare.
anpassning:
  fler_spelare: Bygg en yta till bredvid med samma mått. Två ytor ryms på en kvarts plan.
  udda_antal: En joker spelar med laget som har bollen och får inte ta emot i den bakre zonen.
  ledare: Övningen är självgående. Ledaren kan hålla tiden för perioderna.
