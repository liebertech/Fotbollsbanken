schema: 1
id: spela-ut-bakifran
namn: Spela ut bakifrån
syfte: Spelarna ska spela ut bollen från målvakten och ta sig vidare framåt under press.
beskrivning: |
  Sju spelare delas i ett uppspelslag med målvakt och tre utespelare och tre spelare som
  pressar, på en yta om 30 x 20 meter med ett mål i ena änden. Uppspelslaget ska spela ut
  från målvakten och ta sig igenom pressen till motsatt kortlinje, medan de tre pressar på
  riktigt för att vinna bollen. Rollerna byts efter en lyckad genomspelning eller efter en
  bestämd tid.
organisation: |
  En grupp om sju spelare per yta: målvakt plus sex utespelare, varav tre pressar.
  Ledaren styr byte av roller.
fokusomraden:
  - speluppbyggnad
  - malvaktsspel
alder:
  min: 10
  max: 12
spelformer:
  - 7mot7
niva:
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 1
ledaruppgift: Ledaren styr när rollerna byts och påminner målvakten om att lägga ner bollen och
  spela med fötterna i stället för att sparka ut den.
spelare:
  min: 7
  max: 7
grupptyp: fast-storlek
udda_antal_losning: true
tid:
  kortast: 10
  rekommenderad: 12
  langst: 15
yta:
  alla:
    langd: 30
    bredd: 20
ytreferens:
  alla: ungefär stora planens straffområde
material:
  - typ: mal
    antal: 1
  - typ: vast
    antal: 3
    anteckning: till de tre som pressar
  - typ: boll
    antal: 2
  - typ: kon
    antal: 4
    anteckning: markerar ytans hörn
coachningspunkter:
  - Målvakten lägger ner bollen och passar med fötterna, sparkar inte ut den.
  - Sprid ut er i bredd så att det finns passningsvägar.
  - Titta upp innan du tar emot bollen så att du vet var pressen kommer ifrån.
varianter:
  lattare: Bara en spelare pressar i stället för tre.
  svarare: Sätt en tidsgräns för hur snabbt laget ska ta sig igenom pressen.
anpassning:
  fler_spelare: Bygg en andra yta med samma uppställning bredvid.
  udda_antal: En spelare vilar och byter in med den som var mest aktiv i pressen.
  ledare: Utan extra ledare får den ordinarie ledaren också hålla koll på tiden för rollbyte.
planskiss:
  version: 1
  omrade:
    langd: 30
    bredd: 20
  beskrivning: >-
    Yta 30 x 20 meter med ett mål och en målvakt på vänstra kortsidan. Uppspelslaget,
    målvakt plus tre utespelare, spelar ut mot tre pressande spelare och ska ta sig
    till motsatt kortlinje. Lag A anfaller åt höger.
  objekt:
    - { typ: ruta, x: 0, y: 0, langd: 30, bredd: 20, stil: streckad }
    - { id: mal-1, typ: mal, x: 0, y: 10, storlek: 7mot7, riktning: hoger }
    - { id: mv, typ: spelare, x: 2, y: 10, lag: a, malvakt: true, etikett: MV }
    - { id: a1, typ: spelare, x: 8, y: 4, lag: a }
    - { id: a2, typ: spelare, x: 8, y: 16, lag: a }
    - { id: a3, typ: spelare, x: 14, y: 10, lag: a }
    - { id: b1, typ: spelare, x: 18, y: 6, lag: b }
    - { id: b2, typ: spelare, x: 18, y: 14, lag: b }
    - { id: b3, typ: spelare, x: 22, y: 10, lag: b }
    - { typ: boll, x: 2.8, y: 10 }
  rorelser:
    - { typ: passning, fran: { objekt: mv }, till: { objekt: a3 }, ordning: 1 }
    - { typ: passning, fran: { objekt: a3 }, till: { objekt: a1 }, ordning: 2 }
    - { typ: lopning, fran: { objekt: b1 }, till: { x: 12, y: 6 }, ordning: 3 }
  skalning:
    strategi: koer
    koer:
      - { vid: b3, riktning: 90, avstand: 1.5, etikett: "Vilande, byter in" }
kalla: Egen övning, inspirerad av speluppbyggnad som utnyttjar retreatlinjen i 7 mot 7.
status: godkand
granskning:
  - datum: 2026-09-12
    av: fotbollsexpert
    roll: fotbollsexpert
    kommentar: >-
      Speluppbyggnad från målvakten är kärninnehåll i 7 mot 7, eftersom retreatlinjen ger tid och
      målvakten inte får sparka ut bollen ur händerna, och coachningspunkten om att lägga ner bollen
      och passa är korrekt. Jag avgjorde de två frågorna så här. Antalet sju behålls, alltså målvakt
      och tre som bygger upp mot tre som pressar. Tre utespelare räcker för att skapa bredd och en
      passningsväg framåt, och fler skulle göra ytan trång. Däremot ändrade jag syftet, eftersom
      lagdelar är ett begrepp för 9 mot 9 och äldre. Syftet handlar nu om att spela ut från
      målvakten och vidare framåt, vilket är det fokusomraden.md menar med speluppbyggnad i den här
      åldern. Jag tog också bort ordet passiva. Övningen ligger i spelövningsdelen och på nivå 2 och
      3, och där ska pressen vara verklig, precis som coachningspunkterna förutsätter. Den lättare
      varianten med bara en pressande spelare är rätt sätt att sänka svårigheten. Jag lade till fyra
      koner för att märka ut ytan.
  - datum: 2026-09-14
    av: benbom
    roll: redaktör
    kommentar: "Godkänd genom merge av pull request #4."
