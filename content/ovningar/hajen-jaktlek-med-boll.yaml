schema: 1
id: hajen-jaktlek-med-boll
namn: Hajen, jaktlek med boll
syfte: Spelarna ska driva bollen nära foten, titta upp och hitta luckor när någon försöker ta bollen.
beskrivning: |
  Rutan är 22 x 15 meter. Fiskarna har varsin boll och står på ena kortsidan. Två hajar utan boll
  står i mitten av rutan. På signal ska fiskarna driva bollen över rutan till den andra kortsidan,
  och hajarna försöker peta ut en boll ur rutan. Hajarna spelar bara på bollen, aldrig på benen,
  och ingen tacklar bakifrån. Den som tappar sin boll ur rutan lägger den vid sidan och blir haj
  i nästa omgång. Nu springer fiskarna tillbaka åt andra hållet. När bara två fiskar är kvar
  börjar en ny omgång med två nya hajar, som turas om så att alla får vara haj. Ingen står still
  och väntar, eftersom den som tappar bollen direkt blir haj.
organisation: |
  En ruta på 22 x 15 meter per grupp om sex till tolv spelare, med en kon i varje hörn. Två
  spelare är hajar, resten fiskar med varsin boll. Med sex spelare är det fyra fiskar på en stor
  yta (ungefär 55 kvadratmeter per spelare), och det är avsiktligt: fiskarna behöver plats att
  välja väg på när två hajar jagar. Är ni fler än tolv bygger ni en andra ruta bredvid, med tre
  meters mellanrum. Hajarna byts i tur och ordning, och ledaren ropar start och byte.
fokusomraden:
  - lek
  - dribbling
  - bollkansla
alder:
  min: 8
  max: 9
spelformer:
  - 3mot3
  - 5mot5
  - 7mot7
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
  - del-spelovning
ledarbehov: 0
spelare:
  min: 6
  max: 12
grupptyp: fri
tid:
  kortast: 5
  rekommenderad: 8
  langst: 10
yta:
  alla:
    langd: 22
    bredd: 15
ytreferens:
  alla: ungefär halva stora planens straffområde
material:
  - typ: boll
    antal: 10
    anteckning: en per fisk, alltså högst tio per ruta
  - typ: kon
    antal: 4
    anteckning: hörnen på rutan
  - typ: vast
    antal: 2
    anteckning: till hajarna
coachningspunkter:
  - Håll bollen nära foten och titta upp, välj luckan.
  - Skydda bollen med kroppen när hajen kommer.
  - Byt riktning och fart, så hinner hajen inte med.
varianter:
  lattare: En haj i stället för två, och hajen får bara gå, inte springa, de första fem sekunderna.
  svarare: Tre hajar, eller så ska fisken göra en vändning i en målzon vid kortsidan innan den får
    driva tillbaka.
anpassning:
  fler_spelare: Mer än tolv spelare delas på två rutor med samma mått. Varje ruta har två hajar.
  udda_antal: Spelar ingen roll. Antalet hajar är alltid två, och resten är fiskar.
  ledare: Övningen är självgående. Ledaren ropar start och byte och kan se till att alla får vara haj.
