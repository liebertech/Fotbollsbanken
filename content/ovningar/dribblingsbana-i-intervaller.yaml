schema: 1
id: dribblingsbana-i-intervaller
namn: Dribblingsbana i intervaller
syfte: Spelarna ska hålla hög kvalitet på bollföring, vändning och acceleration med boll när
  de är trötta, och bygga uthållighet och koordination med bollen vid foten.
beskrivning: |
  En sluten bana på en yta om 36 x 20 meter, med varje spelare på egen boll.
  Banan går i ett varv: först slalom mellan fem koner med bollen, sedan en
  sträcka där spelaren passar bollen lätt längs en smal bollbana, springer över
  tre låga hinder bredvid och tar upp bollen vid banans slut, där en kon
  stoppar den. Därefter en vändning med bollen runt en kon och en acceleration
  med bollen längs hela undre raksträckan, och tillbaka upp längs vänstra
  kortsidan till starten. Spelarna startar fem sekunder efter varandra och
  varvar i jämnt tempo. Arbetet är tre minuter, sedan vilar spelarna en och en
  halv minut och går lugnt eller passar i par. Spelaren ska klara lika många
  varv i varje omgång.
organisation: |
  Upp till tio spelare i taget på banan, var och en med egen boll. Banan är
  bestämd och delarna korsar inte varandra, med minst två meter mellan dem.
  Spelarna ställer sig i kö vid starten på vänstra kortsidan och startar fem
  sekunder efter den förra. Fyra till fem omgångar om tre minuters arbete och
  en och en halv minuts vila. Med elva till tjugo spelare delas gruppen i två
  lika stora halvor som växlar: den ena halvan arbetar tre minuter medan
  den andra vilar, och därefter byter de. Då räcker det med tre omgångar per
  halva. Den som är först i kön startar först i varje omgång, och den som var
  sist i förra omgången är först i nästa. Hindren är låga, till exempel
  markeringsplattor, så att ingen kan snubbla svårt.
fokusomraden:
  - uthallighet
  - dribbling
  - koordination
alder:
  min: 15
  max: 19
spelformer:
  - 9mot9
  - 11mot11
niva:
  - niva-1
  - niva-2
  - niva-3
passdelar:
  - del-ovning
ledarbehov: 0
spelare:
  min: 4
  max: 20
grupptyp: fri
tid:
  kortast: 8
  rekommenderad: 16
  langst: 20
yta:
  alla:
    langd: 36
    bredd: 20
material:
  - typ: boll
    antal: 10
    anteckning: en per spelare på banan
  - typ: kon
    antal: 8
    anteckning: fem till slalomen, en som stopp i bollbanan och en till vändningen
  - typ: hinder
    antal: 3
    anteckning: låga hinder, till exempel markeringsplattor eller låga stavar
coachningspunkter:
  - Håll bollen nära foten genom slalomen, titta upp mellan touchar.
  - Lägg inte tid på att vara snygg i vändningen, ta ett litet steg och accelerera ut.
  - Hela raksträckan är fart, driv bollen framför dig och håll kroppen över bollen.
  - Håll samma tempo i varje varv, vila ordentligt i pausen.
varianter:
  lattare: Gå eller jogga banan i lugnt tempo, och hoppa över hindren utan att passa bollen längs bollbanan.
  svarare: Slalomen på färre touchar, och i vändningen ska bollen tas med den svagare foten. Varje
    varv ska klaras på en bestämd tid, 40 sekunder.
anpassning:
  fler_spelare: Vid fler än tio spelare delas gruppen i två halvor som växlar mellan arbete och
    vila, med tre omgångar per halva.
  udda_antal: Spelar ingen roll. Spelarna arbetar var för sig, och en halva kan vara en spelare större.
  ledare: Övningen är självgående när banan är byggd. Ledaren håller tiden på arbete och vila och
    rättar tekniken i vändningen.
