schema: 1
id: spelvandning-byt-sida-och-gor-mal
namn: "Spelvändning: byt sida och gör mål"
syfte: Spelarna ska hålla bollen över flera passningar, vända spelet från en sida till den andra och
  utnyttja ytan som uppstår.
beskrivning: |
  Två lag möts på en yta om 38 x 28 meter med ett minimål i varje ände och ingen
  målvakt. Längs varje långsida finns en kantzon, fyra meter bred. Ett mål
  räknas dubbelt om bollen under anfallet har tagits emot i båda kantzonerna,
  alltså om laget har vänt spelet, och annars enkelt. Ingen får stå kvar i en
  kantzon: man löper in, tar emot och spelar vidare. Ingen offside gäller.
  Efter mål eller utboll startar laget som släppte in med en ny boll från sin
  kortlinje. Laget utan boll försvarar kompakt mot bollen och försöker
  stänga av vändningen.
organisation: |
  Två lag om tre till fem spelare, plus en joker vid udda antal: sex är tre mot
  tre, sju är tre mot tre och joker, åtta är fyra mot fyra, nio är fyra mot fyra
  och joker, tio är fem mot fem och elva är fem mot fem och joker. Jokern
  spelar med laget som har bollen och får inte göra mål. Spelarna numreras,
  och jokern är nästa nummer i tur och ordning efter varje period, så att
  ingen är joker två perioder i rad. Spela perioder om fyra minuter med en
  minuts vila, och byt sida mellan perioderna.
fokusomraden:
  - spelbarhet
  - passning-mottagning
  - speluppbyggnad
alder:
  min: 13
  max: 19
spelformer:
  - 7mot7
  - 9mot9
  - 11mot11
niva:
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 0
spelare:
  min: 6
  max: 11
grupptyp: tva-lag
tid:
  kortast: 8
  rekommenderad: 15
  langst: 25
yta:
  alla:
    langd: 38
    bredd: 28
ytreferens:
  alla: ungefär stora planens straffområde, nästan dubbelt så djupt
material:
  - typ: minimal
    antal: 2
  - typ: vast
    antal: 6
    anteckning: fem till det ena laget och en till jokern
  - typ: boll
    antal: 5
  - typ: kon
    antal: 8
    anteckning: fyra markerar ytans hörn och fyra kantzonernas inre hörn
coachningspunkter:
  - Vänd spelet snabbt när den andra sidan är öppen, en bra passning över ytan.
  - Löp in i kantzonen, ta emot och spela vidare, stå aldrig kvar.
  - Håll bollen när det inte finns en öppning, tålamod i anfallet.
  - Försvara kompakt och tvinga motståndarna att vända tillbaka.
varianter:
  lattare: Ett mål räknas efter bara en kantzon, så att laget inte måste vända hela spelet.
  svarare: Högst två touchar i kantzonen, och laget har bara tjugo sekunder på sig från start
    av anfallet.
anpassning:
  fler_spelare: Vid fler än elva spelare byggs en andra yta bredvid med samma mått, eller så turas
    de som är över om att vara avbytare efter varje period.
  udda_antal: En joker som spelar med laget som har bollen och inte får göra mål. Jokern är nästa
    nummer i tur och ordning efter varje period.
  ledare: Övningen är självgående när zonerna och poängen är satta. Ledaren håller tiden på
    perioderna och räknar vändningarna.
