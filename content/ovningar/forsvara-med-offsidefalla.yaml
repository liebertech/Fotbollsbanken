schema: 1
id: forsvara-med-offsidefalla
namn: Försvara med offsidefälla
syfte: Spelarna ska försvara tillsammans som lag och använda offsideregeln för att vinna
  tillbaka initiativet.
beskrivning: |
  Två lag om fyra utespelare och varsin målvakt möts på en yta om 42 x 28 meter med mål i
  var ände. Vanliga regler gäller, inklusive offside: laget utan boll ska hålla en
  gemensam linje och stiga upp tillsammans för att spela motståndarnas anfallare offside,
  i stället för att en och en falla tillbaka. Så fort bollen vinns ska laget ställa om
  snabbt och söka djup innan motståndarna hinner organisera sig.
organisation: |
  Två lag om fyra utespelare plus varsin målvakt, totalt tio spelare per yta. Är gruppen
  åtta eller nio spelare spelas tre mot tre med målvakt, och den nionde blir en extra
  utespelare i ena laget. Ledaren dömer offside från sidan.
fokusomraden:
  - forsvarsspel
  - omstallning
alder:
  min: 13
  max: 14
spelformer:
  - 9mot9
niva:
  - niva-2
  - niva-3
passdelar:
  - del-spelovning
ledarbehov: 1
ledaruppgift: Ledaren dömer offside från sidan och fryser spelet kort för att visa när
  linjen inte höll ihop.
spelare:
  min: 8
  max: 10
grupptyp: tva-lag
tid:
  kortast: 10
  rekommenderad: 15
  langst: 18
yta:
  alla:
    langd: 42
    bredd: 28
material:
  - typ: mal
    antal: 2
  - typ: vast
    antal: 4
    anteckning: till det ena laget
  - typ: boll
    antal: 3
coachningspunkter:
  - Stig upp tillsammans, hela linjen på en gång, inte en spelare i taget.
  - Kommunicera högt med varandra om när ni håller linjen.
  - Ställ om snabbt och sök djup så fort ni vinner bollen.
varianter:
  lattare: Försvararna får ett extra ord från ledaren, "stig", som signal för när linjen
    ska stiga upp.
  svarare: Poäng till försvararna för varje lyckad offsidefälla, utöver poängen för mål.
anpassning:
  fler_spelare: Gör ytan större, upp mot 48 x 32 meter, och spela med fler utespelare i
    varje lag.
  udda_antal: Ett lag spelar med en utespelare mer i stället för att sakna målvakt.
  ledare: En ledare krävs för att döma offside rättvist. Utan extra ledare håller den
    ordinarie ledaren i både domandet och coachningen.
kalla: Egen övning, inspirerad av lagförsvar med offsidefälla i 9 mot 9 och äldre.
status: utkast
granskning: []
